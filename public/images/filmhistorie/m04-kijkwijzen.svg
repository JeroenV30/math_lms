<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Arial, sans-serif" font-size="12">
<title>Hoe films de kijker bereiken: van bioscoop tot streaming, 1895 tot nu</title>
<rect width="700" height="300" fill="#ffffff"/>
<g stroke="#d5dae0"><line x1="60" y1="40" x2="60" y2="230"/><line x1="170" y1="40" x2="170" y2="230"/><line x1="280" y1="40" x2="280" y2="230"/><line x1="390" y1="40" x2="390" y2="230"/><line x1="500" y1="40" x2="500" y2="230"/></g>
<line x1="60" y1="230" x2="640" y2="230" stroke="#1f2933" stroke-width="2"/>
<g fill="#1f2933" text-anchor="middle"><text x="60" y="248">1895</text><text x="170" y="248">1925</text><text x="280" y="248">1955</text><text x="390" y="248">1985</text><text x="500" y="248">2015</text></g>
<g font-weight="bold">
<rect x="60" y="50" width="481" height="22" fill="#3b5bdb" opacity="0.5"/><text x="66" y="66" fill="#1f2933">Bioscoop</text>
<rect x="262" y="85" width="279" height="22" fill="#9c6b30" opacity="0.5"/><text x="268" y="101" fill="#1f2933">Televisie</text>
<rect x="357" y="120" width="125" height="22" fill="#1f2933" opacity="0.3"/><text x="363" y="136" fill="#1f2933">Video, dvd</text>
<rect x="471" y="155" width="70" height="22" fill="#3b5bdb" opacity="0.35"/><text x="477" y="171" fill="#1f2933">Streaming</text>
</g>
<text x="350" y="280" text-anchor="middle" fill="#1f2933">Elke nieuwe wijze van kijken kwam erbij; de oudere verdween niet. Schematisch, afgeronde jaartallen.</text>
</svg>
