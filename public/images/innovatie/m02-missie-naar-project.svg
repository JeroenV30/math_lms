<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">Van missie naar project: de lagen van het innovatiebeleid</text>
  <g stroke="#1f2933" stroke-width="1.5">
    <rect x="40" y="50" width="400" height="48" fill="#dbe4ff"/>
    <rect x="40" y="116" width="400" height="48" fill="#dbe4ff"/>
    <rect x="40" y="182" width="400" height="48" fill="#f1e3cf"/>
    <rect x="40" y="248" width="400" height="48" fill="#c9f0d5"/>
  </g>
  <g fill="#1f2933">
    <text x="56" y="72" font-weight="bold">Missies en Nationale Technologiestrategie</text>
    <text x="56" y="89">de richting: opgave met doel en jaartal</text>
    <text x="56" y="138" font-weight="bold">Kennis- en Innovatieagenda's (KIA's)</text>
    <text x="56" y="155">welk onderzoek en welke innovatie nodig zijn</text>
    <text x="56" y="204" font-weight="bold">Regelingen en programma's</text>
    <text x="56" y="221">MIT, PPS-toeslag, Innovatiekrediet, Eurostars, NWO</text>
    <text x="56" y="270" font-weight="bold">Innovatieprojecten</text>
    <text x="56" y="287">bedrijven en kennisinstellingen samen</text>
  </g>
  <g stroke="#3b5bdb" stroke-width="2" fill="none">
    <path d="M240 98 L240 116"/><path d="M240 164 L240 182"/><path d="M240 230 L240 248"/>
    <path d="M236 110 L240 116 L244 110"/><path d="M236 176 L240 182 L244 176"/><path d="M236 242 L240 248 L244 242"/>
  </g>
  <g fill="#1f2933">
    <text x="470" y="78" font-weight="bold">Kader</text>
    <text x="470" y="95">kabinet, ministeries</text>
    <text x="470" y="144" font-weight="bold">Agenda</text>
    <text x="470" y="161">bedrijven, kennis-</text><text x="470" y="177">instellingen, overheid</text>
    <text x="470" y="210" font-weight="bold">Uitvoering</text>
    <text x="470" y="227">RVO, NWO, TNO,</text><text x="470" y="243">Europese Commissie</text>
    <text x="470" y="276" font-weight="bold">Resultaat</text>
    <text x="470" y="293">een aanvraag verwijst omhoog</text>
  </g>
  <text x="360" y="325" text-anchor="middle" fill="#9c6b30">Een KIA of missie is geen subsidiepot: het geld loopt via de regelingen.</text>
</svg>
