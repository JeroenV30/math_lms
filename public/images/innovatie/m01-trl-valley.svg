<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">De TRL-schaal en de kloof tussen onderzoek en markt</text>
  <g stroke="#1f2933" stroke-width="1.5">
    <rect x="40" y="200" width="60" height="50" fill="#dbe4ff"/>
    <rect x="100" y="180" width="60" height="70" fill="#dbe4ff"/>
    <rect x="160" y="160" width="60" height="90" fill="#dbe4ff"/>
    <rect x="220" y="140" width="60" height="110" fill="#f1e3cf"/>
    <rect x="280" y="120" width="60" height="130" fill="#f1e3cf"/>
    <rect x="340" y="100" width="60" height="150" fill="#f1e3cf"/>
    <rect x="400" y="80" width="60" height="170" fill="#f1e3cf"/>
    <rect x="460" y="60" width="60" height="190" fill="#c9f0d5"/>
    <rect x="520" y="40" width="60" height="210" fill="#c9f0d5"/>
  </g>
  <g fill="#1f2933" text-anchor="middle" font-weight="bold">
    <text x="70" y="270">1</text><text x="130" y="270">2</text><text x="190" y="270">3</text>
    <text x="250" y="270">4</text><text x="310" y="270">5</text><text x="370" y="270">6</text>
    <text x="430" y="270">7</text><text x="490" y="270">8</text><text x="550" y="270">9</text>
  </g>
  <text x="130" y="292" text-anchor="middle" fill="#1f2933">onderzoek</text>
  <text x="340" y="292" text-anchor="middle" fill="#9c6b30">kloof: valley of death</text>
  <text x="520" y="292" text-anchor="middle" fill="#1f2933">markt</text>
  <text x="300" y="85" text-anchor="middle" fill="#3b5bdb">hier richt veel beleid zich op</text>
  <text x="620" y="130" fill="#1f2933">TRL 1 tot 3:</text><text x="620" y="146" fill="#1f2933">basis en concept</text>
  <text x="620" y="176" fill="#1f2933">TRL 4 tot 7:</text><text x="620" y="192" fill="#1f2933">ontwikkeling en</text><text x="620" y="208" fill="#1f2933">demonstratie</text>
  <text x="620" y="238" fill="#1f2933">TRL 8 tot 9:</text><text x="620" y="254" fill="#1f2933">introductie</text>
</svg>
