<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif" font-size="14">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" fill="#1f2933">Het bezettingsbestuur in Nederland (schema)</text>
  <g fill="#ffffff" stroke="#1f2933" stroke-width="1.5">
    <rect x="290" y="50" width="220" height="50"/>
    <rect x="90" y="150" width="240" height="60"/>
    <rect x="470" y="150" width="240" height="60"/>
    <rect x="90" y="270" width="240" height="60"/>
    <rect x="470" y="270" width="240" height="60"/>
  </g>
  <g stroke="#1f2933" stroke-width="1.5" fill="none">
    <line x1="400" y1="100" x2="400" y2="125"/><line x1="210" y1="125" x2="590" y2="125"/><line x1="210" y1="125" x2="210" y2="150"/><line x1="590" y1="125" x2="590" y2="150"/>
    <line x1="210" y1="210" x2="210" y2="270"/><line x1="590" y1="210" x2="590" y2="270"/>
  </g>
  <rect x="470" y="150" width="240" height="60" fill="none" stroke="#9c6b30" stroke-width="2.5"/>
  <rect x="470" y="270" width="240" height="60" fill="none" stroke="#9c6b30" stroke-width="2.5"/>
  <rect x="90" y="150" width="240" height="60" fill="none" stroke="#3b5bdb" stroke-width="2.5"/>
  <rect x="90" y="270" width="240" height="60" fill="none" stroke="#3b5bdb" stroke-width="2.5"/>
  <g fill="#1f2933" text-anchor="middle">
    <text x="400" y="72">Hitler</text><text x="400" y="90" font-size="12">Berlijn</text>
    <text x="210" y="176">Reichskommissar</text><text x="210" y="196" font-size="12">Seyss-Inquart (civiel bestuur)</text>
    <text x="590" y="176">Himmler (SS)</text><text x="590" y="196" font-size="12">via Höherer SS- und Polizeiführer Rauter</text>
    <text x="210" y="296">Secretarissen-generaal</text><text x="210" y="316" font-size="12">Nederlandse departementen</text>
    <text x="590" y="296">SS, Sicherheitsdienst, politie</text><text x="590" y="316" font-size="12">arrestaties en deportaties</text>
  </g>
  <text x="90" y="372" font-size="11" fill="#1f2933">Blauw: civiele lijn. Bruin: SS- en politielijn. Eigen vereenvoudigd schema.</text>
</svg>
