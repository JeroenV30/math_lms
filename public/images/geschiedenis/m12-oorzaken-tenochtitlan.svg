<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="sans-serif" font-size="12" role="img" aria-label="Oorzaakschema: meerdere samenwerkende oorzaken van de val van Tenochtitlan in 1521">
<rect width="600" height="330" fill="#fff"/>
<text x="300" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Waarom viel Tenochtitlan in 1521?</text>
<g fill="#fff" stroke="#9c6b30" stroke-width="1.5">
<rect x="20" y="40" width="230" height="52" rx="6"/>
<rect x="20" y="104" width="230" height="52" rx="6"/>
<rect x="20" y="168" width="230" height="52" rx="6"/>
<rect x="20" y="232" width="230" height="52" rx="6"/>
</g>
<g fill="#1f2933" text-anchor="middle">
<text x="135" y="62" font-weight="bold">Inheemse bondgenoten</text><text x="135" y="79" font-size="11">Tlaxcala, Texcoco en andere steden</text>
<text x="135" y="126" font-weight="bold">Epidemieën</text><text x="135" y="143" font-size="11">pokken vanaf eind 1520</text>
<text x="135" y="190" font-weight="bold">Verdeeldheid in het rijk</text><text x="135" y="207" font-size="11">tribuutplichtige steden, opvolging</text>
<text x="135" y="254" font-weight="bold">Wapens en tactiek</text><text x="135" y="271" font-size="11">staal, paarden, brigantijnen</text>
</g>
<g stroke="#9c6b30" stroke-width="1.5" fill="none">
<line x1="250" y1="66" x2="352" y2="140"/>
<line x1="250" y1="130" x2="352" y2="152"/>
<line x1="250" y1="194" x2="352" y2="168"/>
<line x1="250" y1="258" x2="352" y2="180"/>
</g>
<g fill="#9c6b30"><polygon points="352,140 342,141 346,149"/><polygon points="352,152 342,147 342,156"/><polygon points="352,168 342,164 342,173"/><polygon points="352,180 343,174 340,183"/></g>
<rect x="352" y="120" width="228" height="80" rx="8" fill="#eef1f5" stroke="#3b5bdb" stroke-width="2"/>
<g text-anchor="middle" fill="#1f2933">
<text x="466" y="153" font-weight="bold" font-size="13">Val van Tenochtitlan</text>
<text x="466" y="172" font-size="11">13 augustus 1521, na een beleg</text>
<text x="466" y="187" font-size="11">van ongeveer drie maanden</text>
</g>
<rect x="352" y="232" width="228" height="52" rx="6" fill="#fff" stroke="#3b5bdb" stroke-dasharray="5 3"/>
<g text-anchor="middle" fill="#1f2933">
<text x="466" y="254" font-weight="bold">Keuzes en toeval</text><text x="466" y="271" font-size="11">beslissingen van betrokkenen</text>
</g>
<line x1="466" y1="232" x2="466" y2="206" stroke="#3b5bdb" stroke-dasharray="5 3"/><polygon points="466,201 461,211 471,211" fill="#3b5bdb"/>
<text x="300" y="316" text-anchor="middle" font-size="11" fill="#6b7280">De oorzaken versterken elkaar: geen ervan is op zichzelf voldoende verklaring.</text>
</svg>
