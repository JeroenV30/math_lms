<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Mogelijke oorzaken van de industrialisatie in Engeland" font-family="sans-serif" font-size="14">
<rect width="800" height="420" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker></defs>
<text x="130" y="24" text-anchor="middle" font-weight="bold" fill="#9c6b30">Mogelijke oorzaken</text>
<text x="400" y="24" text-anchor="middle" font-weight="bold" fill="#9c6b30">Proces</text>
<text x="665" y="24" text-anchor="middle" font-weight="bold" fill="#9c6b30">Gevolgen</text>
<rect x="10" y="45" width="240" height="56" rx="6" fill="#fdf6ec" stroke="#9c6b30"/>
<text x="130" y="68" text-anchor="middle" fill="#1f2933" font-weight="bold">Landbouw en bevolking</text>
<text x="130" y="88" text-anchor="middle" fill="#1f2933" font-size="12">meer voedsel, meer mensen</text>
<line x1="250" y1="73" x2="318" y2="210" stroke="#1f2933" marker-end="url(#a)"/>
<rect x="10" y="117" width="240" height="56" rx="6" fill="#fdf6ec" stroke="#9c6b30"/>
<text x="130" y="140" text-anchor="middle" fill="#1f2933" font-weight="bold">Steenkool</text>
<text x="130" y="160" text-anchor="middle" fill="#1f2933" font-size="12">goedkope energie</text>
<line x1="250" y1="145" x2="318" y2="210" stroke="#1f2933" marker-end="url(#a)"/>
<rect x="10" y="189" width="240" height="56" rx="6" fill="#fdf6ec" stroke="#9c6b30"/>
<text x="130" y="212" text-anchor="middle" fill="#1f2933" font-weight="bold">Hoge lonen</text>
<text x="130" y="232" text-anchor="middle" fill="#1f2933" font-size="12">arbeid duur, machines lonen</text>
<line x1="250" y1="217" x2="318" y2="210" stroke="#1f2933" marker-end="url(#a)"/>
<rect x="10" y="261" width="240" height="56" rx="6" fill="#fdf6ec" stroke="#9c6b30"/>
<text x="130" y="284" text-anchor="middle" fill="#1f2933" font-weight="bold">Markten en katoen</text>
<text x="130" y="304" text-anchor="middle" fill="#1f2933" font-size="12">koloniën, handel, slavernij</text>
<line x1="250" y1="289" x2="318" y2="210" stroke="#1f2933" marker-end="url(#a)"/>
<rect x="10" y="333" width="240" height="56" rx="6" fill="#fdf6ec" stroke="#9c6b30"/>
<text x="130" y="356" text-anchor="middle" fill="#1f2933" font-weight="bold">Instituten en kennis</text>
<text x="130" y="376" text-anchor="middle" fill="#1f2933" font-size="12">eigendom, wetenschap, vakmensen</text>
<line x1="250" y1="361" x2="318" y2="210" stroke="#1f2933" marker-end="url(#a)"/>
<rect x="320" y="165" width="160" height="90" rx="8" fill="#edf2ff" stroke="#3b5bdb" stroke-width="2"/>
<text x="400" y="205" text-anchor="middle" fill="#1f2933">Machines, stoom,</text>
<text x="400" y="225" text-anchor="middle" fill="#1f2933">fabrieken, spoor</text>
<line x1="480" y1="210" x2="548" y2="110" stroke="#1f2933" marker-end="url(#a)"/>
<rect x="550" y="90" width="230" height="40" rx="6" fill="#edf2ff" stroke="#3b5bdb"/>
<text x="665" y="115" text-anchor="middle" fill="#1f2933">Verstedelijking</text>
<line x1="480" y1="210" x2="548" y2="180" stroke="#1f2933" marker-end="url(#a)"/>
<rect x="550" y="160" width="230" height="40" rx="6" fill="#edf2ff" stroke="#3b5bdb"/>
<text x="665" y="185" text-anchor="middle" fill="#1f2933">Fabrieksarbeid</text>
<line x1="480" y1="210" x2="548" y2="250" stroke="#1f2933" marker-end="url(#a)"/>
<rect x="550" y="230" width="230" height="40" rx="6" fill="#edf2ff" stroke="#3b5bdb"/>
<text x="665" y="255" text-anchor="middle" fill="#1f2933">Sociale kwestie</text>
<line x1="480" y1="210" x2="548" y2="320" stroke="#1f2933" marker-end="url(#a)"/>
<rect x="550" y="300" width="230" height="40" rx="6" fill="#edf2ff" stroke="#3b5bdb"/>
<text x="665" y="325" text-anchor="middle" fill="#1f2933">Wereldhandel</text>
<text x="400" y="405" text-anchor="middle" font-size="12" fill="#1f2933">Historici wegen deze oorzaken verschillend; er is geen consensus over de volgorde.</text></svg>