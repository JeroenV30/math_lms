<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Schematische route van de landbouw van de Vruchtbare Sikkel naar Anatolië, de Balkan, de Donau en Zuid-Limburg">
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="320" y="24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2933">De weg van de landbouw naar de Lage Landen (schematisch)</text>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5bdb"/></marker></defs>
  <g stroke="#3b5bdb" stroke-width="2" fill="none" marker-end="url(#b)">
    <line x1="548" y1="232" x2="466" y2="190"/>
    <line x1="410" y1="172" x2="338" y2="146"/>
    <line x1="290" y1="130" x2="214" y2="104"/>
    <line x1="166" y1="86" x2="108" y2="64"/>
  </g>
  <g font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
    <circle cx="578" cy="246" r="26" fill="#faf3e8" stroke="#9c6b30" stroke-width="1.5"/>
    <text x="578" y="243" font-size="11">Vruchtbare</text><text x="578" y="256" font-size="11">Sikkel</text>
    <text x="578" y="284" font-size="10" fill="#9c6b30">ca. 9000</text>
    <circle cx="438" cy="182" r="26" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="438" y="186" font-size="11">Anatolië</text>
    <text x="438" y="218" font-size="10" fill="#9c6b30">ca. 8000</text>
    <circle cx="314" cy="138" r="26" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="314" y="142" font-size="11">Balkan</text>
    <text x="314" y="174" font-size="10" fill="#9c6b30">ca. 6500</text>
    <circle cx="190" cy="95" r="26" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="190" y="92" font-size="11">Midden-</text><text x="190" y="105" font-size="11">Donau</text>
    <text x="190" y="132" font-size="10" fill="#9c6b30">ca. 5500</text>
    <circle cx="80" cy="54" r="26" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="80" y="51" font-size="11">Zuid-</text><text x="80" y="64" font-size="11">Limburg</text>
    <text x="80" y="92" font-size="10" fill="#9c6b30">ca. 5300</text>
  </g>
  <text x="320" y="292" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#52606d">Jaartallen (v.Chr.) zijn grove schattingen van de eerste boeren in elke regio. Schema, geen kaart.</text>
</svg>
