<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Georgia, serif" font-size="13">
<rect width="600" height="340" fill="#ffffff"/>
<text x="300" y="24" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="bold">Lagen van oorzaken bij de Beeldenstorm (1566)</text>
<g stroke="#1f2933" stroke-width="1.2" fill="#f7f3ea">
<rect x="20" y="44" width="400" height="48" rx="4"/>
<rect x="20" y="102" width="400" height="48" rx="4"/>
<rect x="20" y="160" width="400" height="48" rx="4"/>
<rect x="20" y="218" width="400" height="48" rx="4"/>
</g>
<g fill="#1f2933">
<text x="32" y="64" font-weight="bold">Lange termijn (structureel)</text>
<text x="32" y="82">Reformatie, ketterplakkaten, centralisatie onder Filips II</text>
<text x="32" y="122" font-weight="bold">Middellange termijn</text>
<text x="32" y="140">Bisdomhervorming 1559, groeiend calvinisme, Smeekschrift 1566</text>
<text x="32" y="180" font-weight="bold">Korte termijn (conjunctuur)</text>
<text x="32" y="198">Misoogst, hoge graanprijzen, werkloosheid in de textiel</text>
<text x="32" y="238" font-weight="bold">Aanleiding (incident)</text>
<text x="32" y="256">Hagepreken in de zomer; eerste aanval op 10 augustus</text>
</g>
<g stroke="#3b5bdb" stroke-width="2" fill="none">
<path d="M420 68 L470 150"/><path d="M420 126 L470 154"/><path d="M420 184 L470 160"/><path d="M420 242 L470 166"/>
</g>
<polygon points="478,152 466,142 466,162" fill="#3b5bdb"/>
<rect x="478" y="120" width="104" height="64" rx="4" fill="#3b5bdb"/>
<text x="530" y="148" text-anchor="middle" fill="#ffffff" font-weight="bold">Beeldenstorm</text>
<text x="530" y="166" text-anchor="middle" fill="#ffffff">augustus 1566</text>
<text x="20" y="296" fill="#9c6b30" font-style="italic">Een oorzaak werkt niet los: de lagen versterken elkaar.</text>
<text x="20" y="316" fill="#9c6b30" font-style="italic">De aanleiding bepaalt vooral wanneer en waar het begint.</text>
</svg>
