<rect x="560" y="44" width="220" height="44" rx="6" fill="#3b5bdb" opacity="0.12" stroke="#3b5bdb"/>
<text x="670" y="71" text-anchor="middle" font-size="12" fill="#1f2933">Stoomschip en spoor</text>
<line x1="560" y1="66" x2="482" y2="190" stroke="#1f2933" marker-end="url(#pijl)"/>
<rect x="560" y="106" width="220" height="44" rx="6" fill="#3b5bdb" opacity="0.12" stroke="#3b5bdb"/>
<text x="670" y="133" text-anchor="middle" font-size="12" fill="#1f2933">Kinine tegen malaria</text>
<line x1="560" y1="128" x2="482" y2="190" stroke="#1f2933" marker-end="url(#pijl)"/>
<rect x="560" y="168" width="220" height="44" rx="6" fill="#3b5bdb" opacity="0.12" stroke="#3b5bdb"/>
<text x="670" y="195" text-anchor="middle" font-size="12" fill="#1f2933">Machinegeweer</text>
<line x1="560" y1="190" x2="482" y2="190" stroke="#1f2933" marker-end="url(#pijl)"/>
<rect x="560" y="230" width="220" height="44" rx="6" fill="#3b5bdb" opacity="0.12" stroke="#3b5bdb"/>
<text x="670" y="257" text-anchor="middle" font-size="12" fill="#1f2933">Telegraaf</text>
<line x1="560" y1="252" x2="482" y2="190" stroke="#1f2933" marker-end="url(#pijl)"/>
<rect x="560" y="292" width="220" height="44" rx="6" fill="#3b5bdb" opacity="0.12" stroke="#3b5bdb"/>
<text x="670" y="319" text-anchor="middle" font-size="12" fill="#1f2933">Wapens en verdeel-en-heers</text>
<line x1="560" y1="314" x2="482" y2="190" stroke="#1f2933" marker-end="url(#pijl)"/>
<rect x="320" y="150" width="160" height="80" rx="8" fill="#fff" stroke="#1f2933" stroke-width="2"/>
<text x="400" y="182" text-anchor="middle" fill="#1f2933">Koloniale</text>
<text x="400" y="200" text-anchor="middle" fill="#1f2933">expansie</text>
<text x="400" y="216" text-anchor="middle" font-size="11" fill="#1f2933">ca. 1870–1914</text>
<text x="400" y="350" text-anchor="middle" font-size="12" fill="#1f2933">Motieven verklaren waarom, middelen verklaren of het kon.</text>
</svg>