<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Schema: motieven, middelen en rechtvaardigingen van het moderne imperialisme" font-family="sans-serif" font-size="13">
<rect width="800" height="380" fill="#fff"/>
<defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<text x="130" y="26" text-anchor="middle" font-weight="bold" fill="#9c6b30">Motieven</text>
<text x="670" y="26" text-anchor="middle" font-weight="bold" fill="#3b5bdb">Middelen</text>
<text x="400" y="26" text-anchor="middle" font-weight="bold" fill="#1f2933">Gevolg</text>
<rect x="20" y="44" width="220" height="44" rx="6" fill="#9c6b30" opacity="0.14" stroke="#9c6b30"/>
<text x="130" y="71" text-anchor="middle" font-size="12" fill="#1f2933">Economie: grondstoffen, markten</text>
<line x1="240" y1="66" x2="318" y2="190" stroke="#1f2933" marker-end="url(#pijl)"/>
<rect x="20" y="106" width="220" height="44" rx="6" fill="#9c6b30" opacity="0.14" stroke="#9c6b30"/>
<text x="130" y="133" text-anchor="middle" font-size="12" fill="#1f2933">Strategie: routes en steunpunten</text>
<line x1="240" y1="128" x2="318" y2="190" stroke="#1f2933" marker-end="url(#pijl)"/>
<rect x="20" y="168" width="220" height="44" rx="6" fill="#9c6b30" opacity="0.14" stroke="#9c6b30"/>
<text x="130" y="195" text-anchor="middle" font-size="12" fill="#1f2933">Prestige tussen grootmachten</text>
<line x1="240" y1="190" x2="318" y2="190" stroke="#1f2933" marker-end="url(#pijl)"/>
<rect x="20" y="230" width="220" height="44" rx="6" fill="#9c6b30" opacity="0.14" stroke="#9c6b30"/>
<text x="130" y="257" text-anchor="middle" font-size="12" fill="#1f2933">Zending en beschavingsmissie</text>
<line x1="240" y1="252" x2="318" y2="190" stroke="#1f2933" marker-end="url(#pijl)"/>
<rect x="20" y="292" width="220" height="44" rx="6" fill="#9c6b30" opacity="0.14" stroke="#9c6b30"/>
<text x="130" y="319" text-anchor="middle" font-size="12" fill="#1f2933">Rassendenken als rechtvaardiging</text>
