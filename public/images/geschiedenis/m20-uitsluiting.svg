<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="Zes stappen van uitsluiting tot deportatie in Nederland" font-family="sans-serif" font-size="12">
<rect width="800" height="330" fill="#fff"/>
<rect x="30" y="30" width="220" height="100" rx="6" fill="#fff" stroke="#3b5bdb" stroke-width="2"/>
<circle cx="52" cy="54" r="13" fill="#3b5bdb"/><text x="52" y="59" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<text x="74" y="59" font-weight="bold" fill="#1f2933">Okt-nov 1940</text>
<text x="46" y="90" fill="#1f2933">Ariërverklaring en</text>
<text x="46" y="110" fill="#1f2933">ontslag Joodse ambtenaren</text>
<rect x="290" y="30" width="220" height="100" rx="6" fill="#fff" stroke="#3b5bdb" stroke-width="2"/>
<circle cx="312" cy="54" r="13" fill="#3b5bdb"/><text x="312" y="59" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<text x="334" y="59" font-weight="bold" fill="#1f2933">Jan 1941</text>
<text x="306" y="90" fill="#1f2933">Registratie van alle</text>
<text x="306" y="110" fill="#1f2933">Joden in Nederland</text>
<rect x="550" y="30" width="220" height="100" rx="6" fill="#fff" stroke="#3b5bdb" stroke-width="2"/>
<circle cx="572" cy="54" r="13" fill="#3b5bdb"/><text x="572" y="59" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
<text x="594" y="59" font-weight="bold" fill="#1f2933">1941–1942</text>
<text x="566" y="90" fill="#1f2933">Persoonsbewijs met J,</text>
<text x="566" y="110" fill="#1f2933">verbod op openbare plaatsen</text>
<rect x="30" y="190" width="220" height="100" rx="6" fill="#fff" stroke="#3b5bdb" stroke-width="2"/>
<circle cx="52" cy="214" r="13" fill="#3b5bdb"/><text x="52" y="219" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
<text x="74" y="219" font-weight="bold" fill="#1f2933">3 mei 1942</text>
<text x="46" y="250" fill="#1f2933">Jodenster verplicht</text>
<text x="46" y="270" fill="#1f2933">vanaf zes jaar</text>
<rect x="290" y="190" width="220" height="100" rx="6" fill="#fff" stroke="#9c6b30" stroke-width="2"/>
<circle cx="312" cy="214" r="13" fill="#9c6b30"/><text x="312" y="219" text-anchor="middle" fill="#fff" font-weight="bold">5</text>
<text x="334" y="219" font-weight="bold" fill="#1f2933">Vanaf 15 juli 1942</text>
<text x="306" y="250" fill="#1f2933">Deportatie via</text>
<text x="306" y="270" fill="#1f2933">Westerbork</text>
<rect x="550" y="190" width="220" height="100" rx="6" fill="#fff" stroke="#9c6b30" stroke-width="2"/>
<circle cx="572" cy="214" r="13" fill="#9c6b30"/><text x="572" y="219" text-anchor="middle" fill="#fff" font-weight="bold">6</text>
<text x="594" y="219" font-weight="bold" fill="#1f2933">1943</text>
<text x="566" y="250" fill="#1f2933">Razzia's en ontruiming</text>
<text x="566" y="270" fill="#1f2933">van Joodse wijken</text>
<line x1="250" y1="80" x2="290" y2="80" stroke="#1f2933" stroke-width="2"/><polygon points="290,80 282,75 282,85" fill="#1f2933"/>
<line x1="510" y1="80" x2="550" y2="80" stroke="#1f2933" stroke-width="2"/><polygon points="550,80 542,75 542,85" fill="#1f2933"/>
<path d="M 660.0 130 L 660.0 160 L 140.0 160 L 140.0 180" fill="none" stroke="#1f2933" stroke-width="2"/><polygon points="140.0,188 135.0,180 145.0,180" fill="#1f2933"/>
<line x1="250" y1="240" x2="290" y2="240" stroke="#1f2933" stroke-width="2"/><polygon points="290,240 282,235 282,245" fill="#1f2933"/>
<line x1="510" y1="240" x2="550" y2="240" stroke="#1f2933" stroke-width="2"/><polygon points="550,240 542,235 542,245" fill="#1f2933"/>
<text x="30" y="312" font-size="10" fill="#1f2933">Blauw: uitsluiting en isolering. Bruin: deportatie. Schema van de hoofdlijn; de stappen overlapten elkaar in de tijd.</text></svg>