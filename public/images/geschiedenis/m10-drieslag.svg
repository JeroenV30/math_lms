<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" font-family="sans-serif" font-size="12" role="img" aria-label="Schema van het drieslagstelsel over drie jaar">
<rect width="600" height="290" fill="#fff"/>
<text x="300" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Het drieslagstelsel</text>
<text x="30" y="80" fill="#1f2933" font-weight="bold">Jaar 1</text>
<rect x="100" y="55" width="150" height="50" fill="#dbe4ff" stroke="#3b5bdb"/><text x="175" y="85" text-anchor="middle" fill="#1f2933">Wintergraan</text>
<rect x="260" y="55" width="150" height="50" fill="#e8dcc6" stroke="#9c6b30"/><text x="335" y="85" text-anchor="middle" fill="#1f2933">Zomergraan</text>
<rect x="420" y="55" width="150" height="50" fill="#f1f3f5" stroke="#3b5bdb"/><text x="495" y="85" text-anchor="middle" fill="#1f2933">Braak</text>
<text x="30" y="150" fill="#1f2933" font-weight="bold">Jaar 2</text>
<rect x="100" y="125" width="150" height="50" fill="#f1f3f5" stroke="#3b5bdb"/><text x="175" y="155" text-anchor="middle" fill="#1f2933">Braak</text>
<rect x="260" y="125" width="150" height="50" fill="#dbe4ff" stroke="#3b5bdb"/><text x="335" y="155" text-anchor="middle" fill="#1f2933">Wintergraan</text>
<rect x="420" y="125" width="150" height="50" fill="#e8dcc6" stroke="#9c6b30"/><text x="495" y="155" text-anchor="middle" fill="#1f2933">Zomergraan</text>
<text x="30" y="220" fill="#1f2933" font-weight="bold">Jaar 3</text>
<rect x="100" y="195" width="150" height="50" fill="#e8dcc6" stroke="#9c6b30"/><text x="175" y="225" text-anchor="middle" fill="#1f2933">Zomergraan</text>
<rect x="260" y="195" width="150" height="50" fill="#f1f3f5" stroke="#3b5bdb"/><text x="335" y="225" text-anchor="middle" fill="#1f2933">Braak</text>
<rect x="420" y="195" width="150" height="50" fill="#dbe4ff" stroke="#3b5bdb"/><text x="495" y="225" text-anchor="middle" fill="#1f2933">Wintergraan</text>
<text x="300" y="275" text-anchor="middle" fill="#1f2933" font-size="11">Elk jaar schuift het patroon een akker door; steeds ligt een derde braak.</text>
</svg>
