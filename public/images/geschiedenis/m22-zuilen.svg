<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 360" role="img" aria-label="Schema van de vier zuilen met partij, krant, omroep, vakbond en school">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2933}.s{font-size:11px}.b{font-size:13px;font-weight:bold}.w{fill:#fff;font-size:13px;font-weight:bold}.r{font-size:11px;font-style:italic}</style>
<rect width="700" height="360" fill="#ffffff"/>
<rect x="90" y="40" width="150" height="30" fill="#9c6b30"/><text x="165.0" y="60" text-anchor="middle" class="w">Katholiek</text>
<rect x="90" y="76" width="150" height="36" fill="#ffffff" stroke="#9c6b30" stroke-width="1.5"/><text x="165.0" y="98" text-anchor="middle" class="s">RKSP, later KVP</text>
<rect x="90" y="116" width="150" height="36" fill="#ffffff" stroke="#9c6b30" stroke-width="1.5"/><text x="165.0" y="138" text-anchor="middle" class="s">De Volkskrant</text>
<rect x="90" y="156" width="150" height="36" fill="#ffffff" stroke="#9c6b30" stroke-width="1.5"/><text x="165.0" y="178" text-anchor="middle" class="s">KRO</text>
<rect x="90" y="196" width="150" height="36" fill="#ffffff" stroke="#9c6b30" stroke-width="1.5"/><text x="165.0" y="218" text-anchor="middle" class="s">Katholieke vakbond</text>
<rect x="90" y="236" width="150" height="36" fill="#ffffff" stroke="#9c6b30" stroke-width="1.5"/><text x="165.0" y="258" text-anchor="middle" class="s">Katholieke school</text>
<rect x="244" y="40" width="150" height="30" fill="#3b5bdb"/><text x="319.0" y="60" text-anchor="middle" class="w">Protestants</text>
<rect x="244" y="76" width="150" height="36" fill="#ffffff" stroke="#3b5bdb" stroke-width="1.5"/><text x="319.0" y="98" text-anchor="middle" class="s">ARP en CHU</text>
<rect x="244" y="116" width="150" height="36" fill="#ffffff" stroke="#3b5bdb" stroke-width="1.5"/><text x="319.0" y="138" text-anchor="middle" class="s">De Standaard, Trouw</text>
<rect x="244" y="156" width="150" height="36" fill="#ffffff" stroke="#3b5bdb" stroke-width="1.5"/><text x="319.0" y="178" text-anchor="middle" class="s">NCRV</text>
<rect x="244" y="196" width="150" height="36" fill="#ffffff" stroke="#3b5bdb" stroke-width="1.5"/><text x="319.0" y="218" text-anchor="middle" class="s">CNV</text>
<rect x="244" y="236" width="150" height="36" fill="#ffffff" stroke="#3b5bdb" stroke-width="1.5"/><text x="319.0" y="258" text-anchor="middle" class="s">Christelijke school</text>
<rect x="398" y="40" width="150" height="30" fill="#1f2933"/><text x="473.0" y="60" text-anchor="middle" class="w">Socialistisch</text>
<rect x="398" y="76" width="150" height="36" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text x="473.0" y="98" text-anchor="middle" class="s">SDAP, later PvdA</text>
<rect x="398" y="116" width="150" height="36" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text x="473.0" y="138" text-anchor="middle" class="s">Het Volk</text>
<rect x="398" y="156" width="150" height="36" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text x="473.0" y="178" text-anchor="middle" class="s">VARA</text>
<rect x="398" y="196" width="150" height="36" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text x="473.0" y="218" text-anchor="middle" class="s">NVV</text>
<rect x="398" y="236" width="150" height="36" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/><text x="473.0" y="258" text-anchor="middle" class="s">Openbare school</text>
<rect x="552" y="40" width="150" height="30" fill="#6b7280"/><text x="627.0" y="60" text-anchor="middle" class="w">Liberaal / algemeen</text>
<rect x="552" y="76" width="150" height="36" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="627.0" y="98" text-anchor="middle" class="s">VVD en voorlopers</text>
<rect x="552" y="116" width="150" height="36" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="627.0" y="138" text-anchor="middle" class="s">NRC, Algemeen Handelsblad</text>
<rect x="552" y="156" width="150" height="36" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="627.0" y="178" text-anchor="middle" class="s">AVRO</text>
<rect x="552" y="196" width="150" height="36" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="627.0" y="218" text-anchor="middle" class="s">(geen eigen bond)</text>
<rect x="552" y="236" width="150" height="36" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="627.0" y="258" text-anchor="middle" class="s">Openbare school</text>
<text x="82" y="98" text-anchor="end" class="r">Partij</text>
<text x="82" y="138" text-anchor="end" class="r">Krant</text>
<text x="82" y="178" text-anchor="end" class="r">Omroep</text>
<text x="82" y="218" text-anchor="end" class="r">Vakbond</text>
<text x="82" y="258" text-anchor="end" class="r">School</text>
<rect x="90" y="286" width="612" height="30" fill="#f1ede4" stroke="#1f2933"/>
<text x="396.0" y="306" text-anchor="middle" class="b">Overleg tussen de elites aan de top (Lijphart: pacificatie)</text>
<text x="350" y="20" text-anchor="middle" class="b">De zuilen rond 1930 (globaal schema)</text>
<text x="350" y="342" text-anchor="middle" class="s">Voorbeelden; niet elke zuil had overal alles, en de liberalen waren minder verzuild.</text>
</svg>