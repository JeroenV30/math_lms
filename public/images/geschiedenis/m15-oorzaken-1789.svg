<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Oorzakenschema van de Franse Revolutie: lange termijn, middellange termijn en directe aanleidingen leiden naar 1789" font-family="Georgia, serif" font-size="13">
<defs><marker id="pijl" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f2933"/></marker></defs>
<rect width="900" height="430" fill="#ffffff"/>
<text x="125" y="26" text-anchor="middle" fill="#1f2933" font-weight="bold">Lange termijn</text><text x="125" y="44" text-anchor="middle" fill="#1f2933" font-size="12">(decennia)</text>
<text x="355" y="26" text-anchor="middle" fill="#1f2933" font-weight="bold">Middellange termijn</text><text x="355" y="44" text-anchor="middle" fill="#1f2933" font-size="12">(jaren 1770-1788)</text>
<text x="585" y="26" text-anchor="middle" fill="#1f2933" font-weight="bold">Directe aanleiding</text><text x="585" y="44" text-anchor="middle" fill="#1f2933" font-size="12">(1788-1789)</text>
<rect x="20" y="60" width="210" height="64" rx="6" fill="#ffffff" stroke="#3b5bdb" stroke-width="2"/>
<text x="125.0" y="82" text-anchor="middle" fill="#1f2933">Nieuwe ideeën en een</text>
<text x="125.0" y="100" text-anchor="middle" fill="#1f2933">publieke sfeer (Verlichting)</text>
<rect x="20" y="150" width="210" height="64" rx="6" fill="#ffffff" stroke="#9c6b30" stroke-width="2"/>
<text x="125.0" y="172" text-anchor="middle" fill="#1f2933">Standenmaatschappij en</text>
<text x="125.0" y="190" text-anchor="middle" fill="#1f2933">privileges, vooral belasting</text>
<rect x="20" y="240" width="210" height="64" rx="6" fill="#ffffff" stroke="#9c6b30" stroke-width="2"/>
<text x="125.0" y="262" text-anchor="middle" fill="#1f2933">Groeiende staatsschuld</text>
<text x="125.0" y="280" text-anchor="middle" fill="#1f2933">en ondoelmatige belastingen</text>
<rect x="20" y="330" width="210" height="64" rx="6" fill="#ffffff" stroke="#9c6b30" stroke-width="2"/>
<text x="125.0" y="352" text-anchor="middle" fill="#1f2933">Bevolkingsgroei en</text>
<text x="125.0" y="370" text-anchor="middle" fill="#1f2933">stijgende prijzen</text>
<rect x="250" y="60" width="210" height="64" rx="6" fill="#ffffff" stroke="#3b5bdb" stroke-width="2"/>
<text x="355.0" y="82" text-anchor="middle" fill="#1f2933">Voorbeeld van Amerika</text>
<text x="355.0" y="100" text-anchor="middle" fill="#1f2933">en kritiek op het hof</text>
<rect x="250" y="170" width="210" height="64" rx="6" fill="#ffffff" stroke="#9c6b30" stroke-width="2"/>
<text x="355.0" y="192" text-anchor="middle" fill="#1f2933">Steun aan de Amerikaanse</text>
<text x="355.0" y="210" text-anchor="middle" fill="#1f2933">oorlog (1778-1783) kost geld</text>
<rect x="250" y="280" width="210" height="64" rx="6" fill="#ffffff" stroke="#9c6b30" stroke-width="2"/>
<text x="355.0" y="302" text-anchor="middle" fill="#1f2933">Hervormingen van Calonne</text>
<text x="355.0" y="320" text-anchor="middle" fill="#1f2933">en Brienne lopen vast (1787-88)</text>
<rect x="480" y="60" width="210" height="64" rx="6" fill="#ffffff" stroke="#9c6b30" stroke-width="2"/>
<text x="585.0" y="82" text-anchor="middle" fill="#1f2933">Misoogst en hoge</text>
<text x="585.0" y="100" text-anchor="middle" fill="#1f2933">broodprijs (1788-1789)</text>
<rect x="480" y="170" width="210" height="64" rx="6" fill="#ffffff" stroke="#9c6b30" stroke-width="2"/>
<text x="585.0" y="192" text-anchor="middle" fill="#1f2933">Staten-Generaal bijeen</text>
<text x="585.0" y="210" text-anchor="middle" fill="#1f2933">geroepen (mei 1789)</text>
<rect x="480" y="280" width="210" height="64" rx="6" fill="#ffffff" stroke="#9c6b30" stroke-width="2"/>
<text x="585.0" y="302" text-anchor="middle" fill="#1f2933">Hof en regering lijken</text>
<text x="585.0" y="320" text-anchor="middle" fill="#1f2933">hervorming te blokkeren</text>
<rect x="730" y="170" width="150" height="64" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="805.0" y="192" text-anchor="middle" fill="#1f2933">1789:</text>
<text x="805.0" y="210" text-anchor="middle" fill="#1f2933">revolutie</text>
<line x1="230" y1="92" x2="250" y2="92" stroke="#1f2933" stroke-width="1.5" marker-end="url(#pijl)"/>
<line x1="230" y1="182" x2="250" y2="202" stroke="#1f2933" stroke-width="1.5" marker-end="url(#pijl)"/>
<line x1="230" y1="272" x2="250" y2="312" stroke="#1f2933" stroke-width="1.5" marker-end="url(#pijl)"/>
<line x1="230" y1="362" x2="250" y2="312" stroke="#1f2933" stroke-width="1.5" marker-end="url(#pijl)"/>
<line x1="460" y1="92" x2="480" y2="92" stroke="#1f2933" stroke-width="1.5" marker-end="url(#pijl)"/>
<line x1="460" y1="202" x2="480" y2="202" stroke="#1f2933" stroke-width="1.5" marker-end="url(#pijl)"/>
<line x1="460" y1="312" x2="480" y2="312" stroke="#1f2933" stroke-width="1.5" marker-end="url(#pijl)"/>
<line x1="690" y1="92" x2="760" y2="170" stroke="#1f2933" stroke-width="1.5" marker-end="url(#pijl)"/>
<line x1="690" y1="202" x2="730" y2="202" stroke="#1f2933" stroke-width="1.5" marker-end="url(#pijl)"/>
<line x1="690" y1="312" x2="760" y2="234" stroke="#1f2933" stroke-width="1.5" marker-end="url(#pijl)"/>
<text x="450" y="420" text-anchor="middle" fill="#1f2933" font-size="12">Blauw: ideeën en opinie. Bruin: omstandigheden. Het schema laat zien wat samenkomt, niet wat zwaarder weegt.</text>
</svg>