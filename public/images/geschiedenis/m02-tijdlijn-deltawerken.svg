<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="Georgia, serif" font-size="12">
<rect width="600" height="260" fill="#ffffff"/>
<text x="300" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Van ramp naar Deltawerken, 1953 - 1997</text>
<line x1="40" y1="130" x2="570" y2="130" stroke="#1f2933" stroke-width="2"/>
<g stroke="#1f2933" stroke-width="1.5">
<line x1="60" y1="120" x2="60" y2="140"/><line x1="130" y1="120" x2="130" y2="140"/><line x1="240" y1="120" x2="240" y2="140"/><line x1="400" y1="120" x2="400" y2="140"/><line x1="530" y1="120" x2="530" y2="140"/>
</g>
<g fill="#1f2933" text-anchor="middle">
<text x="60" y="158" font-weight="bold">1953</text><text x="60" y="174">Watersnood</text>
<text x="130" y="108" font-weight="bold">1957</text><text x="130" y="92">Deltawet</text>
<text x="240" y="158" font-weight="bold">1971</text><text x="240" y="174">Haringvliet- en</text><text x="240" y="188">Brouwersdam</text>
<text x="400" y="108" font-weight="bold">1986</text><text x="400" y="92">Oosterschelde-</text><text x="400" y="78">kering open</text>
<text x="530" y="158" font-weight="bold">1997</text><text x="530" y="174">Maeslantkering</text>
</g>
<rect x="60" y="205" width="470" height="14" fill="#3b5bdb" opacity="0.25" stroke="#3b5bdb"/>
<text x="295" y="216" text-anchor="middle" fill="#1f2933">44 jaar werk: een proces, geen enkel besluit</text>
<circle cx="60" cy="130" r="6" fill="#9c6b30"/><circle cx="130" cy="130" r="6" fill="#3b5bdb"/><circle cx="240" cy="130" r="6" fill="#3b5bdb"/><circle cx="400" cy="130" r="6" fill="#3b5bdb"/><circle cx="530" cy="130" r="6" fill="#3b5bdb"/>
<text x="20" y="246" fill="#9c6b30" font-style="italic">Bruin: de aanleiding. Blauw: de gevolgen die elkaar opvolgen.</text>
</svg>
