<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Tijdlijn van 12.500 tot 2000 voor Christus met de belangrijkste plaatsen en culturen uit deze module">
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="320" y="24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2933">Van jagen naar boeren, 12.500 – 2000 v.Chr.</text>
  <line x1="40" y1="150" x2="610" y2="150" stroke="#1f2933" stroke-width="2"/>
  <g font-family="sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">
    <line x1="60" y1="144" x2="60" y2="156" stroke="#1f2933"/><text x="60" y="172">12.500</text>
    <line x1="191" y1="144" x2="191" y2="156" stroke="#1f2933"/><text x="191" y="172">10.000</text>
    <line x1="296" y1="144" x2="296" y2="156" stroke="#1f2933"/><text x="296" y="172">8000</text>
    <line x1="400" y1="144" x2="400" y2="156" stroke="#1f2933"/><text x="400" y="172">6000</text>
    <line x1="505" y1="144" x2="505" y2="156" stroke="#1f2933"/><text x="505" y="172">4000</text>
    <line x1="610" y1="144" x2="610" y2="156" stroke="#1f2933"/><text x="610" y="172">2000</text>
  </g>
  <rect x="60" y="134" width="157" height="10" fill="#9c6b30" opacity="0.8"/>
  <text x="138" y="128" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#9c6b30">Natoefiaanse cultuur</text>
  <g stroke="#3b5bdb" stroke-width="1.5" fill="none">
    <line x1="212" y1="150" x2="212" y2="195"/>
    <line x1="243" y1="150" x2="243" y2="70"/>
    <line x1="373" y1="150" x2="373" y2="105"/>
    <line x1="437" y1="150" x2="437" y2="195"/>
    <line x1="545" y1="150" x2="545" y2="105"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">
    <text x="212" y="212">Göbekli Tepe</text><text x="212" y="225" font-size="10">ca. 9600</text>
    <text x="243" y="48">Eerste domesticatie</text><text x="243" y="61" font-size="10">Vruchtbare Sikkel, ca. 9000</text>
    <text x="373" y="86">Çatalhöyük</text><text x="373" y="99" font-size="10">ca. 7100 – 5950</text>
    <text x="437" y="212">Bandkeramiek Limburg</text><text x="437" y="225" font-size="10">ca. 5300</text>
    <text x="545" y="86">Hunebedden Drenthe</text><text x="545" y="99" font-size="10">ca. 3400 – 3100</text>
  </g>
  <rect x="209" y="258" width="14" height="10" fill="#3b5bdb"/>
  <text x="229" y="267" font-family="sans-serif" font-size="11" fill="#1f2933">gebeurtenis of plaats</text>
  <rect x="360" y="258" width="14" height="10" fill="#9c6b30" opacity="0.8"/>
  <text x="380" y="267" font-family="sans-serif" font-size="11" fill="#1f2933">periode of cultuur</text>
  <text x="40" y="288" font-family="sans-serif" font-size="10" fill="#52606d">Jaartallen zijn bij benadering. De schaal loopt van links (oud) naar rechts (jong).</text>
</svg>
