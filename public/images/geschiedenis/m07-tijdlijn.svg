<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" font-family="sans-serif" font-size="12" role="img" aria-label="Tijdlijn van Rome van 509 v.Chr. tot ca. 300 n.Chr. in drie perioden">
<rect width="600" height="270" fill="#fff"/>
<text x="300" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Rome in drie perioden</text>
<rect x="40.0" y="40" width="157.5" height="34" fill="#e8dcc6" stroke="#9c6b30"/>
<text x="118.75" y="61" text-anchor="middle" fill="#1f2933">Vroege republiek</text>
<rect x="197.5" y="40" width="152.3" height="34" fill="#dbe4ff" stroke="#3b5bdb"/>
<text x="273.65" y="54" text-anchor="middle" fill="#1f2933">Expansie en crisis</text><text x="273.65" y="68" text-anchor="middle" fill="#1f2933">van de republiek</text>
<rect x="349.8" y="40" width="210.2" height="34" fill="#e8dcc6" stroke="#9c6b30"/>
<text x="454.9" y="61" text-anchor="middle" fill="#1f2933">Principaat en keizerrijk</text>
<line x1="40.0" y1="130" x2="560.0" y2="130" stroke="#1f2933" stroke-width="2"/>
<rect x="518.2" y="126" width="31.5" height="8" fill="#9c6b30"/>
<line x1="367.2" y1="121" x2="367.2" y2="139" stroke="#1f2933" stroke-dasharray="2 2"/>
<g font-size="11" fill="#52606d" text-anchor="middle"><text x="40.0" y="147">509 v.Chr.</text><text x="560.0" y="147">300 n.Chr.</text></g>
<line x1="197.5" y1="130" x2="197.5" y2="148" stroke="#3b5bdb" stroke-width="1"/>
<circle cx="197.5" cy="130" r="4.5" fill="#3b5bdb"/>
<text x="197.5" y="160" font-size="11" text-anchor="middle" fill="#1f2933">264 Eerste Punische Oorlog</text>
<line x1="273.3" y1="130" x2="273.3" y2="119" stroke="#3b5bdb" stroke-width="1"/>
<circle cx="273.3" cy="130" r="4.5" fill="#3b5bdb"/>
<text x="273.3" y="115" font-size="11" text-anchor="middle" fill="#1f2933">146 Carthago verwoest</text>
<line x1="335.7" y1="130" x2="335.7" y2="168" stroke="#3b5bdb" stroke-width="1"/>
<circle cx="335.7" cy="130" r="4.5" fill="#3b5bdb"/>
<text x="315" y="180" font-size="11" text-anchor="middle" fill="#1f2933">49 Rubicon, 44 Caesar vermoord</text>
<line x1="347.2" y1="130" x2="347.2" y2="101" stroke="#3b5bdb" stroke-width="1"/>
<circle cx="347.2" cy="130" r="4.5" fill="#3b5bdb"/>
<text x="355" y="97" font-size="11" text-anchor="middle" fill="#1f2933">31 Actium, 27 Augustus</text>
<line x1="411.5" y1="130" x2="411.5" y2="188" stroke="#3b5bdb" stroke-width="1"/>
<circle cx="411.5" cy="130" r="4.5" fill="#3b5bdb"/>
<text x="430" y="200" font-size="11" text-anchor="middle" fill="#1f2933">69–70 Bataafse opstand</text>
<line x1="442.4" y1="130" x2="442.4" y2="119" stroke="#3b5bdb" stroke-width="1"/>
<circle cx="442.4" cy="130" r="4.5" fill="#3b5bdb"/>
<text x="442.4" y="115" font-size="11" text-anchor="middle" fill="#1f2933">117 grootste omvang</text>
<line x1="503.4" y1="130" x2="503.4" y2="148" stroke="#3b5bdb" stroke-width="1"/>
<circle cx="503.4" cy="130" r="4.5" fill="#3b5bdb"/>
<text x="503.4" y="160" font-size="11" text-anchor="middle" fill="#1f2933">212 Constitutio Antoniniana</text>
<line x1="533.6" y1="130" x2="533.6" y2="101" stroke="#3b5bdb" stroke-width="1"/>
<text x="590" y="97" font-size="11" text-anchor="end" fill="#1f2933">235–284 crisis van de 3e eeuw</text>
<text x="300" y="238" text-anchor="middle" font-size="11" fill="#52606d">Gelijke afstand is gelijke tijd. Het streepje markeert de overgang van v.Chr. naar n.Chr.</text>
<text x="300" y="256" text-anchor="middle" font-size="11" fill="#52606d">Perioden zijn een ordening van historici, geen grenzen die tijdgenoten zo zagen.</text>
</svg>
