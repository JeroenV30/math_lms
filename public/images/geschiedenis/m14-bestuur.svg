<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-label="Schema van het bestuur van de Republiek: steden, gewestelijke Staten, Staten-Generaal en stadhouder">
<style>text{font-family:Georgia,serif;fill:#1f2933}.b{font-weight:bold;font-size:13px}.t{font-size:12px}.s{font-size:11px;fill:#52606d}.h{font-size:13px;font-weight:bold;fill:#3b5bdb}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5bdb"/></marker></defs><rect width="760" height="450" fill="#fff"/>
<text x="380" y="26" text-anchor="middle" class="h">Het bestuur van de Republiek (vereenvoudigd)</text>
<rect x="230" y="50" width="300" height="80" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="380.0" y="70" text-anchor="middle" class="b">Staten-Generaal (Den Haag)</text><text x="380.0" y="88" text-anchor="middle" class="t">Afgevaardigden van de gewesten</text><text x="380.0" y="104" text-anchor="middle" class="t">Oorlog, vrede, buitenlands beleid</text><text x="380.0" y="120" text-anchor="middle" class="t">Bij belangrijke besluiten eensgezindheid</text><rect x="230" y="175" width="300" height="80" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.5"/><text x="380.0" y="195" text-anchor="middle" class="b">Staten van de gewesten</text><text x="380.0" y="213" text-anchor="middle" class="t">Holland, Zeeland, Utrecht, Gelderland,</text><text x="380.0" y="229" text-anchor="middle" class="t">Overijssel, Friesland, Groningen</text><text x="380.0" y="245" text-anchor="middle" class="t">Hier ligt de soevereiniteit</text><rect x="230" y="300" width="300" height="80" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.5"/><text x="380.0" y="320" text-anchor="middle" class="b">Steden en regenten</text><text x="380.0" y="338" text-anchor="middle" class="t">Stadsbesturen van kooplieden en families</text><text x="380.0" y="354" text-anchor="middle" class="t">Vroedschap vult zichzelf aan</text><text x="380.0" y="370" text-anchor="middle" class="t">Amsterdam weegt het zwaarst</text><rect x="20" y="175" width="170" height="80" rx="6" fill="#fdf6e7" stroke="#9c6b30" stroke-width="1.5"/><text x="105.0" y="195" text-anchor="middle" class="b">Stadhouder</text><text x="105.0" y="213" text-anchor="middle" class="t">Opperbevelhebber van leger</text><text x="105.0" y="229" text-anchor="middle" class="t">en vloot; vaak ook</text><text x="105.0" y="245" text-anchor="middle" class="t">stadhouder van gewesten</text><rect x="570" y="175" width="170" height="80" rx="6" fill="#fdf6e7" stroke="#9c6b30" stroke-width="1.5"/><text x="655.0" y="195" text-anchor="middle" class="b">Raadpensionaris</text><text x="655.0" y="213" text-anchor="middle" class="t">Van Holland; in de</text><text x="655.0" y="229" text-anchor="middle" class="t">praktijk leider van de</text><text x="655.0" y="245" text-anchor="middle" class="t">Hollandse politiek</text><line x1="380" y1="300" x2="380" y2="257" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a)"/><line x1="380" y1="175" x2="380" y2="132" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a)"/><line x1="190" y1="215" x2="228" y2="215" stroke="#9c6b30" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="570" y1="215" x2="532" y2="215" stroke="#9c6b30" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="392" y="158" class="s">sturen afgevaardigden</text><text x="392" y="283" class="s">sturen afgevaardigden</text>
<text x="380" y="425" text-anchor="middle" class="s">Pijl: macht gaat van onder naar boven. Stippellijn: invloed zonder eigen soevereiniteit.</text>
</svg>
