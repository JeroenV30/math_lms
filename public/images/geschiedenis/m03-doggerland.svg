<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Schematische kaart van Doggerland">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2933}.s{font-size:12px}.b{font-size:13px;font-weight:bold}</style>
<rect width="600" height="340" fill="#dfe7fb"/>
<text x="300" y="22" text-anchor="middle" class="b">De Noordzee als droog land (schematisch)</text>
<path d="M200,70 C270,60 360,75 410,110 C440,150 430,215 390,250 C330,280 250,260 215,215 C185,170 175,105 200,70 Z" fill="#e8dfd0" stroke="#9c6b30" stroke-width="2" stroke-dasharray="6 4"/>
<text x="305" y="170" text-anchor="middle" class="b">Doggerland</text><text x="305" y="188" text-anchor="middle" class="s">tot ca. 6500 v.Chr.</text>
<path d="M40,90 L120,70 L170,100 L190,160 L150,230 L90,290 L40,280 Z" fill="#ffffff" stroke="#1f2933" stroke-width="2"/><text x="100" y="180" text-anchor="middle" class="s">Groot-Brittannië</text>
<path d="M430,300 L470,250 L520,225 L580,230 L580,300 Z" fill="#ffffff" stroke="#1f2933" stroke-width="2"/><text x="520" y="280" text-anchor="middle" class="s">Nederland</text>
<path d="M410,50 L470,40 L520,60 L590,70 L590,215 L525,200 L460,230 L430,150 Z" fill="#ffffff" stroke="#1f2933" stroke-width="2"/><text x="520" y="130" text-anchor="middle" class="s">Duitsland, Denemarken</text>
<circle cx="300" cy="243" r="6" fill="#3b5bdb"/><text x="315" y="228" text-anchor="middle" class="s">harpoenpunt Colinda (1931)</text>
<text x="300" y="325" text-anchor="middle" class="s">Contouren sterk vereenvoudigd; de stippellijn is een globale schets van het droge land.</text>
</svg>
