<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="Tijdlijn van de prehistorie">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2933}.s{font-size:11px}.b{font-size:13px;font-weight:bold}.a{fill:#3b5bdb}</style>
<rect width="600" height="260" fill="#ffffff"/>
<text x="300" y="24" text-anchor="middle" class="b">Van de eerste Homo sapiens tot de eerste boeren (niet op schaal)</text>
<line x1="30" y1="130" x2="570" y2="130" stroke="#1f2933" stroke-width="2"/>
<g stroke="#1f2933" stroke-width="1.5">
<line x1="50" y1="122" x2="50" y2="138"/><line x1="130" y1="122" x2="130" y2="138"/><line x1="210" y1="122" x2="210" y2="138"/><line x1="290" y1="122" x2="290" y2="138"/><line x1="370" y1="122" x2="370" y2="138"/><line x1="450" y1="122" x2="450" y2="138"/><line x1="530" y1="122" x2="530" y2="138"/>
</g>
<rect x="50" y="108" width="360" height="8" fill="#9c6b30"/><text x="230" y="102" text-anchor="middle" class="s">Paleolithicum (oude steentijd)</text>
<rect x="412" y="108" width="114" height="8" fill="#3b5bdb"/><text x="469" y="102" text-anchor="middle" class="s">Mesolithicum</text>
<rect x="530" y="108" width="40" height="8" fill="#1f2933"/><text x="550" y="102" text-anchor="middle" class="s">Neolithicum</text>
<g class="s" text-anchor="middle">
<text x="50" y="156">300.000 jaar</text><text x="50" y="170">geleden</text><text x="50" y="190" class="a">Homo sapiens</text><text x="50" y="203" class="a">in Afrika</text>
<text x="130" y="156">ca. 50.000</text><text x="130" y="170">geleden</text><text x="130" y="190" class="a">verspreiding</text><text x="130" y="203" class="a">over de wereld</text>
<text x="210" y="156">ca. 36.000</text><text x="210" y="170">geleden</text><text x="210" y="190" class="a">grot van</text><text x="210" y="203" class="a">Chauvet</text>
<text x="290" y="156">ca. 20.000</text><text x="290" y="170">geleden</text><text x="290" y="190" class="a">hoogtepunt</text><text x="290" y="203" class="a">ijstijd</text>
<text x="370" y="156">ca. 11.000</text><text x="370" y="170">v.Chr.</text><text x="370" y="190" class="a">rendier-</text><text x="370" y="203" class="a">jagers</text>
<text x="450" y="156">ca. 8000</text><text x="450" y="170">v.Chr.</text><text x="450" y="190" class="a">kano van</text><text x="450" y="203" class="a">Pesse</text>
<text x="530" y="156">ca. 5300</text><text x="530" y="170">v.Chr.</text><text x="530" y="190" class="a">eerste boeren</text><text x="530" y="203" class="a">in Limburg</text>
</g>
<text x="300" y="240" text-anchor="middle" class="s">De afstanden tussen de punten zijn niet evenredig met de tijd.</text>
</svg>
