<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Doorsnede van een opgravingsput met lagen">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2933}.s{font-size:12px}.b{font-size:13px;font-weight:bold}</style>
<rect width="600" height="320" fill="#ffffff"/>
<text x="300" y="22" text-anchor="middle" class="b">Doorsnede van een opgravingsput</text>
<rect x="40" y="40" width="360" height="50" fill="#e8dfd0" stroke="#1f2933"/>
<rect x="40" y="90" width="360" height="60" fill="#d9c8a9" stroke="#1f2933"/>
<rect x="40" y="150" width="360" height="60" fill="#c3a97c" stroke="#1f2933"/>
<rect x="40" y="210" width="360" height="60" fill="#a88b5a" stroke="#1f2933"/>
<rect x="180" y="40" width="70" height="125" fill="#ffffff" stroke="#3b5bdb" stroke-width="2" stroke-dasharray="5 3"/>
<text x="215" y="108" text-anchor="middle" class="s">kuil</text><text x="215" y="124" text-anchor="middle" class="s">(later</text><text x="215" y="140" text-anchor="middle" class="s">gegraven)</text>
<circle cx="90" cy="65" r="6" fill="#3b5bdb"/><circle cx="330" cy="120" r="6" fill="#3b5bdb"/><circle cx="100" cy="180" r="6" fill="#3b5bdb"/><circle cx="320" cy="240" r="6" fill="#3b5bdb"/>
<g class="s">
<text x="415" y="68">laag 1: jongst</text><text x="415" y="124">laag 2</text><text x="415" y="184">laag 3</text><text x="415" y="244">laag 4: oudst</text>
</g>
<line x1="570" y1="48" x2="570" y2="262" stroke="#1f2933" stroke-width="2"/>
<polygon points="570,262 564,250 576,250" fill="#1f2933"/>
<text x="548" y="160" class="s" transform="rotate(-90 548 160)" text-anchor="middle">ouder</text>
<circle cx="50" cy="298" r="6" fill="#3b5bdb"/><text x="64" y="302" class="s">vondst of monster voor datering</text>
<text x="330" y="302" class="s">Een kuil doorsnijdt oudere lagen.</text>
</svg>
