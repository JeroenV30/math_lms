<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Tijdlijn van 3500 tot 1000 voor Christus met Mesopotamië, Egypte, de Indusvallei en China, en het ontstaan van hun schriften">
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="320" y="20" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2933">Vier streken, vier schriften (v.Chr.)</text>
  <g font-family="sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">
    <line x1="110" y1="45" x2="610" y2="45" stroke="#1f2933" stroke-width="1.5"/>
    <line x1="110" y1="40" x2="110" y2="340" stroke="#d5dae0"/><text x="110" y="36">3500</text>
    <line x1="210" y1="40" x2="210" y2="340" stroke="#d5dae0"/><text x="210" y="36">3000</text>
    <line x1="310" y1="40" x2="310" y2="340" stroke="#d5dae0"/><text x="310" y="36">2500</text>
    <line x1="410" y1="40" x2="410" y2="340" stroke="#d5dae0"/><text x="410" y="36">2000</text>
    <line x1="510" y1="40" x2="510" y2="340" stroke="#d5dae0"/><text x="510" y="36">1500</text>
    <line x1="610" y1="40" x2="610" y2="340" stroke="#d5dae0"/><text x="610" y="36">1000</text>
  </g>
  <g font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2933">
    <text x="8" y="97">Mesopotamië</text>
    <text x="8" y="167">Egypte</text>
    <text x="8" y="237">Indusvallei</text>
    <text x="8" y="307">China</text>
  </g>
  <!-- Mesopotamië -->
  <rect x="110" y="80" width="230" height="24" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <rect x="343" y="80" width="66" height="24" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <rect x="412" y="80" width="79" height="24" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="11" fill="#1f2933">
    <text x="110" y="74">Uruk en de vroege stadstaten</text>
    <text x="343" y="74">Akkad, Ur III</text>
    <text x="451" y="96" text-anchor="middle">Babylon</text>
    <path d="M150 112 l5 5 l-5 5 l-5 -5z" fill="#3b5bdb"/>
    <text x="162" y="121">proto-spijkerschrift ca. 3300</text>
    <line x1="460" y1="106" x2="460" y2="116" stroke="#9c6b30" stroke-width="2"/>
    <text x="466" y="121" fill="#9c6b30" font-weight="bold">Hammurabi ca. 1750</text>
  </g>
  <!-- Egypte -->
  <rect x="110" y="150" width="80" height="24" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <rect x="273" y="150" width="101" height="24" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <rect x="399" y="150" width="81" height="24" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <rect x="500" y="150" width="96" height="24" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">
    <text x="150" y="166">Naqada</text>
    <text x="323" y="166">Oude Rijk</text>
    <text x="439" y="166">Midden-Rijk</text>
    <text x="548" y="166">Nieuwe Rijk</text>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#1f2933">
    <path d="M160 182 l5 5 l-5 5 l-5 -5z" fill="#3b5bdb"/>
    <text x="172" y="191">hiërogliefen ca. 3250</text>
    <line x1="298" y1="176" x2="298" y2="186" stroke="#9c6b30" stroke-width="2"/>
    <text x="304" y="191" fill="#9c6b30" font-weight="bold">piramide van Choefoe ca. 2560</text>
  </g>
  <!-- Indus -->
  <rect x="290" y="220" width="140" height="24" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="11" fill="#1f2933">
    <text x="290" y="214">Rijpe Harappa-fase</text>
    <path d="M290 252 l5 5 l-5 5 l-5 -5z" fill="#3b5bdb"/>
    <text x="302" y="261">Indusschrift ca. 2600 (onontcijferd)</text>
  </g>
  <!-- China -->
  <rect x="490" y="290" width="111" height="24" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="11" fill="#1f2933">
    <text x="545" y="306" text-anchor="middle">Shang</text>
    <path d="M560 322 l5 5 l-5 5 l-5 -5z" fill="#3b5bdb"/>
    <text x="548" y="331" text-anchor="end">orakelbotten ca. 1250</text>
  </g>
  <g font-family="sans-serif" font-size="10" fill="#52606d">
    <path d="M110 349 l5 5 l-5 5 l-5 -5z" fill="#3b5bdb"/>
    <text x="122" y="357">= oudste aantoonbare schrift in die streek; jaartallen bij benadering</text>
  </g>
</svg>
