<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Georgia, serif" font-size="12" role="img" aria-label="Oorzaken en gevolgen van de crisis van de veertiende eeuw">
<rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<rect x="15" y="20" width="240" height="130" rx="6" fill="#ffffff" stroke="#3b5bdb" stroke-width="2"/>
<text x="135.0" y="44" text-anchor="middle" font-weight="bold" fill="#3b5bdb">Langetermijn</text>
<text x="27" y="78" fill="#1f2933">Bevolking groeit tot ca. 1300</text>
<text x="27" y="108" fill="#1f2933">Grond tot de rand benut</text>
<text x="27" y="138" fill="#1f2933">Koeler, wisselvalliger klimaat</text>
<rect x="290" y="20" width="240" height="130" rx="6" fill="#ffffff" stroke="#9c6b30" stroke-width="2"/>
<text x="410.0" y="44" text-anchor="middle" font-weight="bold" fill="#9c6b30">Schokken</text>
<text x="302" y="78" fill="#1f2933">Hongersnood 1315-1317</text>
<text x="302" y="108" fill="#1f2933">Honderdjarige Oorlog 1337-1453</text>
<text x="302" y="138" fill="#1f2933">Zwarte Dood 1347-1351</text>
<rect x="565" y="20" width="240" height="190" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="685.0" y="44" text-anchor="middle" font-weight="bold" fill="#1f2933">Gevolgen</text>
<text x="577" y="78" fill="#1f2933">Arbeid schaars, lonen stijgen</text>
<text x="577" y="108" fill="#1f2933">Zwaardere belastingen</text>
<text x="577" y="138" fill="#1f2933">Opstanden 1358 en 1381</text>
<text x="577" y="168" fill="#1f2933">Westers Schisma 1378-1417</text>
<text x="577" y="198" fill="#1f2933">Moderne Devotie</text>
<line x1="257" y1="120" x2="286" y2="120" stroke="#1f2933" stroke-width="2" marker-end="url(#pijl)"/>
<line x1="532" y1="120" x2="561" y2="120" stroke="#1f2933" stroke-width="2" marker-end="url(#pijl)"/>
<rect x="15" y="250" width="515" height="56" rx="6" fill="#f4efe6" stroke="#9c6b30"/>
<text x="27" y="274" fill="#1f2933">Postan: de bevolking is de motor (malthusiaanse crisis).</text>
<text x="27" y="294" fill="#1f2933">Na de pest: meer land per persoon.</text>
<rect x="565" y="250" width="240" height="56" rx="6" fill="#eef1fd" stroke="#3b5bdb"/>
<text x="577" y="274" fill="#1f2933">Brenner: klassenverhoudingen</text>
<text x="577" y="294" fill="#1f2933">bepalen de uitkomst.</text>
<text x="20" y="345" fill="#1f2933" font-size="12">Pijlen: werken door in. Twee verklaringen leggen het accent anders.</text>
</svg>