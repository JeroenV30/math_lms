<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="Oorzaken van de Nederlandse Opstand: vier langetermijnoorzaken leiden via de aanleiding van 1559-1566 tot de escalatie van 1567-1572">
<style>text{font-family:Georgia,serif;fill:#1f2933}.b{font-weight:bold;font-size:13px}.t{font-size:12px}.s{font-size:12px;font-style:italic;fill:#52606d}.h{font-size:13px;font-weight:bold;fill:#3b5bdb}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker></defs>
<rect width="760" height="470" fill="#fff"/><rect x="20" y="50" width="230" height="86" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.5"/><text x="135.0" y="72" text-anchor="middle" class="b">Centralisering en privileges</text><text x="135.0" y="88" text-anchor="middle" class="t">Habsburgse staatsvorming</text><text x="135.0" y="104" text-anchor="middle" class="t">tegenover oude rechten</text><text x="135.0" y="120" text-anchor="middle" class="t">(Blijde Inkomste van Brabant)</text><line x1="250" y1="93" x2="328" y2="240" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="150" width="230" height="86" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.5"/><text x="135.0" y="172" text-anchor="middle" class="b">Reformatie en ketterplakkaten</text><text x="135.0" y="188" text-anchor="middle" class="t">Eerst lutheranen en dopers,</text><text x="135.0" y="204" text-anchor="middle" class="t">in de jaren 1560 vooral</text><text x="135.0" y="220" text-anchor="middle" class="t">calvinisten</text><line x1="250" y1="193" x2="328" y2="240" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="250" width="230" height="86" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.5"/><text x="135.0" y="272" text-anchor="middle" class="b">Belasting en economie</text><text x="135.0" y="288" text-anchor="middle" class="t">Hoge lasten voor de oorlogen</text><text x="135.0" y="304" text-anchor="middle" class="t">van Karel V en Filips II;</text><text x="135.0" y="320" text-anchor="middle" class="t">graanduurte in 1565-1566</text><line x1="250" y1="293" x2="328" y2="240" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="350" width="230" height="86" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.5"/><text x="135.0" y="372" text-anchor="middle" class="b">Hoge adel en hofpolitiek</text><text x="135.0" y="388" text-anchor="middle" class="t">Oranje, Egmont en Hoorne</text><text x="135.0" y="404" text-anchor="middle" class="t">verliezen invloed aan</text><text x="135.0" y="420" text-anchor="middle" class="t">kardinaal Granvelle</text><line x1="250" y1="393" x2="328" y2="240" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="185" width="170" height="110" rx="6" fill="#fdf6e7" stroke="#9c6b30" stroke-width="1.5"/><text x="415.0" y="207" text-anchor="middle" class="b">Aanleiding, 1559-1566</text><text x="415.0" y="223" text-anchor="middle" class="t">Nieuwe bisdommen,</text><text x="415.0" y="239" text-anchor="middle" class="t">brief uit Segovia,</text><text x="415.0" y="255" text-anchor="middle" class="t">Smeekschrift, Beeldenstorm</text><line x1="500" y1="240" x2="558" y2="240" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a)"/><rect x="560" y="185" width="190" height="110" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="655.0" y="207" text-anchor="middle" class="b">Escalatie, 1567-1572</text><text x="655.0" y="223" text-anchor="middle" class="t">Alva en de Raad van</text><text x="655.0" y="239" text-anchor="middle" class="t">Beroerten, tiende penning,</text><text x="655.0" y="255" text-anchor="middle" class="t">inname van Den Briel</text><text x="135" y="36" text-anchor="middle" class="h">Langetermijnoorzaken</text><text x="415" y="36" text-anchor="middle" class="h">Korte termijn</text><text x="655" y="36" text-anchor="middle" class="h">Gevolg</text><text x="380" y="458" text-anchor="middle" class="s">Geen enkele oorzaak verklaart de Opstand alleen: het gaat om de samenloop.</text></svg>