<text x="711" y="130" text-anchor="middle" fill="#1f2933">Hitler Führer</text>
<text x="400" y="40" text-anchor="middle" font-size="14" fill="#1f2933">Van kanselier tot dictator: de stappen van 1933 en 1934</text>
<text x="400" y="240" text-anchor="middle" font-size="11" fill="#1f2933">Elke stap leunde op de vorige en was formeel meestal legaal of net zo gepresenteerd.</text>
