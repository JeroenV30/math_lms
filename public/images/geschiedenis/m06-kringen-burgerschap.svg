<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" font-family="sans-serif" font-size="13">
<title>De kringen van het burgerschap in Athene en Sparta</title><rect width="760" height="360" fill="#fff"/>
<text x="190" y="26" text-anchor="middle" font-weight="bold" fill="#1f2933">Athene</text>
<circle cx="190" cy="190" r="140" fill="#9c6b30" fill-opacity="0.12" stroke="#9c6b30"/>
<circle cx="190" cy="215" r="95" fill="#9c6b30" fill-opacity="0.2" stroke="#9c6b30"/>
<circle cx="190" cy="240" r="50" fill="#3b5bdb" fill-opacity="0.35" stroke="#3b5bdb"/>
<text x="190" y="90" text-anchor="middle" fill="#1f2933">Tot slaaf gemaakten</text>
<text x="190" y="108" text-anchor="middle" fill="#1f2933" font-size="11">geen rechten, eigendom</text>
<text x="190" y="156" text-anchor="middle" fill="#1f2933">Metoiken, vrouwen,</text>
<text x="190" y="174" text-anchor="middle" fill="#1f2933">kinderen: geen stem</text>
<text x="190" y="238" text-anchor="middle" fill="#1f2933" font-weight="bold">Burgers</text>
<text x="190" y="256" text-anchor="middle" fill="#1f2933" font-size="11">stemmen, loting</text>
<text x="570" y="26" text-anchor="middle" font-weight="bold" fill="#1f2933">Sparta</text>
<circle cx="570" cy="190" r="140" fill="#9c6b30" fill-opacity="0.12" stroke="#9c6b30"/>
<circle cx="570" cy="215" r="95" fill="#9c6b30" fill-opacity="0.2" stroke="#9c6b30"/>
<circle cx="570" cy="245" r="42" fill="#3b5bdb" fill-opacity="0.35" stroke="#3b5bdb"/>
<text x="570" y="90" text-anchor="middle" fill="#1f2933">Heloten</text>
<text x="570" y="108" text-anchor="middle" fill="#1f2933" font-size="11">landbewerkers, onvrij</text>
<text x="570" y="156" text-anchor="middle" fill="#1f2933">Perioikoi: vrij, maar</text>
<text x="570" y="174" text-anchor="middle" fill="#1f2933">zonder politieke rechten</text>
<text x="570" y="243" text-anchor="middle" fill="#1f2933" font-weight="bold">Homoioi</text>
<text x="570" y="260" text-anchor="middle" fill="#1f2933" font-size="11">agoge, leger</text>
<text x="380" y="345" text-anchor="middle" fill="#1f2933" font-size="11">Schematisch: de verhoudingen zijn niet op schaal.</text>
</svg>