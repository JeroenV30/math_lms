<text x="90" y="257" fill="#1f2933" >Regenten en vorsten</text>
<text x="580" y="257" text-anchor="end" fill="#9c6b30">1600 – 1700</text>
<circle cx="60" cy="290" r="13" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="60" y="295" text-anchor="middle" font-size="13" fill="#1f2933">7</text>
<text x="90" y="295" fill="#1f2933" >Pruiken en revoluties</text>
<text x="580" y="295" text-anchor="end" fill="#9c6b30">1700 – 1800</text>
<circle cx="60" cy="328" r="13" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="60" y="333" text-anchor="middle" font-size="13" fill="#1f2933">8</text>
<text x="90" y="333" fill="#1f2933" >Burgers en stoommachines</text>
<text x="580" y="333" text-anchor="end" fill="#9c6b30">1800 – 1900</text>
<circle cx="60" cy="366" r="13" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="60" y="371" text-anchor="middle" font-size="13" fill="#1f2933">9</text>
<text x="90" y="371" fill="#1f2933" >Wereldoorlogen</text>
<text x="580" y="371" text-anchor="end" fill="#9c6b30">1900 – 1950</text>
<circle cx="60" cy="404" r="13" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="60" y="409" text-anchor="middle" font-size="13" fill="#1f2933">10</text>
<text x="90" y="409" fill="#1f2933" >Televisie en computer</text>
<text x="580" y="409" text-anchor="end" fill="#9c6b30">1950 – nu</text>
<text x="90" y="436" font-size="12" fill="#3b5bdb">Leidens Ontzet, 1574: tijdvak 5</text>
</svg>