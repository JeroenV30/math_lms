<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="Georgia, serif" font-size="15">
<rect width="600" height="440" fill="#ffffff"/>
<text x="300" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">De tien tijdvakken (niet op schaal)</text>
<line x1="60" y1="44" x2="60" y2="428" stroke="#1f2933" stroke-width="2"/>
<circle cx="60" cy="62" r="13" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="60" y="67" text-anchor="middle" font-size="13" fill="#1f2933">1</text>
<text x="90" y="67" fill="#1f2933" >Jagers en boeren</text>
<text x="580" y="67" text-anchor="end" fill="#9c6b30">tot ca. 3000 v.Chr.</text>
<circle cx="60" cy="100" r="13" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="60" y="105" text-anchor="middle" font-size="13" fill="#1f2933">2</text>
<text x="90" y="105" fill="#1f2933" >Grieken en Romeinen</text>
<text x="580" y="105" text-anchor="end" fill="#9c6b30">ca. 3000 v.Chr. – 500</text>
<circle cx="60" cy="138" r="13" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="60" y="143" text-anchor="middle" font-size="13" fill="#1f2933">3</text>
<text x="90" y="143" fill="#1f2933" >Monniken en ridders</text>
<text x="580" y="143" text-anchor="end" fill="#9c6b30">500 – 1000</text>
<circle cx="60" cy="176" r="13" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="60" y="181" text-anchor="middle" font-size="13" fill="#1f2933">4</text>
<text x="90" y="181" fill="#1f2933" >Steden en staten</text>
<text x="580" y="181" text-anchor="end" fill="#9c6b30">1000 – 1500</text>
<circle cx="60" cy="214" r="13" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="2"/>
<text x="60" y="219" text-anchor="middle" font-size="13" fill="#ffffff">5</text>
<text x="90" y="219" fill="#1f2933" font-weight="bold">Ontdekkers en hervormers</text>
<text x="580" y="219" text-anchor="end" fill="#9c6b30">1500 – 1600</text>
<circle cx="60" cy="252" r="13" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
