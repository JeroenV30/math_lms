<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Zelfversterkende kring van overschot, opslag, boekhouding en bestuur in de eerste staten">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="320" y="24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2933">Een zelfversterkende kring</text>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker></defs>
  <g font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
    <rect x="40" y="50" width="210" height="62" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="145" y="76" font-weight="bold">Overschot</text><text x="145" y="94">irrigatie, graan, vee</text>
    <rect x="390" y="50" width="210" height="62" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="495" y="76" font-weight="bold">Opslag en herverdeling</text><text x="495" y="94">tempel of paleis</text>
    <rect x="390" y="230" width="210" height="62" rx="6" fill="#faf3e8" stroke="#9c6b30" stroke-width="1.5"/>
    <text x="495" y="256" font-weight="bold">Boekhouding</text><text x="495" y="274">cijfers, tekens, later schrift</text>
    <rect x="40" y="230" width="210" height="62" rx="6" fill="#faf3e8" stroke="#9c6b30" stroke-width="1.5"/>
    <text x="145" y="256" font-weight="bold">Specialisten en bestuur</text><text x="145" y="274">ambtenaren, ambachten, leger</text>
  </g>
  <g stroke="#1f2933" stroke-width="1.6" fill="none" marker-end="url(#b)">
    <line x1="252" y1="81" x2="386" y2="81"/>
    <line x1="495" y1="114" x2="495" y2="226"/>
    <line x1="388" y1="261" x2="254" y2="261"/>
    <line x1="145" y1="228" x2="145" y2="116"/>
  </g>
  <g font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
    <text x="320" y="150">Elk gevolg wordt weer oorzaak.</text>
    <text x="320" y="170">Wie belasting int, heeft boekhouding nodig;</text>
    <text x="320" y="188">wie boekhoudt, kan meer innen en besturen.</text>
    <text x="320" y="214" fill="#9c6b30" font-weight="bold">Waar de kring begon, is het debat.</text>
  </g>
</svg>
