<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Tijdlijn van de julicrisis 1914"><rect width="640" height="300" fill="#ffffff"/><text x="320" y="24" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold" font-family="Georgia, serif">De julicrisis, 28 juni – 4 augustus 1914</text><line x1="50" y1="150" x2="590" y2="150" stroke="#1f2933" stroke-width="2"/><line x1="50.0" y1="150" x2="50.0" y2="100" stroke="#9c6b30" stroke-width="1.2"/><circle cx="50.0" cy="150" r="5" fill="#9c6b30"/><text x="44.0" y="80" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold" font-family="Georgia, serif">28 jun</text><text x="44.0" y="94" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal" font-family="Georgia, serif">Sarajevo</text><line x1="166.8" y1="150" x2="166.8" y2="200" stroke="#3b5bdb" stroke-width="1.2"/><circle cx="166.8" cy="150" r="5" fill="#3b5bdb"/><text x="166.8" y="216" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold" font-family="Georgia, serif">6 jul</text><text x="166.8" y="230" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal" font-family="Georgia, serif">Duitse steun</text><line x1="414.9" y1="150" x2="414.9" y2="100" stroke="#3b5bdb" stroke-width="1.2"/><circle cx="414.9" cy="150" r="5" fill="#3b5bdb"/><text x="414.9" y="80" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold" font-family="Georgia, serif">23 jul</text><text x="414.9" y="94" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal" font-family="Georgia, serif">Ultimatum</text><line x1="487.8" y1="150" x2="487.8" y2="200" stroke="#3b5bdb" stroke-width="1.2"/><circle cx="487.8" cy="150" r="5" fill="#3b5bdb"/><text x="487.8" y="216" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold" font-family="Georgia, serif">28 jul</text><text x="487.8" y="230" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal" font-family="Georgia, serif">Oorlog aan Servië</text><line x1="517.0" y1="150" x2="517.0" y2="100" stroke="#3b5bdb" stroke-width="1.2"/><circle cx="517.0" cy="150" r="5" fill="#3b5bdb"/><text x="517.0" y="68" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold" font-family="Georgia, serif">30 jul</text><text x="517.0" y="81" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal" font-family="Georgia, serif">Russische</text><text x="517.0" y="94" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal" font-family="Georgia, serif">mobilisatie</text><line x1="546.2" y1="150" x2="546.2" y2="245" stroke="#3b5bdb" stroke-width="1.2"/><circle cx="546.2" cy="150" r="5" fill="#3b5bdb"/><text x="546.2" y="261" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold" font-family="Georgia, serif">1 aug</text><text x="546.2" y="275" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal" font-family="Georgia, serif">Duitsland-Rusland</text><line x1="590.0" y1="150" x2="590.0" y2="55" stroke="#9c6b30" stroke-width="1.2"/><circle cx="590.0" cy="150" r="5" fill="#9c6b30"/><text x="596.0" y="35" font-size="12" text-anchor="end" fill="#1f2933" font-weight="bold" font-family="Georgia, serif">4 aug</text><text x="596.0" y="49" font-size="12" text-anchor="end" fill="#1f2933" font-weight="normal" font-family="Georgia, serif">Inval in België, Britse oorlogsverklaring</text><text x="320" y="290" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal" font-family="Georgia, serif">Lineaire schaal: elke dag is even breed. Blauw: besluiten en oorlogsverklaringen; bruin: de aanleiding en de inval.</text></svg>