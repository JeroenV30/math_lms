<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="Schema van de handelsnetwerken van Amsterdam met de Oostzee, Zuid-Europa, Azië en de Atlantische wereld">
<style>text{font-family:Georgia,serif;fill:#1f2933}.b{font-weight:bold;font-size:13px}.t{font-size:12px}.s{font-size:11px;fill:#52606d}.h{font-size:13px;font-weight:bold;fill:#3b5bdb}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5bdb"/></marker></defs><rect width="760" height="470" fill="#fff"/>
<text x="380" y="26" text-anchor="middle" class="h">Handelsnetwerken rond Amsterdam (schematisch, niet op schaal)</text>
<rect x="285" y="190" width="190" height="80" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="380.0" y="210" text-anchor="middle" class="b">Amsterdam</text><text x="380.0" y="228" text-anchor="middle" class="t">Stapelmarkt, Wisselbank,</text><text x="380.0" y="244" text-anchor="middle" class="t">beurs, kapitaal</text><rect x="285" y="50" width="190" height="70" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.5"/><text x="380.0" y="70" text-anchor="middle" class="b">Oostzeegebied</text><text x="380.0" y="88" text-anchor="middle" class="t">Graan en hout (moedernegotie)</text><text x="380.0" y="104" text-anchor="middle" class="t">tegen zout, wijn, laken</text><rect x="20" y="190" width="210" height="80" rx="6" fill="#fdf6e7" stroke="#9c6b30" stroke-width="1.5"/><text x="125.0" y="210" text-anchor="middle" class="b">Azië (VOC, vanaf 1602)</text><text x="125.0" y="228" text-anchor="middle" class="t">Specerijen, textiel, porselein,</text><text x="125.0" y="244" text-anchor="middle" class="t">thee; Batavia, Deshima</text><rect x="530" y="190" width="210" height="80" rx="6" fill="#fdf6e7" stroke="#9c6b30" stroke-width="1.5"/><text x="635.0" y="210" text-anchor="middle" class="b">Atlantische wereld (WIC)</text><text x="635.0" y="228" text-anchor="middle" class="t">Suiker, tabak, koffie;</text><text x="635.0" y="244" text-anchor="middle" class="t">Nieuw-Nederland, Brazilië,</text><text x="635.0" y="260" text-anchor="middle" class="t">Curaçao, Suriname</text><rect x="530" y="340" width="210" height="80" rx="6" fill="#fdf6e7" stroke="#9c6b30" stroke-width="1.5"/><text x="635.0" y="360" text-anchor="middle" class="b">West-Afrika (WIC)</text><text x="635.0" y="378" text-anchor="middle" class="t">Goud, ivoor en tot slaaf</text><text x="635.0" y="394" text-anchor="middle" class="t">gemaakte mensen; Elmina,</text><text x="635.0" y="410" text-anchor="middle" class="t">Guinea en Angola</text><rect x="285" y="340" width="190" height="80" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.5"/><text x="380.0" y="360" text-anchor="middle" class="b">Zuid-Europa</text><text x="380.0" y="378" text-anchor="middle" class="t">Zout, wijn, Middellandse</text><text x="380.0" y="394" text-anchor="middle" class="t">Zee en Levant</text><line x1="380" y1="190" x2="380" y2="122" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a)"/><line x1="285" y1="230" x2="232" y2="230" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a)"/><line x1="475" y1="230" x2="528" y2="230" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a)"/><line x1="380" y1="270" x2="380" y2="338" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a)"/><line x1="635" y1="340" x2="635" y2="272" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#b)"/><text x="633" y="300" text-anchor="end" class="s">gedwongen overtocht van tot</text><text x="633" y="314" text-anchor="end" class="s">slaaf gemaakte mensen</text>
<text x="380" y="455" text-anchor="middle" class="s">Zwarte pijlen: handel vanuit Amsterdam. Blauwe pijl: de gedwongen Atlantische overtocht.</text>
</svg>
