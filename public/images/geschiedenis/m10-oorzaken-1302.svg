<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="sans-serif" font-size="12" role="img" aria-label="Oorzakenschema van de Guldensporenslag van de lange termijn naar de directe aanleiding">
<rect width="600" height="330" fill="#fff"/>
<text x="300" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Oorzaken van 1302</text>
<rect x="40" y="50" width="520" height="50" fill="#e8dcc6" stroke="#9c6b30"/><text x="55" y="71" fill="#1f2933" font-weight="bold">Lange termijn</text><text x="55" y="89" fill="#1f2933" font-size="11">Groei van de steden; ambachten zonder stem in het bestuur</text>
<line x1="300" y1="100" x2="300" y2="120" stroke="#1f2933" stroke-width="2"/><path d="M294 114 L300 120 L306 114" fill="none" stroke="#1f2933" stroke-width="2"/>
<rect x="40" y="120" width="520" height="50" fill="#e8dcc6" stroke="#9c6b30"/><text x="55" y="141" fill="#1f2933" font-weight="bold">Middellange termijn</text><text x="55" y="159" fill="#1f2933" font-size="11">Afhankelijkheid van Engelse wol; Frans-Engelse rivaliteit</text>
<line x1="300" y1="170" x2="300" y2="190" stroke="#1f2933" stroke-width="2"/><path d="M294 184 L300 190 L306 184" fill="none" stroke="#1f2933" stroke-width="2"/>
<rect x="40" y="190" width="520" height="50" fill="#dbe4ff" stroke="#3b5bdb"/><text x="55" y="211" fill="#1f2933" font-weight="bold">Directe aanleiding</text><text x="55" y="229" fill="#1f2933" font-size="11">Gevangenneming van graaf Gwijde; Franse bezetting en belasting</text>
<line x1="300" y1="240" x2="300" y2="260" stroke="#1f2933" stroke-width="2"/><path d="M294 254 L300 260 L306 254" fill="none" stroke="#1f2933" stroke-width="2"/>
<rect x="40" y="260" width="520" height="50" fill="#dbe4ff" stroke="#3b5bdb"/><text x="55" y="281" fill="#1f2933" font-weight="bold">Gevolg</text><text x="55" y="299" fill="#1f2933" font-size="11">Brugse Metten (18 mei) en Guldensporenslag (11 juli 1302)</text>
</svg>
