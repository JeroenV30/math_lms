<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Schema van drie verklaringen voor het ontstaan van landbouw: klimaat, bevolkingsdruk en cultuur, met onderlinge terugkoppeling">
  <rect width="640" height="330" fill="#ffffff"/>
  <text x="320" y="24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2933">Drie verklaringen, één uitkomst</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker></defs>
  <g font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1f2933">
    <rect x="30" y="50" width="160" height="62" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="110" y="76" font-weight="bold">Klimaat</text><text x="110" y="94">warmer, stabieler Holoceen</text>
    <rect x="240" y="50" width="160" height="62" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="320" y="76" font-weight="bold">Bevolkingsdruk</text><text x="320" y="94">meer monden, krappe ruimte</text>
    <rect x="450" y="50" width="160" height="62" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="530" y="76" font-weight="bold">Cultuur en religie</text><text x="530" y="94">gedeelde rituelen, voorraden</text>
    <rect x="210" y="200" width="220" height="62" rx="6" fill="#faf3e8" stroke="#9c6b30" stroke-width="1.5"/>
    <text x="320" y="226" font-weight="bold">Vaste woonplaatsen,</text><text x="320" y="244" font-weight="bold">planten en dieren onder zorg</text>
  </g>
  <g stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="110" y1="112" x2="260" y2="198"/>
    <line x1="320" y1="112" x2="320" y2="198"/>
    <line x1="530" y1="112" x2="380" y2="198"/>
  </g>
  <g stroke="#9c6b30" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)">
    <path d="M430 240 C 570 240, 600 180, 560 118"/>
    <path d="M210 240 C 70 240, 40 180, 80 118"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#9c6b30" text-anchor="middle">
    <text x="520" y="284">terugkoppeling</text>
    <text x="140" y="284">terugkoppeling</text>
  </g>
  <text x="320" y="318" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#52606d">Onderzoekers verschillen over het gewicht van elke pijl. De gestippelde pijlen laten zien dat een gevolg zelf weer oorzaak wordt.</text>
</svg>
