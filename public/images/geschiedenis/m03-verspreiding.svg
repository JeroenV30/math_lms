<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Schematische kaart van de verspreiding van de moderne mens">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2933}.s{font-size:11px}.b{font-size:13px;font-weight:bold}</style>
<rect width="600" height="340" fill="#ffffff"/>
<text x="300" y="20" text-anchor="middle" class="b">Verspreiding van Homo sapiens (sterk vereenvoudigd)</text>
<path d="M30,60 L120,50 L150,90 L120,140 L90,150 L60,120 Z" fill="#e8dfd0" stroke="#1f2933"/><text x="90" y="105" text-anchor="middle" class="s">Noord-Amerika</text>
<path d="M110,170 L160,165 L175,230 L150,300 L125,290 L110,230 Z" fill="#e8dfd0" stroke="#1f2933"/><text x="142" y="235" text-anchor="middle" class="s">Zuid-Amerika</text>
<path d="M260,90 L330,85 L350,140 L340,200 L310,290 L285,285 L265,200 L250,140 Z" fill="#e8dfd0" stroke="#1f2933"/><text x="300" y="195" text-anchor="middle" class="s">Afrika</text>
<path d="M260,45 L350,40 L380,60 L440,60 L500,70 L520,110 L480,150 L420,140 L380,110 L330,85 L260,90 Z" fill="#e8dfd0" stroke="#1f2933"/><text x="440" y="100" text-anchor="middle" class="s">Eurazië</text>
<path d="M470,230 L540,225 L560,270 L510,290 L470,270 Z" fill="#e8dfd0" stroke="#1f2933"/><text x="513" y="262" text-anchor="middle" class="s">Australië</text>
<g stroke="#3b5bdb" stroke-width="3" fill="none"><path d="M310,150 C330,120 360,110 390,115"/><path d="M390,115 C420,140 460,175 490,225"/><path d="M370,100 C340,70 320,60 300,65"/><path d="M450,70 C400,30 200,20 120,60"/><path d="M120,100 C130,130 135,150 135,175"/></g>
<g fill="#3b5bdb"><polygon points="390,115 380,108 381,121"/><polygon points="490,225 480,216 486,213"/><polygon points="300,65 309,60 308,71"/><polygon points="120,60 131,58 128,67"/><polygon points="135,175 130,164 140,165"/></g>
<g class="s"><text x="355" y="318">Afrika: ca. 300.000 jaar geleden</text><text x="400" y="300">Australië: minstens 50.000</text><text x="255" y="70" text-anchor="end">Europa: ca. 45.000</text><text x="30" y="40">Amerika: minstens 21.000</text></g>
<text x="20" y="332" class="s">Getallen: jaar geleden, bij benadering en onder discussie.</text>
</svg>
