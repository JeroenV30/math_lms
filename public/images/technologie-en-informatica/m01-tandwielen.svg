<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="14">
<title id="t">Twee tandwielen met overbrengingsverhouding 3</title>
<desc id="d">Een klein tandwiel van 20 tanden drijft een groot tandwiel van 60 tanden aan; het grote wiel draait drie keer zo langzaam.</desc>
<defs><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/></marker></defs>
<rect width="600" height="300" fill="#ffffff"/>
<circle cx="110" cy="150" r="40" fill="#f4f1ea" stroke="#1f2933" stroke-width="2"/>
<circle cx="110" cy="150" r="42" fill="none" stroke="#9c6b30" stroke-width="9" stroke-dasharray="6.28 6.28"/>
<circle cx="270" cy="150" r="120" fill="#f4f1ea" stroke="#1f2933" stroke-width="2"/>
<circle cx="270" cy="150" r="122" fill="none" stroke="#9c6b30" stroke-width="9" stroke-dasharray="6.28 6.28"/>
<circle cx="110" cy="150" r="5" fill="#1f2933"/><circle cx="270" cy="150" r="5" fill="#1f2933"/>
<path d="M80,90 A40,40 0 0 1 140,90" fill="none" stroke="#3b5bdb" stroke-width="3" marker-end="url(#p)"/>
<text x="110" y="58" text-anchor="middle" fill="#3b5bdb">aandrijving</text>
<text x="110" y="215" text-anchor="middle" fill="#1f2933">z = 20</text>
<text x="270" y="110" text-anchor="middle" fill="#1f2933">z = 60</text>
<text x="270" y="190" text-anchor="middle" fill="#1f2933">uitgaand wiel</text>
<text x="420" y="110" fill="#1f2933">i = 60 / 20 = 3</text>
<text x="420" y="140" fill="#1f2933">90 omw/min in</text>
<text x="420" y="162" fill="#1f2933">30 omw/min uit</text>
<text x="420" y="192" fill="#3b5bdb">koppel 3 × groter</text>
<text x="420" y="214" fill="#3b5bdb">(zonder wrijving)</text>
</svg>
