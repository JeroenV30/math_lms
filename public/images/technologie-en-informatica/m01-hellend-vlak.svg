<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="14">
<title id="t">Hellend vlak met lengte 4 m en hoogte 1 m</title>
<desc id="d">Een last van 1200 N wordt over een helling van 4 m lengte omhoog geduwd met 300 N, in plaats van 1 m recht omhoog getild.</desc>
<defs><marker id="p" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#3b5bdb"/></marker></defs>
<rect width="600" height="280" fill="#ffffff"/>
<path d="M60,230 L500,230 L500,150 z" fill="#f4f1ea" stroke="#1f2933" stroke-width="2"/>
<line x1="500" y1="150" x2="500" y2="230" stroke="#9c6b30" stroke-width="3"/>
<g transform="rotate(-10.3 330 181)"><rect x="288" y="147" width="84" height="34" fill="#e9dcc7" stroke="#1f2933" stroke-width="2"/></g>
<text x="330" y="169" text-anchor="middle" fill="#1f2933" font-size="12" transform="rotate(-10.3 330 181)">last 1200 N</text>
<line x1="376" y1="141" x2="429.1" y2="131.3" stroke="#3b5bdb" stroke-width="3" marker-end="url(#p)"/>
<text x="444" y="134" fill="#3b5bdb" font-size="13">F = 300 N</text>
<text x="280" y="255" text-anchor="middle" fill="#1f2933">lengte van de helling l = 4 m</text>
<text x="520" y="195" fill="#9c6b30">h = 1 m</text>
<text x="300" y="40" text-anchor="middle" fill="#1f2933">Recht omhoog: 1200 N over 1 m = 1200 J</text>
<text x="300" y="64" text-anchor="middle" fill="#1f2933">Via de helling: 300 N over 4 m = 1200 J</text>
</svg>
