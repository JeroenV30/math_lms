<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="14">
<title id="t">Een hefboom in evenwicht</title>
<desc id="d">Een balk met steunpunt dicht bij de last van 600 N en de hand ver van het steunpunt met 100 N.</desc>
<defs><marker id="p" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#3b5bdb"/></marker></defs>
<rect x="0" y="0" width="600" height="270" fill="#ffffff"/>
<rect x="70" y="150" width="440" height="10" fill="#e9dcc7" stroke="#1f2933" stroke-width="2"/>
<path d="M130,160 L108,200 L152,200 z" fill="#9c6b30" stroke="#1f2933" stroke-width="2"/>
<line x1="80" y1="200" x2="180" y2="200" stroke="#1f2933" stroke-width="2"/>
<rect x="55" y="105" width="48" height="45" fill="#f4f1ea" stroke="#1f2933" stroke-width="2"/>
<text x="79" y="133" text-anchor="middle" fill="#1f2933">last</text>
<line x1="79" y1="55" x2="79" y2="94" stroke="#3b5bdb" stroke-width="3" marker-end="url(#p)"/>
<text x="79" y="45" text-anchor="middle" fill="#3b5bdb">600 N (gewicht)</text>
<line x1="490" y1="70" x2="490" y2="140" stroke="#3b5bdb" stroke-width="3" marker-end="url(#p)"/>
<text x="490" y="60" text-anchor="middle" fill="#3b5bdb">100 N (jij)</text>
<text x="130" y="222" text-anchor="middle" fill="#9c6b30">steunpunt</text>
<line x1="79" y1="238" x2="130" y2="238" stroke="#1f2933" stroke-width="2"/>
<line x1="130" y1="238" x2="490" y2="238" stroke="#1f2933" stroke-width="2"/>
<line x1="79" y1="228" x2="79" y2="248" stroke="#1f2933"/><line x1="130" y1="228" x2="130" y2="248" stroke="#1f2933"/><line x1="490" y1="228" x2="490" y2="248" stroke="#1f2933"/>
<text x="104" y="262" text-anchor="middle" fill="#1f2933">0,25 m</text>
<text x="310" y="262" text-anchor="middle" fill="#1f2933">1,50 m</text>
<text x="300" y="125" text-anchor="middle" fill="#1f2933">600 N × 0,25 m = 100 N × 1,50 m</text>
</svg>
