<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="Drie compositieschema's: driedeling, diagonaal en centraal perspectief">
  <style>
    text { font-family: system-ui, Arial, sans-serif; font-size: 14px; fill: #1f2933; }
    .t { font-weight: bold; }
  </style>
  <rect width="600" height="260" fill="#ffffff"/>
  <g transform="translate(20,20)">
    <rect width="160" height="160" fill="#faf6ee" stroke="#1f2933" stroke-width="2"/>
    <g stroke="#1f2933" stroke-width="1.5" stroke-dasharray="4 4">
      <line x1="53" y1="0" x2="53" y2="160"/><line x1="107" y1="0" x2="107" y2="160"/>
      <line x1="0" y1="53" x2="160" y2="53"/><line x1="0" y1="107" x2="160" y2="107"/>
    </g>
    <circle cx="53" cy="53" r="9" fill="#3b5bdb"/><circle cx="107" cy="107" r="9" fill="#3b5bdb"/>
    <text x="80" y="195" text-anchor="middle" class="t">Driedeling</text>
    <text x="80" y="214" text-anchor="middle">aandacht op de snijpunten</text>
  </g>
  <g transform="translate(220,20)">
    <rect width="160" height="160" fill="#faf6ee" stroke="#1f2933" stroke-width="2"/>
    <line x1="0" y1="160" x2="160" y2="0" stroke="#9c6b30" stroke-width="3"/>
    <polygon points="110,48 150,10 150,50" fill="#3b5bdb" opacity="0.8"/>
    <circle cx="30" cy="130" r="9" fill="#3b5bdb"/>
    <text x="80" y="195" text-anchor="middle" class="t">Diagonaal</text>
    <text x="80" y="214" text-anchor="middle">het oog volgt de lijn</text>
  </g>
  <g transform="translate(420,20)">
    <rect width="160" height="160" fill="#faf6ee" stroke="#1f2933" stroke-width="2"/>
    <g stroke="#9c6b30" stroke-width="2">
      <line x1="0" y1="160" x2="80" y2="80"/><line x1="160" y1="160" x2="80" y2="80"/>
      <line x1="0" y1="0" x2="80" y2="80"/><line x1="160" y1="0" x2="80" y2="80"/>
    </g>
    <circle cx="80" cy="80" r="9" fill="#3b5bdb"/>
    <text x="80" y="195" text-anchor="middle" class="t">Verdwijnpunt</text>
    <text x="80" y="214" text-anchor="middle">lijnen komen samen</text>
  </g>
  <text x="300" y="248" text-anchor="middle" style="font-size:12.5px;fill:#555">Eigen schema's</text>
</svg>
