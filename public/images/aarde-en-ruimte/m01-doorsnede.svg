<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="Georgia, serif" font-size="13">
<rect width="600" height="500" fill="#ffffff"/>
<text x="300" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">Doorsnede van de aarde, op schaal</text>
<g transform="translate(0,40)">
<circle cx="210" cy="215" r="190" fill="#f8efe2" stroke="#9c6b30" stroke-width="1.2"/>
<circle cx="210" cy="215" r="103.8" fill="#fff3bf" stroke="#1f2933" stroke-width="1"/>
<circle cx="210" cy="215" r="36.4" fill="#ffe066" stroke="#1f2933" stroke-width="1"/>
<circle cx="210" cy="215" r="188.96" fill="none" stroke="#1f2933" stroke-width="1.04" opacity="0.0"/>
<circle cx="210" cy="215" r="190" fill="none" stroke="#1f2933" stroke-width="1.04"/>
<line x1="355.5" y1="92.9" x2="404" y2="66" stroke="#3b5bdb" stroke-width="1"/>
<circle cx="355.5" cy="92.9" r="3" fill="#3b5bdb"/>
<text x="410" y="70" fill="#1f2933" font-weight="bold" font-size="12">Korst: 5 – 70 km</text>
<text x="410" y="85" fill="#1f2933" font-size="11">gemiddeld ongeveer 35 km,</text>
<text x="410" y="98" fill="#1f2933" font-size="11">op schaal 1 beeldpunt</text>
<line x1="376.6" y1="176.2" x2="404" y2="136" stroke="#3b5bdb" stroke-width="1"/>
<circle cx="376.6" cy="176.2" r="3" fill="#3b5bdb"/>
<text x="410" y="140" fill="#1f2933" font-weight="bold" font-size="12">Mantel: tot 2891 km diepte</text>
<text x="410" y="155" fill="#1f2933" font-size="11">vast, kruipt over lange tijd</text>
<line x1="287.5" y1="230.5" x2="404" y2="231" stroke="#3b5bdb" stroke-width="1"/>
<circle cx="287.5" cy="230.5" r="3" fill="#3b5bdb"/>
<text x="410" y="235" fill="#1f2933" font-weight="bold" font-size="12">Buitenkern: 2891 – 5150 km</text>
<text x="410" y="250" fill="#1f2933" font-size="11">vloeibaar ijzer met nikkel</text>
<line x1="227.9" y1="228.4" x2="404" y2="326" stroke="#3b5bdb" stroke-width="1"/>
<circle cx="227.9" cy="228.4" r="3" fill="#3b5bdb"/>
<text x="410" y="330" fill="#1f2933" font-weight="bold" font-size="12">Binnenkern: 1220 km straal</text>
<text x="410" y="345" fill="#1f2933" font-size="11">vast, ondanks 5000 – 6000 K</text>
</g>
<text x="300" y="470" text-anchor="middle" font-size="12" fill="#1f2933">Straal 6371 km. De diepste boring (12,3 km) is op deze schaal</text>
<text x="300" y="485" text-anchor="middle" font-size="12" fill="#1f2933">minder dan een halve beeldpunt.</text>
</svg>
