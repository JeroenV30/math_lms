<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 378" font-family="Georgia, serif" font-size="13">
<rect width="600" height="378" fill="#ffffff"/>
<text x="300" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">De meting van Eratosthenes</text>
<circle cx="220" cy="200" r="120" fill="#f4f6ff" stroke="#1f2933" stroke-width="1.5"/>
<line x1="220" y1="200" x2="340.0" y2="200.0" stroke="#1f2933" stroke-dasharray="4 3"/>
<line x1="220" y1="200" x2="356.8" y2="121.0" stroke="#1f2933" stroke-dasharray="4 3"/>
<line x1="570" y1="200.0" x2="346.0" y2="200.0" stroke="#9c6b30" stroke-width="2"/>
<polygon points="348.0,200.0 362.0,195.0 362.0,205.0" fill="#9c6b30"/>
<line x1="570" y1="140.0" x2="329.9" y2="140.0" stroke="#9c6b30" stroke-width="2"/>
<polygon points="331.9,140.0 345.9,135.0 345.9,145.0" fill="#9c6b30"/>
<text x="575" y="192.0" text-anchor="end" fill="#9c6b30">zonnestralen (evenwijdig)</text>
<line x1="323.9" y1="140.0" x2="356.8" y2="121.0" stroke="#3b5bdb" stroke-width="3"/>
<circle cx="340.0" cy="200.0" r="5" fill="#3b5bdb"/><circle cx="323.9" cy="140.0" r="5" fill="#3b5bdb"/>
<text x="350.0" y="220.0" fill="#1f2933">Syene: zon loodrecht boven</text><text x="350.0" y="236.0" fill="#1f2933">en geen schaduw</text>
<text x="364.8" y="100.0" fill="#1f2933">Alexandrië: staaf</text><text x="364.8" y="116.0" fill="#1f2933">met schaduwhoek</text>
<path d="M 275.0 200.0 A 55 55 0 0 0 267.6 172.5" fill="none" stroke="#3b5bdb" stroke-width="2"/>
<text x="282" y="186" fill="#3b5bdb">7,2°</text>
<path d="M 354.0 200.0 A 134 134 0 0 0 336.0 133.0" fill="none" stroke="#9c6b30" stroke-width="2"/>
<text x="366.0" y="170.5" fill="#9c6b30">5000 stadia</text>
<text x="220" y="220" text-anchor="middle" fill="#1f2933">middelpunt</text>
<text x="300" y="350" text-anchor="middle" font-size="12" fill="#1f2933">Omtrek = 360° / 7,2° × 5000 stadia = 250.000 stadia.</text>
<text x="300" y="366" text-anchor="middle" font-size="12" fill="#1f2933">Hoeken sterk overdreven (werkelijk 7,2° in plaats van 30°).</text>
