<text x="332" y="326" fill="#1f2933" font-size="11">equinox</text>
<text x="300" y="378" text-anchor="middle" font-size="12" fill="#1f2933">Hoek van de as met de loodlijn op het baanvlak: 23,4°. De stip is de noordpool. Schets, niet op schaal.</text>
