<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-label="Staafdiagram: 100 wordt na 20 procent erbij 120, en na 20 procent eraf 96, omdat de daling over 120 wordt berekend">
<title>Staafdiagram: 100 wordt na 20 procent erbij 120, en na 20 procent eraf 96, omdat de daling over 120 wordt berekend</title>
<rect x="0" y="0" width="640" height="290" fill="#ffffff"/>
<line x1="30" y1="260" x2="620" y2="260" stroke="#1f2933" stroke-width="1.5"/>
<line x1="30" y1="80.0" x2="620" y2="80.0" stroke="#1f2933" stroke-width="1" stroke-dasharray="5 4"/>
<text x="620" y="74.0" font-family="sans-serif" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal" font-style="normal">niveau 100</text>
<rect x="60" y="80.0" width="90" height="180.0" fill="#3b5bdb"/>
<text x="105" y="280" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-style="normal">begin</text>
<text x="105" y="170.0" font-family="sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">100</text>
<rect x="240" y="80.0" width="90" height="180.0" fill="#3b5bdb"/>
<rect x="240" y="44.0" width="90" height="36.0" fill="#9c6b30"/>
<text x="285" y="280" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-style="normal">na 20% erbij</text>
<text x="285" y="170.0" font-family="sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">120</text>
<text x="285" y="67.0" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">+20</text>
<text x="285" y="22.0" font-family="sans-serif" font-size="13" fill="#9c6b30" text-anchor="middle" font-weight="normal" font-style="normal">20% van 100</text>
<rect x="420" y="87.2" width="90" height="172.8" fill="#3b5bdb"/>
<rect x="420" y="44.0" width="90" height="43.2" fill="none" stroke="#9c6b30" stroke-width="2" stroke-dasharray="5 4"/>
<text x="465" y="280" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal" font-style="normal">na 20% eraf</text>
<text x="465" y="173.6" font-family="sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">96</text>
<text x="465" y="70.6" font-family="sans-serif" font-size="14" fill="#9c6b30" text-anchor="middle" font-weight="bold" font-style="normal">−24</text>
<text x="465" y="22.0" font-family="sans-serif" font-size="13" fill="#9c6b30" text-anchor="middle" font-weight="normal" font-style="normal">20% van 120</text>
<line x1="160" y1="70" x2="222" y2="70" stroke="#1f2933" stroke-width="2"/>
<polygon points="230,70 220,64 220,76" fill="#1f2933"/>
<line x1="340" y1="70" x2="402" y2="70" stroke="#1f2933" stroke-width="2"/>
<polygon points="410,70 400,64 400,76" fill="#1f2933"/>
<text x="195" y="60" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">× 1,2</text>
<text x="375" y="60" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">× 0,8</text>
</svg>
