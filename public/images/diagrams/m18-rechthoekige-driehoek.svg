<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 275" role="img" aria-labelledby="title desc">
  <title id="title">Rechthoekige driehoeken in drie standen</title>
  <desc id="desc">Drie rechthoekige driehoeken, telkens anders gedraaid. In elke driehoek is de zijde tegenover de rechte hoek blauw gekleurd en met c aangeduid; de twee andere zijden heten a en b.</desc>
  <rect width="640" height="275" fill="#fff"/>
  <g font-family="sans-serif" fill="#1f2933" font-size="16">
    <text x="320.0" y="28.0" text-anchor="middle" font-size="17" font-weight="bold">De schuine zijde c ligt altijd tegenover de rechte hoek</text>
    <polygon points="40.0,210.0 200.0,210.0 40.0,90.0" fill="#f1f3f5" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
    <line x1="200.0" y1="210.0" x2="40.0" y2="90.0" stroke="#3b5bdb" stroke-width="4"/>
    <path d="M52.0,210.0 L52.0,198.0 L40.0,198.0" fill="none" stroke="#1f2933" stroke-width="1.5"/>
    <text x="120.0" y="232.0" text-anchor="middle" font-size="16" font-style="italic">a</text>
    <text x="26.0" y="155.0" text-anchor="middle" font-size="16" font-style="italic">b</text>
    <text x="135.0" y="138.0" text-anchor="middle" font-size="18" fill="#3b5bdb" font-weight="bold" font-style="italic">c</text>
    <polygon points="270.0,210.0 450.0,210.0 306.0,138.0" fill="#f1f3f5" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
    <line x1="270.0" y1="210.0" x2="450.0" y2="210.0" stroke="#3b5bdb" stroke-width="4"/>
    <path d="M300.6,148.7 L311.4,154.1 L316.7,143.4" fill="none" stroke="#1f2933" stroke-width="1.5"/>
    <text x="360.0" y="234.0" text-anchor="middle" font-size="18" fill="#3b5bdb" font-weight="bold" font-style="italic">c</text>
    <text x="276.0" y="170.0" text-anchor="middle" font-size="16" font-style="italic">a</text>
    <text x="388.0" y="164.0" text-anchor="middle" font-size="16" font-style="italic">b</text>
    <polygon points="600.0,210.0 500.0,210.0 600.0,70.0" fill="#f1f3f5" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
    <line x1="500.0" y1="210.0" x2="600.0" y2="70.0" stroke="#3b5bdb" stroke-width="4"/>
    <path d="M588.0,210.0 L588.0,198.0 L600.0,198.0" fill="none" stroke="#1f2933" stroke-width="1.5"/>
    <text x="550.0" y="232.0" text-anchor="middle" font-size="16" font-style="italic">a</text>
    <text x="616.0" y="145.0" text-anchor="middle" font-size="16" font-style="italic">b</text>
    <text x="536.0" y="128.0" text-anchor="middle" font-size="18" fill="#3b5bdb" font-weight="bold" font-style="italic">c</text>
    <text x="320.0" y="262.0" text-anchor="middle" font-size="14" fill="#616e7c">a en b heten rechthoekszijden; c is de schuine zijde (hypotenusa).</text>
  </g>
</svg>
