<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
  <title id="title">Oppervlakte met teken: onder de x-as telt negatief</title>
  <desc id="desc">De grafiek van y = x − 4 op het interval van 0 tot 6. Van 0 tot 4 ligt een driehoek onder de x-as met oppervlakte 8, die negatief telt; van 4 tot 6 ligt een driehoek boven de x-as met oppervlakte 2. De integraal is 2 − 8 = −6.</desc>
  <rect width="600" height="320" fill="#fff"/>
  <g font-family="sans-serif" fill="#1f2933">
    <polygon points="94.3,120.0 94.3,240.0 368.6,120.0" fill="#ffe3e3" stroke="#c92a2a" stroke-width="1.5"/>
    <polygon points="368.6,120.0 505.7,60.0 505.7,120.0" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <line x1="60.0" y1="120.0" x2="540.0" y2="120.0" stroke="#1f2933" stroke-width="1.5"/>
    <line x1="94.3" y1="270.0" x2="94.3" y2="30.0" stroke="#1f2933" stroke-width="1.5"/>
    <line x1="73.7" y1="249.0" x2="533.1" y2="48.0" stroke="#1f2933" stroke-width="2.5"/>
    <text x="231.4" y="112.0" text-anchor="middle" font-size="13">2</text>
    <text x="368.6" y="112.0" text-anchor="middle" font-size="13">4</text>
    <text x="505.7" y="140.0" text-anchor="middle" font-size="13">6</text>
    <text x="540.0" y="138.0" font-size="14" font-style="italic">x</text>
    <text x="176.6" y="168.0" text-anchor="middle" font-size="16" fill="#c92a2a" font-weight="bold">−8</text>
    <text x="461.1" y="103.5" text-anchor="middle" font-size="16" fill="#3b5bdb" font-weight="bold">+2</text>
    <text x="409.7" y="198.0" font-size="14" font-style="italic">y = x − 4</text>
    <text x="300" y="310" text-anchor="middle" font-size="13" fill="#616e7c">∫ van 0 tot 6 van (x − 4) dx = −8 + 2 = −6; de totale oppervlakte is 8 + 2 = 10</text>
  </g>
</svg>
