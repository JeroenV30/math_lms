  <text x="692" y="92" font-size="16" font-weight="bold" fill="#1f2933">28</text>
  <text x="150" y="120" font-size="12" fill="#1f2933">1 lelie + 9 touwrollen + 9 hielbeugels + 9 streepjes</text>
  <text x="20" y="164" font-size="15" font-weight="bold" fill="#1f2933">Romeins</text>
  <rect x="150" y="142" width="15" height="30" rx="2" fill="#9c6b30"/>
