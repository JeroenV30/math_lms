<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="sans-serif" role="img" aria-labelledby="t4 d4">
  <title id="t4">Hoeveel tekens voor 1999?</title>
  <desc id="d4">Het getal 1999 vraagt in Egyptische hiërogliefen 28 tekens (1 + 9 + 9 + 9), in Romeinse cijfers 7 tekens (MCMXCIX) en in ons plaatswaardesysteem 4 cijfers.</desc>
  <rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1f2933">Hoeveel tekens kost het getal 1999?</text>
  <text x="20" y="92" font-size="15" font-weight="bold" fill="#1f2933">Egyptisch</text>
