  <text x="150" y="264" font-size="12" fill="#1f2933">1 9 9 9</text>
  <text x="20" y="300" font-size="12" fill="#1f2933">Elk blokje is één teken. In een additief systeem groeit de lengte mee met de grootte van de cijfers;</text>
  <text x="20" y="316" font-size="12" fill="#1f2933">bij plaatswaarde groeit de lengte alleen met het aantal posities.</text>
