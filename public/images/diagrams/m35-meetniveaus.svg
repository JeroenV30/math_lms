<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 332" role="img">
<rect width="740" height="332" fill="#ffffff"/>
<rect x="20" y="230" width="680" height="58" rx="6" fill="#f1f3f5" stroke="#1f2933" stroke-width="1"/>
<text x="34.0" y="254.0" font-size="15" text-anchor="start" fill="#1f2933" font-weight="bold" font-family="sans-serif">Nominaal</text>
<text x="34.0" y="275.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal" font-family="sans-serif">categorieën zonder volgorde</text>
<text x="270.0" y="254.0" font-size="12" text-anchor="start" fill="#9c6b30" font-weight="normal" font-family="sans-serif">bijv. bloedgroep, woonplaats</text>
<text x="270.0" y="275.0" font-size="12" text-anchor="start" fill="#3b5bdb" font-weight="normal" font-family="sans-serif">modus, frequenties</text>
<rect x="50" y="160" width="650" height="58" rx="6" fill="#f1f3f5" stroke="#1f2933" stroke-width="1"/>
<text x="64.0" y="184.0" font-size="15" text-anchor="start" fill="#1f2933" font-weight="bold" font-family="sans-serif">Ordinaal</text>
<text x="64.0" y="205.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal" font-family="sans-serif">categorieën met volgorde</text>
<text x="300.0" y="184.0" font-size="12" text-anchor="start" fill="#9c6b30" font-weight="normal" font-family="sans-serif">bijv. opleidingsniveau, 1–5-schaal</text>
<text x="300.0" y="205.0" font-size="12" text-anchor="start" fill="#3b5bdb" font-weight="normal" font-family="sans-serif">+ mediaan, kwartielen</text>
<rect x="80" y="90" width="620" height="58" rx="6" fill="#f1f3f5" stroke="#1f2933" stroke-width="1"/>
<text x="94.0" y="114.0" font-size="15" text-anchor="start" fill="#1f2933" font-weight="bold" font-family="sans-serif">Interval</text>
<text x="94.0" y="135.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal" font-family="sans-serif">gelijke afstanden, geen echt nulpunt</text>
<text x="330.0" y="114.0" font-size="12" text-anchor="start" fill="#9c6b30" font-weight="normal" font-family="sans-serif">bijv. temperatuur in °C, jaartal</text>
<text x="330.0" y="135.0" font-size="12" text-anchor="start" fill="#3b5bdb" font-weight="normal" font-family="sans-serif">+ gemiddelde, standaardafwijking</text>
<rect x="110" y="20" width="590" height="58" rx="6" fill="#f1f3f5" stroke="#3b5bdb" stroke-width="2"/>
<text x="124.0" y="44.0" font-size="15" text-anchor="start" fill="#1f2933" font-weight="bold" font-family="sans-serif">Ratio</text>
<text x="124.0" y="65.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal" font-family="sans-serif">gelijke afstanden én echt nulpunt</text>
<text x="360.0" y="44.0" font-size="12" text-anchor="start" fill="#9c6b30" font-weight="normal" font-family="sans-serif">bijv. lengte, inkomen, reistijd</text>
<text x="360.0" y="65.0" font-size="12" text-anchor="start" fill="#3b5bdb" font-weight="normal" font-family="sans-serif">+ verhoudingen (‘twee keer zo veel’)</text>
<text x="370.0" y="318.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="normal" font-family="sans-serif">Elk hoger niveau erft alle bewerkingen van de niveaus eronder.</text>
</svg>
