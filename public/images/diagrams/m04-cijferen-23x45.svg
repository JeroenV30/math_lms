<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 285" role="img" aria-label="Cijferend vermenigvuldigen van 23 maal 45 met de nul in de tweede rij gemarkeerd">
<title>Cijferend vermenigvuldigen van 23 maal 45 met de nul in de tweede rij gemarkeerd</title>
<rect x="0" y="0" width="560" height="285" fill="#ffffff"/>
<text x="260" y="50" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="normal">3</text>
<text x="230" y="50" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="normal">2</text>
<text x="260" y="90" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="normal">5</text>
<text x="230" y="90" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="normal">4</text>
<text x="170" y="90" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="normal">×</text>
<line x1="150" y1="104" x2="278" y2="104" stroke="#1f2933" stroke-width="2"/>
<text x="260" y="140" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="normal">5</text>
<text x="230" y="140" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="normal">1</text>
<text x="200" y="140" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="normal">1</text>
<text x="300" y="140" font-family="sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal">← 23 × 5</text>
<text x="230" y="180" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="normal">2</text>
<text x="200" y="180" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="normal">9</text>
<text x="260" y="180" font-family="sans-serif" font-size="26" fill="#3b5bdb" text-anchor="middle" font-weight="bold">0</text>
<text x="300" y="180" font-family="sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal">← 23 × 40 = 920</text>
<rect x="247" y="157" width="26" height="32" rx="5" fill="none" stroke="#3b5bdb" stroke-width="2"/>
<line x1="150" y1="194" x2="278" y2="194" stroke="#1f2933" stroke-width="2"/>
<text x="140" y="194" font-family="sans-serif" font-size="22" fill="#1f2933" text-anchor="middle" font-weight="normal">+</text>
<text x="260" y="234" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="bold">5</text>
<text x="230" y="234" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="bold">3</text>
<text x="200" y="234" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="bold">0</text>
<text x="170" y="234" font-family="sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="bold">1</text>
<text x="30" y="268" font-family="sans-serif" font-size="14" fill="#3b5bdb" text-anchor="start" font-weight="normal">De 0 in de tweede rij is geen versiering: de 4 in 45 staat voor 4 tientallen.</text>
</svg>
