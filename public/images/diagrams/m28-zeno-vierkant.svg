<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="Een vierkant met oppervlakte 1, steeds gehalveerd in stukken van een half, een kwart, een achtste enzovoort; samen vullen ze het vierkant">
<title>Een vierkant met oppervlakte 1, steeds gehalveerd in stukken van een half, een kwart, een achtste enzovoort; samen vullen ze het vierkant</title>
<rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
<rect x="40.0" y="30.0" width="150.0" height="300.0" rx="0" fill="#3b5bdb" stroke="#1f2933" stroke-width="1.2"/>
<text x="115.0" y="188.7" font-family="sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">½</text>
<rect x="190.0" y="180.0" width="150.0" height="150.0" rx="0" fill="#5c7cfa" stroke="#1f2933" stroke-width="1.2"/>
<text x="265.0" y="262.7" font-family="sans-serif" font-size="23" fill="#ffffff" text-anchor="middle" font-weight="bold">¼</text>
<rect x="190.0" y="30.0" width="75.0" height="150.0" rx="0" fill="#748ffc" stroke="#1f2933" stroke-width="1.2"/>
<text x="227.5" y="111.7" font-family="sans-serif" font-size="20" fill="#1f2933" text-anchor="middle" font-weight="bold">⅛</text>
<rect x="265.0" y="105.0" width="75.0" height="75.0" rx="0" fill="#91a7ff" stroke="#1f2933" stroke-width="1.2"/>
<text x="302.5" y="148.2" font-family="sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1/16</text>
<rect x="265.0" y="30.0" width="37.5" height="75.0" rx="0" fill="#bac8ff" stroke="#1f2933" stroke-width="1.2"/>
<text x="283.8" y="72.2" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">1/32</text>
<rect x="302.5" y="67.5" width="37.5" height="37.5" rx="0" fill="#dbe4ff" stroke="#1f2933" stroke-width="1.2"/>
<text x="321.2" y="89.9" font-family="sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">1/64</text>
<rect x="302.5" y="30.0" width="18.8" height="37.5" rx="0" fill="#edf2ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="321.2" y="48.8" width="18.8" height="18.8" rx="0" fill="#f8f9ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="40.0" y="30.0" width="300.0" height="300.0" rx="0" fill="none" stroke="#1f2933" stroke-width="2"/>
<text x="380.0" y="80.0" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="normal">Het hele vierkant heeft oppervlakte 1.</text>
<text x="380.0" y="110.0" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="normal">Elk nieuw stuk is de helft van wat</text>
<text x="380.0" y="130.0" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="normal">er nog over was.</text>
<text x="380.0" y="175.0" font-family="sans-serif" font-size="17" fill="#3b5bdb" text-anchor="start" font-weight="bold">½ + ¼ + ⅛ + 1/16 + … = 1</text>
<text x="380.0" y="220.0" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="normal">Na n stukken blijft er precies</text>
<text x="380.0" y="240.0" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="normal">(½)ⁿ van het vierkant over.</text>
</svg>
