<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="sans-serif">
<title>Kansboom voor twee trekkingen zonder terugleggen uit een zak met 3 rode en 2 blauwe ballen</title>
<rect width="560" height="300" fill="#ffffff"/>
<g stroke="#1f2933" stroke-width="2" fill="none">
<line x1="40" y1="150" x2="220" y2="80"/><line x1="40" y1="150" x2="220" y2="220"/>
<line x1="270" y1="80" x2="430" y2="40"/><line x1="270" y1="80" x2="430" y2="120"/>
<line x1="270" y1="220" x2="430" y2="180"/><line x1="270" y1="220" x2="430" y2="260"/>
</g>
<g font-size="15" fill="#1f2933" text-anchor="middle">
<text x="105" y="102">3/5</text><text x="105" y="212">2/5</text>
<text x="350" y="46">2/4</text><text x="350" y="124">2/4</text>
<text x="350" y="182">3/4</text><text x="350" y="260">1/4</text>
</g>
<g font-size="17" font-weight="bold" fill="#3b5bdb" text-anchor="middle">
<text x="245" y="86">R</text><text x="245" y="226">B</text>
<text x="445" y="46">R</text><text x="445" y="126">B</text><text x="445" y="186">R</text><text x="445" y="266">B</text>
</g>
<g font-size="15" fill="#1f2933">
<text x="465" y="46">RR: 3/10</text><text x="465" y="126">RB: 3/10</text><text x="465" y="186">BR: 3/10</text><text x="465" y="266">BB: 1/10</text>
</g>
<text x="40" y="170" font-size="13" fill="#9c6b30" text-anchor="middle">start</text>
</svg>