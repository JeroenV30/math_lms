<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 322" role="img" aria-labelledby="title desc">
  <title id="title">Bewijs door herschikking</title>
  <desc id="desc">Links een vierkant met zijde a plus b, gevuld met vier rechthoekige driehoeken en een gekanteld vierkant c kwadraat. Rechts hetzelfde vierkant, met dezelfde vier driehoeken anders gelegd, zodat er een vierkant a kwadraat en een vierkant b kwadraat overblijven.</desc>
  <rect width="660" height="322" fill="#fff"/>
  <g font-family="sans-serif" fill="#1f2933" font-size="16">
    <text x="330.0" y="26.0" text-anchor="middle" font-size="17" font-weight="bold">Twee vierkanten met zijde a + b, elk met vier gelijke driehoeken</text>
    <polygon points="40.0,60.0 222.0,60.0 222.0,242.0 40.0,242.0" fill="#f1f3f5" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="118.0,60.0 222.0,138.0 144.0,242.0 40.0,164.0" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="2" stroke-linejoin="round"/>
    <text x="131.0" y="160.0" text-anchor="middle" font-size="26" fill="#3b5bdb" font-weight="bold">c²</text>
    <text x="79.0" y="52.0" text-anchor="middle" font-size="16" font-style="italic">a</text>
    <text x="170.0" y="52.0" text-anchor="middle" font-size="16" font-style="italic">b</text>
    <text x="234.0" y="104.0" text-anchor="middle" font-size="16" font-style="italic">a</text>
    <text x="234.0" y="195.0" text-anchor="middle" font-size="16" font-style="italic">b</text>
    <text x="131.0" y="272.0" text-anchor="middle" font-size="15">Indeling 1: vier driehoeken + c²</text>
    <polygon points="370.0,60.0 552.0,60.0 552.0,242.0 370.0,242.0" fill="#f1f3f5" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="370.0,60.0 448.0,60.0 448.0,138.0 370.0,138.0" fill="#f3e6d6" stroke="#9c6b30" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="448.0,138.0 552.0,138.0 552.0,242.0 448.0,242.0" fill="#f3e6d6" stroke="#9c6b30" stroke-width="2" stroke-linejoin="round"/>
    <line x1="448.0" y1="60.0" x2="552.0" y2="138.0" stroke="#1f2933" stroke-width="2"/>
    <line x1="370.0" y1="242.0" x2="448.0" y2="138.0" stroke="#1f2933" stroke-width="2"/>
    <text x="409.0" y="107.0" text-anchor="middle" font-size="22" fill="#9c6b30" font-weight="bold">a²</text>
    <text x="500.0" y="198.0" text-anchor="middle" font-size="24" fill="#9c6b30" font-weight="bold">b²</text>
    <text x="409.0" y="52.0" text-anchor="middle" font-size="16" font-style="italic">a</text>
    <text x="500.0" y="52.0" text-anchor="middle" font-size="16" font-style="italic">b</text>
    <text x="358.0" y="104.0" text-anchor="middle" font-size="16" font-style="italic">a</text>
    <text x="358.0" y="195.0" text-anchor="middle" font-size="16" font-style="italic">b</text>
    <text x="461.0" y="272.0" text-anchor="middle" font-size="15">Indeling 2: vier driehoeken + a² + b²</text>
    <text x="330.0" y="304.0" text-anchor="middle" font-size="14" fill="#616e7c">Haal links en rechts de vier driehoeken weg: wat overblijft, is even groot. Dus c² = a² + b².</text>
  </g>
</svg>
