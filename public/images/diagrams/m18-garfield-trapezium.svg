<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Het trapeziumbewijs van Garfield</title>
  <desc id="desc">Een rechthoekig trapezium met evenwijdige zijden a en b en hoogte a plus b, verdeeld in twee gelijke rechthoekige driehoeken met rechthoekszijden a en b en een gelijkbenige rechthoekige driehoek met twee zijden c.</desc>
  <rect width="640" height="360" fill="#fff"/>
  <g font-family="sans-serif" fill="#1f2933" font-size="16">
    <polygon points="60.0,330.0 180.0,330.0 60.0,170.0" fill="#f3e6d6" stroke="#9c6b30" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="60.0,170.0 60.0,50.0 220.0,50.0" fill="#f3e6d6" stroke="#9c6b30" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="180.0,330.0 60.0,170.0 220.0,50.0" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="2" stroke-linejoin="round"/>
    <path d="M72.0,330.0 L72.0,318.0 L60.0,318.0" fill="none" stroke="#1f2933" stroke-width="1.5"/>
    <path d="M60.0,62.0 L72.0,62.0 L72.0,50.0" fill="none" stroke="#1f2933" stroke-width="1.5"/>
    <path d="M68.4,181.2 L79.6,172.8 L71.2,161.6" fill="none" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="120.0" y="352.0" text-anchor="middle" font-size="16" font-style="italic">a</text>
    <text x="46.0" y="255.0" text-anchor="middle" font-size="16" font-style="italic">b</text>
    <text x="46.0" y="115.0" text-anchor="middle" font-size="16" font-style="italic">a</text>
    <text x="140.0" y="40.0" text-anchor="middle" font-size="16" font-style="italic">b</text>
    <text x="136.0" y="266.0" text-anchor="middle" font-size="17" fill="#3b5bdb" font-weight="bold" font-style="italic">c</text>
    <text x="160.0" y="146.0" text-anchor="middle" font-size="17" fill="#3b5bdb" font-weight="bold" font-style="italic">c</text>
    <text x="300.0" y="70.0" text-anchor="start" font-size="17" font-weight="bold">Garfields trapezium (1876)</text>
    <text x="300.0" y="104.0" text-anchor="start" font-size="15">Evenwijdige zijden a en b, hoogte a + b:</text>
    <text x="300.0" y="130.0" text-anchor="start" font-size="15">oppervlakte = ½(a + b)(a + b)</text>
    <text x="300.0" y="166.0" text-anchor="start" font-size="15">Drie driehoeken:</text>
    <text x="300.0" y="192.0" text-anchor="start" font-size="15">½ab + ½ab + ½c²</text>
    <text x="300.0" y="230.0" text-anchor="start" font-size="15">½(a + b)² = ab + ½c²</text>
    <text x="300.0" y="256.0" text-anchor="start" font-size="15">a² + 2ab + b² = 2ab + c²</text>
    <text x="300.0" y="292.0" text-anchor="start" font-size="18" fill="#3b5bdb" font-weight="bold">a² + b² = c²</text>
  </g>
</svg>
