<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" role="img" aria-label="Strookmodel: de prijs exclusief btw is 100 delen, de btw 21 delen, samen 121 delen; de btw is 21 van 121 delen van de prijs inclusief btw">
<title>Strookmodel: de prijs exclusief btw is 100 delen, de btw 21 delen, samen 121 delen; de btw is 21 van 121 delen van de prijs inclusief btw</title>
<rect x="0" y="0" width="540" height="260" fill="#ffffff"/>
<rect x="40" y="90" width="400" height="50" fill="#3b5bdb"/>
<rect x="440" y="90" width="84" height="50" fill="#9c6b30"/>
<text x="240" y="121" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">prijs exclusief btw: 100 delen</text>
<text x="482.0" y="121" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">21</text>
<path d="M 40 80 L 40 72 L 440 72 L 440 80" fill="none" stroke="#3b5bdb" stroke-width="2"/>
<text x="240" y="64" font-family="sans-serif" font-size="14" fill="#3b5bdb" text-anchor="middle" font-weight="bold" font-style="normal">basis: 100%</text>
<path d="M 442 80 L 442 72 L 524 72 L 524 80" fill="none" stroke="#9c6b30" stroke-width="2"/>
<text x="482.0" y="64" font-family="sans-serif" font-size="14" fill="#9c6b30" text-anchor="middle" font-weight="bold" font-style="normal">btw: 21%</text>
<path d="M 40 152 L 40 160 L 524 160 L 524 152" fill="none" stroke="#1f2933" stroke-width="2"/>
<text x="282.0" y="182" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">prijs inclusief btw: 121 delen = 121%</text>
<text x="40" y="216" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">De btw is 21 van de 121 delen van de prijs inclusief btw:</text>
<text x="40" y="238" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold" font-style="normal">21/121 ≈ 17,4% daarvan, niet 21%.</text>
</svg>
