<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" font-family="sans-serif" font-size="15">
  <rect width="640" height="170" fill="#ffffff"/>
  <!-- totaal 520 px; a = 520/1.618 = 321.4; b = 198.6 -->
  <line x1="60" y1="70" x2="381.4" y2="70" stroke="#3b5bdb" stroke-width="6"/>
  <line x1="381.4" y1="70" x2="580" y2="70" stroke="#9c6b30" stroke-width="6"/>
  <g stroke="#1f2933" stroke-width="2"><line x1="60" y1="58" x2="60" y2="82"/><line x1="381.4" y1="58" x2="381.4" y2="82"/><line x1="580" y1="58" x2="580" y2="82"/></g>
  <text x="220.7" y="52" text-anchor="middle" fill="#3b5bdb">a (groot stuk)</text>
  <text x="480.7" y="52" text-anchor="middle" fill="#9c6b30">b (klein stuk)</text>
  <path d="M60 100 v8 h520 v-8" fill="none" stroke="#1f2933" stroke-width="1.5"/>
  <text x="320" y="128" text-anchor="middle" fill="#1f2933">a + b (geheel)</text>
