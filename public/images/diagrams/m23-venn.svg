<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="sans-serif">
<title>Venndiagram van twee gebeurtenissen A en B met overlap; bij het optellen van P(A) en P(B) wordt de overlap tweemaal geteld</title>
<rect width="520" height="260" fill="#ffffff"/>
<rect x="20" y="20" width="480" height="220" fill="none" stroke="#1f2933" stroke-width="2"/>
<circle cx="210" cy="130" r="80" fill="#3b5bdb" fill-opacity="0.18" stroke="#3b5bdb" stroke-width="2"/>
<circle cx="310" cy="130" r="80" fill="#9c6b30" fill-opacity="0.18" stroke="#9c6b30" stroke-width="2"/>
<g font-size="16" fill="#1f2933" text-anchor="middle">
<text x="165" y="135">2</text><text x="260" y="135">4, 6</text><text x="360" y="135">5</text>
<text x="420" y="205">1, 3</text>
<text x="165" y="60" fill="#3b5bdb" font-weight="bold">A: even</text>
<text x="355" y="60" fill="#9c6b30" font-weight="bold">B: groter dan 3</text>
<text x="260" y="162" font-size="13">A en B</text>
<text x="40" y="38" font-size="13" text-anchor="start">Ω: dobbelsteen</text>
</g>
</svg>