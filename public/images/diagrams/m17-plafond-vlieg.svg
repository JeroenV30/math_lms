<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" font-family="sans-serif">
  <title>Een vlieg op een betegeld plafond: vanaf de hoek 4 tegels naar rechts en 3 omhoog</title>
  <rect width="520" height="370" fill="#ffffff"/>
  <defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="pijlb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/></marker><marker id="pijlh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9c6b30"/></marker></defs>
  <rect x="60" y="70" width="400" height="250" fill="#f1f3f5" stroke="#1f2933" stroke-width="2"/>
  <line x1="110" y1="70" x2="110" y2="320" stroke="#ced4da" stroke-width="1.5"/>
  <line x1="160" y1="70" x2="160" y2="320" stroke="#ced4da" stroke-width="1.5"/>
  <line x1="210" y1="70" x2="210" y2="320" stroke="#ced4da" stroke-width="1.5"/>
  <line x1="260" y1="70" x2="260" y2="320" stroke="#ced4da" stroke-width="1.5"/>
  <line x1="310" y1="70" x2="310" y2="320" stroke="#ced4da" stroke-width="1.5"/>
  <line x1="360" y1="70" x2="360" y2="320" stroke="#ced4da" stroke-width="1.5"/>
  <line x1="410" y1="70" x2="410" y2="320" stroke="#ced4da" stroke-width="1.5"/>
  <line x1="60" y1="270" x2="460" y2="270" stroke="#ced4da" stroke-width="1.5"/>
  <line x1="60" y1="220" x2="460" y2="220" stroke="#ced4da" stroke-width="1.5"/>
  <line x1="60" y1="170" x2="460" y2="170" stroke="#ced4da" stroke-width="1.5"/>
  <line x1="60" y1="120" x2="460" y2="120" stroke="#ced4da" stroke-width="1.5"/>
  <line x1="60" y1="342" x2="260" y2="342" stroke="#3b5bdb" stroke-width="2.5" marker-end="url(#pijlb)"/>
  <text x="160.0" y="362" font-size="14" text-anchor="middle" fill="#3b5bdb">4 tegels naar rechts</text>
  <line x1="260" y1="320" x2="260" y2="178" stroke="#3b5bdb" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#pijlb)"/>
  <text x="270" y="245.0" font-size="14" fill="#3b5bdb">3 tegels omhoog</text>
  <g transform="translate(260,170)">
    <ellipse cx="0" cy="0" rx="6" ry="9" fill="#1f2933"/>
    <ellipse cx="-8" cy="-5" rx="8" ry="4" fill="#adb5bd" opacity="0.8" transform="rotate(-25 -8 -5)"/>
    <ellipse cx="8" cy="-5" rx="8" ry="4" fill="#adb5bd" opacity="0.8" transform="rotate(25 8 -5)"/>
  </g>
  <text x="274" y="158" font-size="15" fill="#1f2933" font-weight="bold">(4; 3)</text>
  <circle cx="60" cy="320" r="6" fill="#9c6b30"/>
  <text x="52" y="342" font-size="13" text-anchor="end" fill="#9c6b30">hoek</text>
  <text x="260" y="30" font-size="15" text-anchor="middle" fill="#1f2933">Een plafond van vierkante tegels, van onderaf gezien</text>
</svg>
