<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="sans-serif" role="img" aria-label="Rij 2 van A maal kolom 1 van B geeft het element c21 van AB">
  <rect x="0" y="0" width="600" height="260" fill="#ffffff"/>
  <!-- A: 2x3 -->
  <rect x="38" y="104" width="172" height="40" rx="6" fill="#3b5bdb" fill-opacity="0.15"/>
  <path d="M 40 52 Q 26 100 40 148" fill="none" stroke="#1f2933" stroke-width="2"/>
  <path d="M 208 52 Q 222 100 208 148" fill="none" stroke="#1f2933" stroke-width="2"/>
  <g font-size="22" fill="#1f2933" text-anchor="middle">
    <text x="70" y="85">1</text><text x="124" y="85">2</text><text x="178" y="85">0</text>
    <text x="70" y="132" fill="#3b5bdb" font-weight="bold">3</text><text x="124" y="132" fill="#3b5bdb" font-weight="bold">1</text><text x="178" y="132" fill="#3b5bdb" font-weight="bold">4</text>
  </g>
  <text x="124" y="180" font-size="15" fill="#1f2933" text-anchor="middle">A  (2 × 3)</text>
  <text x="240" y="108" font-size="22" fill="#1f2933" text-anchor="middle">·</text>
  <!-- B: 3x2 -->
  <rect x="268" y="40" width="50" height="132" rx="6" fill="#3b5bdb" fill-opacity="0.15"/>
  <path d="M 270 40 Q 256 106 270 172" fill="none" stroke="#1f2933" stroke-width="2"/>
  <path d="M 372 40 Q 386 106 372 172" fill="none" stroke="#1f2933" stroke-width="2"/>
  <g font-size="22" fill="#1f2933" text-anchor="middle">
    <text x="293" y="72" fill="#3b5bdb" font-weight="bold">2</text><text x="345" y="72">1</text>
    <text x="293" y="115" fill="#3b5bdb" font-weight="bold">5</text><text x="345" y="115">0</text>
    <text x="293" y="158" fill="#3b5bdb" font-weight="bold">1</text><text x="345" y="158">2</text>
  </g>
  <text x="320" y="200" font-size="15" fill="#1f2933" text-anchor="middle">B  (3 × 2)</text>
  <text x="404" y="108" font-size="22" fill="#1f2933" text-anchor="middle">=</text>
  <!-- AB: 2x2 -->
  <path d="M 432 62 Q 418 100 432 138" fill="none" stroke="#1f2933" stroke-width="2"/>
  <path d="M 540 62 Q 554 100 540 138" fill="none" stroke="#1f2933" stroke-width="2"/>
  <rect x="440" y="106" width="48" height="34" rx="6" fill="none" stroke="#3b5bdb" stroke-width="2.5"/>
  <g font-size="22" fill="#1f2933" text-anchor="middle">
    <text x="464" y="92">12</text><text x="514" y="92">1</text>
    <text x="464" y="131" fill="#3b5bdb" font-weight="bold">15</text><text x="514" y="131">11</text>
  </g>
  <text x="486" y="180" font-size="15" fill="#1f2933" text-anchor="middle">AB  (2 × 2)</text>
  <text x="300" y="240" font-size="16" fill="#3b5bdb" text-anchor="middle">c₂₁ = 3 · 2 + 1 · 5 + 4 · 1 = 15   (rij 2 van A, kolom 1 van B)</text>
</svg>
