<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" font-family="sans-serif" role="img" aria-label="Vliegtuig met zijwind: luchtsnelheid, wind en grondsnelheid">
<title>Vliegtuig met zijwind: luchtsnelheid, wind en grondsnelheid</title>
<defs>
<marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/></marker>
<marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
<marker id="ar-his" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9c6b30"/></marker>
<marker id="ar-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
</defs>
<rect x="0" y="0" width="420" height="420" fill="#ffffff"/>
<line x1="150.0" y1="380.0" x2="150.0" y2="60.0" stroke="#3b5bdb" stroke-width="3" marker-end="url(#ar-acc)"/>
<line x1="150.0" y1="60.0" x2="230.0" y2="60.0" stroke="#9c6b30" stroke-width="3" marker-end="url(#ar-his)"/>
<line x1="150.0" y1="380.0" x2="230.0" y2="60.0" stroke="#1f2933" stroke-width="3" marker-end="url(#ar-ink)"/>
<path d="M150.0,290.0 A90,90 0 0 1 171.8,292.7" fill="none" stroke="#1f2933" stroke-width="1.5"/>
<text x="184.0" y="316.0" font-size="13" fill="#1f2933" text-anchor="start">14,0°</text>
<text x="140.0" y="188.0" font-size="13" fill="#3b5bdb" text-anchor="end">luchtsnelheid</text>
<text x="140.0" y="205.0" font-size="13" fill="#3b5bdb" text-anchor="end">200 km/u, neus noord</text>
<text x="190.0" y="48.0" font-size="13" fill="#9c6b30" text-anchor="middle">wind 50 km/u</text>
<text x="211.2" y="204.0" font-size="13" fill="#1f2933" text-anchor="start">grondsnelheid</text>
<text x="211.2" y="221.0" font-size="13" fill="#1f2933" text-anchor="start">≈ 206,2 km/u</text>
<text x="370.0" y="34.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">N</text>
<line x1="370" y1="80" x2="370" y2="42" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ar-ink)"/>
