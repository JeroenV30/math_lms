<text x="640.0" y="70.0" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold" font-style="normal">F-hoeken: zelfde plek</text>
<text x="640.0" y="92.0" font-size="15" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">bij elk snijpunt → gelijk</text>
