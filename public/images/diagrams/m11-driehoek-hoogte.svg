<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 275" font-family="sans-serif" role="img" aria-label="Links een scherphoekige driehoek met de hoogte binnen de figuur, rechts een stomphoekige driehoek waarbij de hoogte op het verlengde van de basis valt">
