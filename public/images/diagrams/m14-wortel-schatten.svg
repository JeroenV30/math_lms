<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="sans-serif">
  <title>De wortel van 20 ligt tussen 4 en 5</title>
  <!-- bovenste lijn: getallen n -->
  <text x="20" y="44" font-size="14" fill="#1f2933">n</text>
  <line x1="50" y1="40" x2="610" y2="40" stroke="#1f2933" stroke-width="2"/>
  <!-- onderste lijn: kwadraten -->
  <text x="20" y="174" font-size="14" fill="#1f2933">n²</text>
  <line x1="50" y1="170" x2="610" y2="170" stroke="#1f2933" stroke-width="2"/>
  <!-- n = 3,4,5,6 op bovenste lijn: x = 50 + (n-3)*160 ... -->
  <g font-size="14" fill="#1f2933" text-anchor="middle">
    <line x1="90" y1="34" x2="90" y2="46" stroke="#1f2933" stroke-width="2"/>
    <text x="90" y="26">3</text>
    <line x1="250" y1="34" x2="250" y2="46" stroke="#1f2933" stroke-width="2"/>
    <text x="250" y="26">4</text>
    <line x1="410" y1="34" x2="410" y2="46" stroke="#1f2933" stroke-width="2"/>
    <text x="410" y="26">5</text>
    <line x1="570" y1="34" x2="570" y2="46" stroke="#1f2933" stroke-width="2"/>
    <text x="570" y="26">6</text>
  </g>
  <!-- kwadraten 9, 16, 25, 36 op onderste lijn: x = 50 + (k-8)*20 -->
  <g font-size="14" fill="#1f2933" text-anchor="middle">
    <line x1="70" y1="164" x2="70" y2="176" stroke="#1f2933" stroke-width="2"/>
    <text x="70" y="196">9</text>
    <line x1="210" y1="164" x2="210" y2="176" stroke="#1f2933" stroke-width="2"/>
    <text x="210" y="196">16</text>
    <line x1="390" y1="164" x2="390" y2="176" stroke="#1f2933" stroke-width="2"/>
    <text x="390" y="196">25</text>
    <line x1="610" y1="164" x2="610" y2="176" stroke="#1f2933" stroke-width="2"/>
    <text x="604" y="196">36</text>
  </g>
  <!-- verbindingslijnen kwadrateren -->
  <g stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="90" y1="46" x2="70" y2="164"/>
    <line x1="250" y1="46" x2="210" y2="164"/>
    <line x1="410" y1="46" x2="390" y2="164"/>
    <line x1="570" y1="46" x2="610" y2="164"/>
  </g>
  <!-- 20 op onderste lijn: x = 50 + 12*20 = 290 ; sqrt(20)=4,472 op bovenste: 250 + 0,472*160 = 325.5 -->
  <circle cx="290" cy="170" r="6" fill="#3b5bdb"/>
  <text x="290" y="218" text-anchor="middle" font-size="15" fill="#3b5bdb">20</text>
  <circle cx="325.5" cy="40" r="6" fill="#3b5bdb"/>
  <line x1="325.5" y1="46" x2="290" y2="164" stroke="#3b5bdb" stroke-width="2"/>
  <text x="335" y="78" font-size="15" fill="#3b5bdb">√20 ≈ 4,47</text>
  <text x="490" y="110" font-size="13" fill="#616e7c" text-anchor="middle">kwadrateren ↓ · worteltrekken ↑</text>
</svg>
