<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" font-family="sans-serif" role="img" aria-label="Eenheidsvierkant in 3 rijen en 5 kolommen; 8 van de 15 vakjes vormen 2/3 van 4/5">
<title>Eenheidsvierkant in 3 rijen en 5 kolommen; 8 van de 15 vakjes vormen 2/3 van 4/5</title>
<rect x="0" y="0" width="760" height="395" fill="#ffffff"/>
<text x="380.0" y="30.0" font-size="18" text-anchor="middle" fill="#1f2933" font-weight="bold">2/3 van 4/5: het rechthoekmodel</text>
<rect x="90.0" y="60.0" width="60.0" height="100.0" rx="0" fill="#91a7ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="150.0" y="60.0" width="60.0" height="100.0" rx="0" fill="#91a7ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="210.0" y="60.0" width="60.0" height="100.0" rx="0" fill="#91a7ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="270.0" y="60.0" width="60.0" height="100.0" rx="0" fill="#91a7ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="330.0" y="60.0" width="60.0" height="100.0" rx="0" fill="#f3e6d6" stroke="#1f2933" stroke-width="1.2"/>
<rect x="90.0" y="160.0" width="60.0" height="100.0" rx="0" fill="#91a7ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="150.0" y="160.0" width="60.0" height="100.0" rx="0" fill="#91a7ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="210.0" y="160.0" width="60.0" height="100.0" rx="0" fill="#91a7ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="270.0" y="160.0" width="60.0" height="100.0" rx="0" fill="#91a7ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="330.0" y="160.0" width="60.0" height="100.0" rx="0" fill="#f3e6d6" stroke="#1f2933" stroke-width="1.2"/>
<rect x="90.0" y="260.0" width="60.0" height="100.0" rx="0" fill="#dbe4ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="150.0" y="260.0" width="60.0" height="100.0" rx="0" fill="#dbe4ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="210.0" y="260.0" width="60.0" height="100.0" rx="0" fill="#dbe4ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="270.0" y="260.0" width="60.0" height="100.0" rx="0" fill="#dbe4ff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="330.0" y="260.0" width="60.0" height="100.0" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<rect x="90.0" y="60.0" width="300.0" height="300.0" rx="0" fill="none" stroke="#1f2933" stroke-width="2.5"/>
<text x="210.0" y="382.0" font-size="14" text-anchor="middle" fill="#3b5bdb" font-weight="normal">4/5 van de breedte</text>
<text x="76" y="160.0" font-size="14" text-anchor="middle" fill="#9c6b30" transform="rotate(-90 76 160.0)">2/3 van de hoogte</text>
<text x="430.0" y="110.0" font-size="15" text-anchor="start" fill="#1f2933" font-weight="normal">Het hele vierkant is 1.</text>
<text x="430.0" y="140.0" font-size="15" text-anchor="start" fill="#1f2933" font-weight="normal">3 rijen × 5 kolommen = 15 vakjes.</text>
<text x="430.0" y="170.0" font-size="15" text-anchor="start" fill="#3b5bdb" font-weight="normal">Donker: 2 × 4 = 8 vakjes.</text>
<text x="430.0" y="215.0" font-size="16" text-anchor="start" fill="#1f2933" font-weight="bold">2/3 × 4/5 = (2 × 4)/(3 × 5) = 8/15</text>
<text x="430.0" y="245.0" font-size="14" text-anchor="start" fill="#52606d" font-weight="normal">teller × teller, noemer × noemer</text>
</svg>
