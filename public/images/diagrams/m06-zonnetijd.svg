<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" role="img" aria-label="Plaatselijke zonnetijd: per graad oosterlengte staat de zon 4 minuten eerder in het zuiden">
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2933">Plaatselijke zonnetijd</text>
<text x="380" y="58" text-anchor="middle" font-size="15" fill="#1f2933">De aarde draait 360° in 24 uur → 15° per uur → 1° per 4 minuten</text>
<!-- zon -->
<circle cx="640" cy="110" r="22" fill="#ffd43b" stroke="#9c6b30" stroke-width="2"/>
<g stroke="#9c6b30" stroke-width="2"><line x1="640" y1="78" x2="640" y2="68"/><line x1="640" y1="142" x2="640" y2="152"/><line x1="608" y1="110" x2="598" y2="110"/><line x1="672" y1="110" x2="682" y2="110"/></g>
<text x="640" y="180" text-anchor="middle" font-size="13" fill="#9c6b30">de zon 'trekt' van oost naar west</text>
<!-- lengte-as -->
<line x1="60" y1="240" x2="700" y2="240" stroke="#1f2933" stroke-width="2"/>
<g font-size="13" fill="#1f2933" text-anchor="middle">
<line x1="100" y1="232" x2="100" y2="248" stroke="#1f2933" stroke-width="2"/><text x="100" y="268">0°</text>
<line x1="180" y1="234" x2="180" y2="246" stroke="#1f2933"/><text x="180" y="268">1°</text>
<line x1="260" y1="234" x2="260" y2="246" stroke="#1f2933"/><text x="260" y="268">2°</text>
<line x1="340" y1="234" x2="340" y2="246" stroke="#1f2933"/><text x="340" y="268">3°</text>
<line x1="420" y1="234" x2="420" y2="246" stroke="#1f2933"/><text x="420" y="268">4°</text>
<line x1="500" y1="234" x2="500" y2="246" stroke="#1f2933"/><text x="500" y="268">5°</text>
<line x1="580" y1="234" x2="580" y2="246" stroke="#1f2933"/><text x="580" y="268">6°</text>
<line x1="660" y1="234" x2="660" y2="246" stroke="#1f2933"/><text x="660" y="268">7° O</text>
</g>
<circle cx="100" cy="240" r="7" fill="#1f2933"/>
<text x="100" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Greenwich</text>
<text x="100" y="198" text-anchor="middle" font-size="13" fill="#1f2933">12:00 zonnetijd</text>
<circle cx="490" cy="240" r="7" fill="#3b5bdb"/>
<text x="490" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#3b5bdb">Amsterdam (≈ 4,9° O)</text>
<text x="490" y="198" text-anchor="middle" font-size="13" fill="#3b5bdb">al ≈ 12:20 zonnetijd</text>
<path d="M100,292 L490,292" stroke="#3b5bdb" stroke-width="2"/>
<line x1="100" y1="286" x2="100" y2="298" stroke="#3b5bdb" stroke-width="2"/><line x1="490" y1="286" x2="490" y2="298" stroke="#3b5bdb" stroke-width="2"/>
<text x="295" y="315" text-anchor="middle" font-size="14" fill="#3b5bdb">4,9 × 4 min ≈ 19,6 min voorsprong (officieel 19 min 32 s)</text>
</svg>
