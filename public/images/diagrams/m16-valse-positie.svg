<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 225" role="img" aria-label="Valse positie bij Rhind-probleem 24: gok 7 geeft 8, schaal met 19/8">
<title>Valse positie bij Rhind-probleem 24: gok 7 geeft 8, schaal met 19/8</title>
<rect width="700" height="225" fill="#ffffff"/>
<defs><marker id="pv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3b5bdb"/></marker></defs><text x="20" y="28" font-family="sans-serif" font-size="14" text-anchor="start" fill="#9c6b30" font-weight="bold">Valse positie: een hoeveelheid en haar zevende deel samen zijn 19</text><text x="80" y="62" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal"></text><text x="220" y="62" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">hoeveelheid</text><text x="360" y="62" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">+ zevende deel</text><text x="500" y="62" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">= samen</text><text x="80" y="106" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#9c6b30" font-weight="bold">gok</text><rect x="175" y="82" width="90" height="36" rx="6" fill="#f1f3f5" stroke="#9c6b30" stroke-width="1.6"/><text x="220" y="106" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">7</text><rect x="315" y="82" width="90" height="36" rx="6" fill="#f1f3f5" stroke="#9c6b30" stroke-width="1.6"/><text x="360" y="106" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">1</text><rect x="455" y="82" width="90" height="36" rx="6" fill="#f1f3f5" stroke="#9c6b30" stroke-width="1.6"/><text x="500" y="106" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">8</text><text x="80" y="158" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#3b5bdb" font-weight="bold">gevraagd</text><rect x="175" y="134" width="90" height="36" rx="6" fill="#f1f3f5" stroke="#3b5bdb" stroke-width="1.6"/><text x="220" y="158" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">?</text><rect x="455" y="134" width="90" height="36" rx="6" fill="#f1f3f5" stroke="#3b5bdb" stroke-width="1.6"/><text x="500" y="158" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">19</text><path d="M560,100 C 600,110 600,142 560,152" fill="none" stroke="#3b5bdb" stroke-width="2" marker-end="url(#pv)"/><text x="610" y="132" font-family="sans-serif" font-size="14" text-anchor="start" fill="#3b5bdb" font-weight="bold">× 19/8</text><path d="M265,100 C 300,110 300,142 265,152" fill="none" stroke="#3b5bdb" stroke-width="2" marker-end="url(#pv)"/><text x="300" y="132" font-family="sans-serif" font-size="14" text-anchor="start" fill="#3b5bdb" font-weight="bold">× 19/8</text><text x="20" y="205" font-family="sans-serif" font-size="14" text-anchor="start" fill="#1f2933" font-weight="normal">Uitkomst: 7 × 19/8 = 133/8 = 16 + 1/2 + 1/8. Controle: 133/8 + 19/8 = 152/8 = 19.</text>
</svg>
