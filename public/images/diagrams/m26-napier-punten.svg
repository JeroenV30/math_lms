<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="sans-serif" font-size="14"><text x="30" y="40" fill="#1f2933">Lijn 1: gelijke stappen in gelijke tijd</text><line x1="30" y1="60" x2="670" y2="60" stroke="#1f2933" stroke-width="2"/><circle cx="30" cy="60" r="5" fill="#3b5bdb"/><text x="30" y="84" text-anchor="middle" fill="#1f2933">t = 0</text><circle cx="130" cy="60" r="5" fill="#3b5bdb"/><text x="130" y="84" text-anchor="middle" fill="#1f2933">t = 1</text><circle cx="230" cy="60" r="5" fill="#3b5bdb"/><text x="230" y="84" text-anchor="middle" fill="#1f2933">t = 2</text><circle cx="330" cy="60" r="5" fill="#3b5bdb"/><text x="330" y="84" text-anchor="middle" fill="#1f2933">t = 3</text><circle cx="430" cy="60" r="5" fill="#3b5bdb"/><text x="430" y="84" text-anchor="middle" fill="#1f2933">t = 4</text><circle cx="530" cy="60" r="5" fill="#3b5bdb"/><text x="530" y="84" text-anchor="middle" fill="#1f2933">t = 5</text><text x="30" y="130" fill="#1f2933">Lijn 2: de resterende afstand wordt in elke tijdstap met dezelfde factor kleiner</text><line x1="30" y1="150" x2="670" y2="150" stroke="#1f2933" stroke-width="2"/><circle cx="670" cy="150" r="4" fill="#9c6b30"/><circle cx="30.0" cy="150" r="5" fill="#9c6b30"/><text x="30.0" y="174" text-anchor="middle" fill="#1f2933" font-size="12">0</text><circle cx="222.0" cy="150" r="5" fill="#9c6b30"/><text x="222.0" y="174" text-anchor="middle" fill="#1f2933" font-size="12">1</text><circle cx="356.4" cy="150" r="5" fill="#9c6b30"/><text x="356.4" y="174" text-anchor="middle" fill="#1f2933" font-size="12">2</text><circle cx="450.5" cy="150" r="5" fill="#9c6b30"/><text x="450.5" y="174" text-anchor="middle" fill="#1f2933" font-size="12">3</text><circle cx="516.3" cy="150" r="5" fill="#9c6b30"/><text x="516.3" y="174" text-anchor="middle" fill="#1f2933" font-size="12">4</text><circle cx="562.4" cy="150" r="5" fill="#9c6b30"/><text x="562.4" y="174" text-anchor="middle" fill="#1f2933" font-size="12">5</text><text x="350" y="215" text-anchor="middle" fill="#1f2933" font-size="13">Tijd op lijn 1 meet hoe vaak de factor is toegepast op lijn 2: een logaritme.</text></svg>