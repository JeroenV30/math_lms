<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="sans-serif">
  <title>Kwadraat als oppervlakte, kubus als inhoud</title>
  <!-- Vierkant 3 x 3 -->
  <g transform="translate(60,40)">
    <rect x="0" y="0" width="150" height="150" fill="#f1f3f5" stroke="#1f2933" stroke-width="2"/>
    <g stroke="#1f2933" stroke-width="1" opacity="0.6">
      <line x1="50" y1="0" x2="50" y2="150"/>
      <line x1="100" y1="0" x2="100" y2="150"/>
      <line x1="0" y1="50" x2="150" y2="50"/>
      <line x1="0" y1="100" x2="150" y2="100"/>
    </g>
    <text x="75" y="172" text-anchor="middle" font-size="14" fill="#1f2933">zijde 3</text>
    <text x="-12" y="80" text-anchor="end" font-size="14" fill="#1f2933">3</text>
    <text x="75" y="224" text-anchor="middle" font-size="16" fill="#3b5bdb">3² = 3 · 3 = 9 vakjes</text>
  </g>
  <!-- Kubus 3 x 3 x 3, schuin aanzicht -->
  <g transform="translate(380,70)" stroke="#1f2933">
    <!-- voorvlak -->
    <rect x="0" y="30" width="120" height="120" fill="#f1f3f5" stroke-width="2"/>
    <line x1="40" y1="30" x2="40" y2="150" stroke-width="1" opacity="0.6"/>
    <line x1="80" y1="30" x2="80" y2="150" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="70" x2="120" y2="70" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="110" x2="120" y2="110" stroke-width="1" opacity="0.6"/>
    <!-- bovenvlak -->
    <polygon points="0,30 45,-15 165,-15 120,30" fill="#dbe4ff" stroke-width="2"/>
    <line x1="15" y1="15" x2="135" y2="15" stroke-width="1" opacity="0.6"/>
    <line x1="30" y1="0" x2="150" y2="0" stroke-width="1" opacity="0.6"/>
    <line x1="40" y1="30" x2="85" y2="-15" stroke-width="1" opacity="0.6"/>
    <line x1="80" y1="30" x2="125" y2="-15" stroke-width="1" opacity="0.6"/>
    <!-- zijvlak -->
    <polygon points="120,30 165,-15 165,105 120,150" fill="#e9ecef" stroke-width="2"/>
    <line x1="135" y1="15" x2="135" y2="135" stroke-width="1" opacity="0.6"/>
    <line x1="150" y1="0" x2="150" y2="120" stroke-width="1" opacity="0.6"/>
    <line x1="120" y1="70" x2="165" y2="25" stroke-width="1" opacity="0.6"/>
    <line x1="120" y1="110" x2="165" y2="65" stroke-width="1" opacity="0.6"/>
  </g>
  <text x="440" y="264" text-anchor="middle" font-size="16" fill="#3b5bdb">3³ = 3 · 3 · 3 = 27 blokjes</text>
  <text x="440" y="240" text-anchor="middle" font-size="14" fill="#1f2933">ribbe 3</text>
</svg>
