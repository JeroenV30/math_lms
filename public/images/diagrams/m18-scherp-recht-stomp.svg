<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" role="img" aria-labelledby="title desc">
  <title id="title">Scherpe, rechte en stompe hoek vergeleken</title>
  <desc id="desc">Drie driehoeken met zijden 3 en 4 rond een hoek van 60, 90 en 120 graden. Het kwadraat van de derde zijde is 13, 25 en 37: kleiner dan, gelijk aan en groter dan 9 plus 16.</desc>
  <rect width="660" height="320" fill="#fff"/>
  <g font-family="sans-serif" fill="#1f2933" font-size="16">
    <text x="330.0" y="26.0" text-anchor="middle" font-size="17" font-weight="bold">Zelfde a = 3 en b = 4, andere hoek ertussen</text>
    <polygon points="70.0,210.0 174.0,210.0 109.0,142.5" fill="#f1f3f5" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
    <line x1="174.0" y1="210.0" x2="109.0" y2="142.5" stroke="#3b5bdb" stroke-width="4"/>
    <path d="M86.0,210.0 A16,16 0 0 0 78.0,196.1" fill="none" stroke="#1f2933" stroke-width="1.5"/>
    <text x="122.0" y="230.0" text-anchor="middle" font-size="13">b = 4</text>
    <text x="67.5" y="180.2" text-anchor="middle" font-size="13">a = 3</text>
    <text x="155.5" y="170.2" text-anchor="middle" font-size="16" fill="#3b5bdb" font-weight="bold" font-style="italic">c</text>
    <text x="122.0" y="250.0" text-anchor="middle" font-size="15" font-weight="bold">scherpe hoek</text>
    <text x="122.0" y="274.0" text-anchor="middle" font-size="15" fill="#3b5bdb">c² = 13 &lt; 25</text>
    <polygon points="275.0,210.0 379.0,210.0 275.0,132.0" fill="#f1f3f5" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
    <line x1="379.0" y1="210.0" x2="275.0" y2="132.0" stroke="#3b5bdb" stroke-width="4"/>
    <path d="M287.0,210.0 L287.0,198.0 L275.0,198.0" fill="none" stroke="#1f2933" stroke-width="1.5"/>
    <text x="327.0" y="230.0" text-anchor="middle" font-size="13">b = 4</text>
    <text x="253.0" y="175.0" text-anchor="middle" font-size="13">a = 3</text>
    <text x="341.0" y="165.0" text-anchor="middle" font-size="16" fill="#3b5bdb" font-weight="bold" font-style="italic">c</text>
    <text x="327.0" y="250.0" text-anchor="middle" font-size="15" font-weight="bold">rechte hoek</text>
    <text x="327.0" y="274.0" text-anchor="middle" font-size="15" fill="#3b5bdb">c² = 25 = 25</text>
    <polygon points="520.0,210.0 624.0,210.0 481.0,142.5" fill="#f1f3f5" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
    <line x1="624.0" y1="210.0" x2="481.0" y2="142.5" stroke="#3b5bdb" stroke-width="4"/>
    <path d="M536.0,210.0 A16,16 0 0 0 512.0,196.1" fill="none" stroke="#1f2933" stroke-width="1.5"/>
    <text x="572.0" y="230.0" text-anchor="middle" font-size="13">b = 4</text>
    <text x="478.5" y="180.2" text-anchor="middle" font-size="13">a = 3</text>
    <text x="566.5" y="170.2" text-anchor="middle" font-size="16" fill="#3b5bdb" font-weight="bold" font-style="italic">c</text>
    <text x="552.0" y="250.0" text-anchor="middle" font-size="15" font-weight="bold">stompe hoek</text>
    <text x="552.0" y="274.0" text-anchor="middle" font-size="15" fill="#3b5bdb">c² = 37 &gt; 25</text>
    <text x="330.0" y="305.0" text-anchor="middle" font-size="14" fill="#616e7c">a² + b² = 9 + 16 = 25. Alleen bij de rechte hoek is c² precies 25.</text>
  </g>
</svg>
