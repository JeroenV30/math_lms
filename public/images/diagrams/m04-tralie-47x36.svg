<text x="400" y="250" font-family="sans-serif" font-size="20" fill="#1f2933" text-anchor="start" font-weight="bold">47 × 36 = 1692</text>
<text x="30" y="320" font-family="sans-serif" font-size="14" fill="#9c6b30" text-anchor="start" font-weight="normal">Lees de uitkomst linksboven beginnend: 1 – 6 – 9 – 2.</text>
