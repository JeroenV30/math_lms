<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="Cirkeldiagram van een maandbudget: wonen 40 procent, boodschappen 25 procent, vervoer 15 procent, overig 20 procent">
<title>Cirkeldiagram van een maandbudget: wonen 40 procent, boodschappen 25 procent, vervoer 15 procent, overig 20 procent</title>
<rect x="0" y="0" width="560" height="320" fill="#ffffff"/>
<text x="280.0" y="26" font-family="sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Maandbudget van een huishouden</text>
<path d="M 165 165 L 165.0 40.0 A 125 125 0 0 1 238.5 266.1 Z" fill="#3b5bdb" stroke="#ffffff" stroke-width="2"/>
<text x="238.7" y="146.1" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">40%</text>
<path d="M 165 165 L 238.5 266.1 A 125 125 0 0 1 63.9 238.5 Z" fill="#748ffc" stroke="#ffffff" stroke-width="2"/>
<text x="152.9" y="246.5" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">25%</text>
<path d="M 165 165 L 63.9 238.5 A 125 125 0 0 1 46.1 126.4 Z" fill="#9c6b30" stroke="#ffffff" stroke-width="2"/>
<text x="88.5" y="182.1" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">15%</text>
<path d="M 165 165 L 46.1 126.4 A 125 125 0 0 1 165.0 40.0 Z" fill="#adb5bd" stroke="#ffffff" stroke-width="2"/>
<text x="119.4" y="107.3" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">20%</text>
<rect x="330" y="96" width="18" height="18" fill="#3b5bdb" stroke="none"/>
<text x="358" y="110" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="normal">Wonen (40%)</text>
<rect x="330" y="130" width="18" height="18" fill="#748ffc" stroke="none"/>
<text x="358" y="144" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="normal">Boodschappen (25%)</text>
<rect x="330" y="164" width="18" height="18" fill="#9c6b30" stroke="none"/>
<text x="358" y="178" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="normal">Vervoer (15%)</text>
<rect x="330" y="198" width="18" height="18" fill="#adb5bd" stroke="none"/>
<text x="358" y="212" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="normal">Overig (20%)</text>
</svg>
