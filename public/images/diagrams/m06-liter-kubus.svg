<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="sans-serif" role="img" aria-label="Een kubus van 10 bij 10 bij 10 centimeter heeft een inhoud van 1 kubieke decimeter, dat is 1 liter">
<rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2933">1 dm³ = 1 liter</text>
<!-- grote kubus: voorvlak 200x200 op (110,120), diepte-offset (80,-60) -->
<polygon points="110,120 190,60 390,60 310,120" fill="#dbe4ff" stroke="#1f2933" stroke-width="2"/>
<polygon points="310,120 390,60 390,260 310,320" fill="#c5d0f5" stroke="#1f2933" stroke-width="2"/>
<rect x="110" y="120" width="200" height="200" fill="#f1f3f5" stroke="#1f2933" stroke-width="2"/>
<!-- rasterlijnen op voorvlak (10 x 10) -->
<g stroke="#adb5bd" stroke-width="0.8">
<line x1="130" y1="120" x2="130" y2="320"/><line x1="150" y1="120" x2="150" y2="320"/><line x1="170" y1="120" x2="170" y2="320"/><line x1="190" y1="120" x2="190" y2="320"/><line x1="210" y1="120" x2="210" y2="320"/><line x1="230" y1="120" x2="230" y2="320"/><line x1="250" y1="120" x2="250" y2="320"/><line x1="270" y1="120" x2="270" y2="320"/><line x1="290" y1="120" x2="290" y2="320"/>
<line x1="110" y1="140" x2="310" y2="140"/><line x1="110" y1="160" x2="310" y2="160"/><line x1="110" y1="180" x2="310" y2="180"/><line x1="110" y1="200" x2="310" y2="200"/><line x1="110" y1="220" x2="310" y2="220"/><line x1="110" y1="240" x2="310" y2="240"/><line x1="110" y1="260" x2="310" y2="260"/><line x1="110" y1="280" x2="310" y2="280"/><line x1="110" y1="300" x2="310" y2="300"/>
</g>
<rect x="110" y="300" width="20" height="20" fill="#3b5bdb" stroke="#1f2933" stroke-width="1"/>
<rect x="110" y="120" width="200" height="200" fill="none" stroke="#1f2933" stroke-width="2"/>
<text x="210" y="345" text-anchor="middle" font-size="15" fill="#1f2933">10 cm = 1 dm</text>
<text x="88" y="225" text-anchor="middle" font-size="15" fill="#1f2933" transform="rotate(-90 88 225)">10 cm = 1 dm</text>
<text x="372" y="300" font-size="15" fill="#1f2933" transform="rotate(-37 372 300)">10 cm</text>
<!-- uitleg -->
<text x="450" y="110" font-size="16" fill="#1f2933" font-weight="bold">Grote kubus</text>
<text x="450" y="135" font-size="15" fill="#1f2933">10 × 10 × 10 = 1000 cm³</text>
<text x="450" y="158" font-size="15" fill="#1f2933">= 1 dm³ = 1 liter</text>
<rect x="450" y="200" width="20" height="20" fill="#3b5bdb" stroke="#1f2933"/>
<text x="480" y="215" font-size="16" fill="#3b5bdb" font-weight="bold">Klein blokje</text>
<text x="450" y="245" font-size="15" fill="#1f2933">1 × 1 × 1 = 1 cm³</text>
<text x="450" y="268" font-size="15" fill="#1f2933">= 1 milliliter</text>
<text x="450" y="310" font-size="14" fill="#9c6b30">Er passen 1000 blokjes in de kubus:</text>
<text x="450" y="330" font-size="14" fill="#9c6b30">1 l = 1000 ml</text>
</svg>
