<text x="25.0" y="168.0" font-size="15" text-anchor="start" fill="#1f2933" font-weight="normal">1. Snijd zeven broden in 2/3 en 1/3. Zeven arbeiders krijgen een stuk van 2/3,</text>
<text x="25.0" y="190.0" font-size="15" text-anchor="start" fill="#1f2933" font-weight="normal">    drie arbeiders krijgen twee stukken van 1/3. Er blijft één stuk van 1/3 over.</text>
<text x="25.0" y="220.0" font-size="15" text-anchor="start" fill="#1f2933" font-weight="normal">2. Snijd de laatste twee broden in vijfden: tien stukken van 1/5, één per arbeider.</text>
<text x="25.0" y="250.0" font-size="15" text-anchor="start" fill="#1f2933" font-weight="normal">3. Snijd het overgebleven derde in tien gelijke stukjes: ieder krijgt 1/30.</text>
