<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="sans-serif" role="img" aria-label="Twee snijdende lijnen met vier hoeken a, b, c en d; a is gelijk aan c en b is gelijk aan d">
<title>Twee snijdende lijnen met vier hoeken a, b, c en d; a is gelijk aan c en b is gelijk aan d</title>
<rect x="0" y="0" width="820" height="320" fill="#ffffff"/>
<line x1="86.2" y1="274.7" x2="413.8" y2="45.3" stroke="#1f2933" stroke-width="2"/>
<line x1="423.2" y1="260.0" x2="76.8" y2="60.0" stroke="#1f2933" stroke-width="2"/>
<path d="M 250.0 160.0 L 286.9 134.2 A 45 45 0 0 0 211.0 137.5 Z" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
<path d="M 250.0 160.0 L 213.1 185.8 A 45 45 0 0 0 289.0 182.5 Z" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
<path d="M 250.0 160.0 L 222.3 144.0 A 32 32 0 0 0 223.8 178.4 Z" fill="#f3e6d3" stroke="#9c6b30" stroke-width="1.5"/>
<path d="M 250.0 160.0 L 277.7 176.0 A 32 32 0 0 0 276.2 141.6 Z" fill="#f3e6d3" stroke="#9c6b30" stroke-width="1.5"/>
<text x="247.2" y="101.1" font-size="18" fill="#3b5bdb" text-anchor="middle" font-weight="bold" font-style="italic">a</text>
<text x="198.0" y="168.3" font-size="18" fill="#9c6b30" text-anchor="middle" font-weight="bold" font-style="italic">b</text>
<text x="252.8" y="230.9" font-size="18" fill="#3b5bdb" text-anchor="middle" font-weight="bold" font-style="italic">c</text>
<text x="304.9" y="163.6" font-size="18" fill="#9c6b30" text-anchor="middle" font-weight="bold" font-style="italic">d</text>
<text x="560.0" y="90.0" font-size="16" fill="#3b5bdb" text-anchor="start" font-weight="normal" font-style="normal">a = c  (overstaand)</text>
<text x="560.0" y="120.0" font-size="16" fill="#9c6b30" text-anchor="start" font-weight="normal" font-style="normal">b = d  (overstaand)</text>
<text x="560.0" y="170.0" font-size="15" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">a + b = 180°  (nevenhoeken)</text>
<text x="560.0" y="198.0" font-size="15" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">b + c = 180°  (nevenhoeken)</text>

</svg>
