<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" role="img" aria-label="Drie stappen volgens Schmandt-Besserat: losse telfiches, een kleienvelop met afdrukken, en een tablet waarop het getal los van het ding staat">
<title>Drie stappen volgens Schmandt-Besserat: losse telfiches, een kleienvelop met afdrukken, en een tablet waarop het getal los van het ding staat</title>
<rect x="0" y="0" width="780" height="270" rx="10" fill="#f1f3f5"/>
<rect x="20" y="15" width="235" height="240" rx="10" fill="#ffffff" stroke="#d0d5db"/>
<text x="137" y="42" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">1. Telfiches</text>
<text x="137" y="220" font-family="sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">vijf kruiken olie = vijf eivormige fiches</text>
<text x="137" y="240" font-family="sans-serif" font-size="11.5" fill="#9c6b30" text-anchor="middle" font-weight="bold">vanaf ca. 7500 v.Chr.</text>
<rect x="275" y="15" width="235" height="240" rx="10" fill="#ffffff" stroke="#d0d5db"/>
<text x="392" y="42" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">2. Envelop met afdrukken</text>
<text x="392" y="220" font-family="sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">de fiches zitten erin, afdrukken erop</text>
<text x="392" y="240" font-family="sans-serif" font-size="11.5" fill="#9c6b30" text-anchor="middle" font-weight="bold">ca. 3500–3300 v.Chr.</text>
<rect x="530" y="15" width="235" height="240" rx="10" fill="#ffffff" stroke="#d0d5db"/>
<text x="647" y="42" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">3. Getal + teken</text>
<text x="647" y="220" font-family="sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">‘5’ en ‘kruik olie’ apart geschreven</text>
<text x="647" y="240" font-family="sans-serif" font-size="11.5" fill="#9c6b30" text-anchor="middle" font-weight="bold">ca. 3100 v.Chr.</text>
