<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
  <rect width="640" height="300" fill="#ffffff"/>
  <!-- linker grafiek: prijs = 4 x lengte, x 0..6 m, y 0..30 euro -->
  <g transform="translate(50,30)">
    <text x="115" y="0" text-anchor="middle" fill="#1f2933" font-size="14">Recht evenredig</text>
    <g stroke="#e4e7eb" stroke-width="1">
      <line x1="0" y1="190" x2="240" y2="190"/><line x1="0" y1="140" x2="240" y2="140"/><line x1="0" y1="90" x2="240" y2="90"/><line x1="0" y1="40" x2="240" y2="40"/>
    </g>
    <line x1="0" y1="240" x2="250" y2="240" stroke="#1f2933" stroke-width="1.5"/>
    <line x1="0" y1="240" x2="0" y2="20" stroke="#1f2933" stroke-width="1.5"/>
    <line x1="0" y1="240" x2="240" y2="0" stroke="#3b5bdb" stroke-width="3"/>
    <circle cx="0" cy="240" r="5" fill="#3b5bdb"/>
    <circle cx="120" cy="120" r="4" fill="#3b5bdb"/><circle cx="200" cy="40" r="4" fill="#3b5bdb"/>
    <g fill="#616e7c" text-anchor="end"><text x="-6" y="244">0</text><text x="-6" y="194">5</text><text x="-6" y="144">10</text><text x="-6" y="94">15</text><text x="-6" y="44">20</text></g>
    <g fill="#616e7c" text-anchor="middle"><text x="0" y="258">0</text><text x="40" y="258">1</text><text x="80" y="258">2</text><text x="120" y="258">3</text><text x="160" y="258">4</text><text x="200" y="258">5</text></g>
    <text x="125" y="275" text-anchor="middle" fill="#1f2933">lengte (m)</text>
    <text x="10" y="25" fill="#1f2933">prijs (€)</text>
    <text x="130" y="140" fill="#3b5bdb">prijs = 4 × lengte</text>
  </g>
  <!-- rechter grafiek: prijs = 5 + 2 x afstand, x 0..12, y 0..30 -->
  <g transform="translate(370,30)">
    <text x="115" y="0" text-anchor="middle" fill="#1f2933" font-size="14">Niet evenredig</text>
    <g stroke="#e4e7eb" stroke-width="1">
      <line x1="0" y1="180" x2="240" y2="180"/><line x1="0" y1="120" x2="240" y2="120"/><line x1="0" y1="60" x2="240" y2="60"/>
    </g>
    <line x1="0" y1="240" x2="250" y2="240" stroke="#1f2933" stroke-width="1.5"/>
    <line x1="0" y1="240" x2="0" y2="20" stroke="#1f2933" stroke-width="1.5"/>
    <!-- y scale: 6 px per euro (240px = 40 euro); x: 20px per km -->
    <line x1="0" y1="210" x2="240" y2="66" stroke="#9c6b30" stroke-width="3"/>
    <circle cx="0" cy="210" r="5" fill="#9c6b30"/>
    <circle cx="60" cy="174" r="4" fill="#9c6b30"/><circle cx="120" cy="138" r="4" fill="#9c6b30"/>
    <g fill="#616e7c" text-anchor="end"><text x="-6" y="244">0</text><text x="-6" y="184">10</text><text x="-6" y="124">20</text><text x="-6" y="64">30</text></g>
    <g fill="#616e7c" text-anchor="middle"><text x="0" y="258">0</text><text x="60" y="258">3</text><text x="120" y="258">6</text><text x="180" y="258">9</text><text x="240" y="258">12</text></g>
    <text x="125" y="275" text-anchor="middle" fill="#1f2933">afstand (km)</text>
    <text x="10" y="25" fill="#1f2933">prijs (€)</text>
    <text x="10" y="226" fill="#9c6b30">start € 5</text>
    <text x="70" y="115" fill="#9c6b30">3 km: € 11, 6 km: € 17</text>
  </g>
</svg>
