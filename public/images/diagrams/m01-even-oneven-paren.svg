<text x="120" y="140" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">8 = 4 paren → even</text>
<circle cx="370" cy="50" r="10" fill="#3b5bdb"/>
<circle cx="370" cy="80" r="10" fill="#3b5bdb"/>
