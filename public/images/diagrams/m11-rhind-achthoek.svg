<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="sans-serif" role="img" aria-label="Een vierkant van 9 bij 9 verdeeld in vakjes van 3 bij 3 met afgesneden hoeken tot een achthoek, en de ingeschreven cirkel met middellijn 9">
<title>Een vierkant van 9 bij 9 verdeeld in vakjes van 3 bij 3 met afgesneden hoeken tot een achthoek, en de ingeschreven cirkel met middellijn 9</title>
<rect x="0" y="0" width="700" height="340" fill="#ffffff"/>
<rect x="60" y="40" width="270" height="270" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<line x1="90.0" y1="40.0" x2="90.0" y2="310.0" stroke="#adb5bd" stroke-width="0.6"/>
<line x1="60.0" y1="70.0" x2="330.0" y2="70.0" stroke="#adb5bd" stroke-width="0.6"/>
<line x1="120.0" y1="40.0" x2="120.0" y2="310.0" stroke="#adb5bd" stroke-width="0.6"/>
<line x1="60.0" y1="100.0" x2="330.0" y2="100.0" stroke="#adb5bd" stroke-width="0.6"/>
<line x1="150.0" y1="40.0" x2="150.0" y2="310.0" stroke="#1f2933" stroke-width="1.2"/>
<line x1="60.0" y1="130.0" x2="330.0" y2="130.0" stroke="#1f2933" stroke-width="1.2"/>
<line x1="180.0" y1="40.0" x2="180.0" y2="310.0" stroke="#adb5bd" stroke-width="0.6"/>
<line x1="60.0" y1="160.0" x2="330.0" y2="160.0" stroke="#adb5bd" stroke-width="0.6"/>
<line x1="210.0" y1="40.0" x2="210.0" y2="310.0" stroke="#adb5bd" stroke-width="0.6"/>
<line x1="60.0" y1="190.0" x2="330.0" y2="190.0" stroke="#adb5bd" stroke-width="0.6"/>
<line x1="240.0" y1="40.0" x2="240.0" y2="310.0" stroke="#1f2933" stroke-width="1.2"/>
<line x1="60.0" y1="220.0" x2="330.0" y2="220.0" stroke="#1f2933" stroke-width="1.2"/>
<line x1="270.0" y1="40.0" x2="270.0" y2="310.0" stroke="#adb5bd" stroke-width="0.6"/>
<line x1="60.0" y1="250.0" x2="330.0" y2="250.0" stroke="#adb5bd" stroke-width="0.6"/>
<line x1="300.0" y1="40.0" x2="300.0" y2="310.0" stroke="#adb5bd" stroke-width="0.6"/>
<line x1="60.0" y1="280.0" x2="330.0" y2="280.0" stroke="#adb5bd" stroke-width="0.6"/>
<polygon points="150.0,40.0 240.0,40.0 330.0,130.0 330.0,220.0 240.0,310.0 150.0,310.0 60.0,220.0 60.0,130.0" fill="rgba(59,91,219,0.18)" stroke="#3b5bdb" stroke-width="2.5"/>
<circle cx="195.0" cy="175.0" r="135.0" fill="none" stroke="#9c6b30" stroke-width="2.2" stroke-dasharray="7 4"/>
<text x="195.0" y="335.0" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal" font-style="normal">9</text>
<text x="380.0" y="80.0" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">Vierkant: 9 × 9 = 81</text>
<text x="380.0" y="110.0" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">4 hoekdriehoeken: 4 × 4,5 = 18</text>
<text x="380.0" y="140.0" font-size="16" fill="#3b5bdb" text-anchor="start" font-weight="bold" font-style="normal">Achthoek: 81 − 18 = 63</text>
<text x="380.0" y="180.0" font-size="16" fill="#9c6b30" text-anchor="start" font-weight="bold" font-style="normal">Cirkel (d = 9): π × 4,5² ≈ 63,6</text>
<text x="380.0" y="220.0" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold" font-style="normal">Ahmes: (9 − 1)² = 8² = 64</text>

</svg>
