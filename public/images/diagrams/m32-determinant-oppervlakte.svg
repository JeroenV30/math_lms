<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="sans-serif" role="img" aria-label="Het eenheidsvierkant wordt door de matrix met kolommen (3; 1) en (1; 2) afgebeeld op een parallellogram met oppervlakte 5">
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>
  <g stroke="#1f2933" stroke-opacity="0.15" stroke-width="1">
    <line x1="60" y1="300" x2="60" y2="60"/><line x1="120" y1="300" x2="120" y2="60"/><line x1="180" y1="300" x2="180" y2="60"/><line x1="240" y1="300" x2="240" y2="60"/><line x1="300" y1="300" x2="300" y2="60"/><line x1="360" y1="300" x2="360" y2="60"/><line x1="60" y1="300" x2="360" y2="300"/><line x1="60" y1="240" x2="360" y2="240"/><line x1="60" y1="180" x2="360" y2="180"/><line x1="60" y1="120" x2="360" y2="120"/><line x1="60" y1="60" x2="360" y2="60"/>
  </g>
  <line x1="60" y1="300" x2="378.0" y2="300" stroke="#1f2933" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="60" y2="42.0" stroke="#1f2933" stroke-width="1.5"/>
  <polygon points="60,300 240,240 300,120 120,180" fill="#3b5bdb" fill-opacity="0.15" stroke="#3b5bdb" stroke-width="2.5"/>
  <polygon points="60,300 120,300 120,240 60,240" fill="#9c6b30" fill-opacity="0.35" stroke="#9c6b30" stroke-width="2"/>
  <g font-size="14" fill="#1f2933">
    <text x="248" y="258">(3; 1)</text>
    <text x="68" y="174">(1; 2)</text>
    <text x="308" y="116">(4; 3)</text>
    <text x="46" y="318">0</text>
  </g>
  <text x="165.0" y="216.0" font-size="16" fill="#3b5bdb" font-weight="bold" text-anchor="middle">opp. 5</text>
  <g font-size="15" fill="#1f2933">
    <text x="410" y="70">eenheidsvierkant:</text>
    <text x="410" y="92" fill="#9c6b30">oppervlakte 1</text>
    <text x="410" y="132">beeld onder A:</text>
    <text x="410" y="154" fill="#3b5bdb">oppervlakte 5</text>
    <text x="410" y="200">det A = 3 · 2 − 1 · 1 = 5</text>
    <text x="410" y="230" font-size="13">de kolommen van A zijn</text>
    <text x="410" y="248" font-size="13">de beelden van (1; 0) en (0; 1)</text>
  </g>
</svg>