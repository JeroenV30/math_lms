  <line x1="210" y1="170" x2="210" y2="177" stroke="#1f2933" stroke-width="1.5"/><text x="210" y="194" font-size="13" fill="#1f2933" text-anchor="middle">10</text>
  <line x1="295" y1="170" x2="295" y2="177" stroke="#1f2933" stroke-width="1.5"/><text x="295" y="194" font-size="13" fill="#1f2933" text-anchor="middle">15</text>
  <line x1="380" y1="170" x2="380" y2="177" stroke="#1f2933" stroke-width="1.5"/><text x="380" y="194" font-size="13" fill="#1f2933" text-anchor="middle">20</text>
  <line x1="465" y1="170" x2="465" y2="177" stroke="#1f2933" stroke-width="1.5"/><text x="465" y="194" font-size="13" fill="#1f2933" text-anchor="middle">25</text>
  <line x1="550" y1="170" x2="550" y2="177" stroke="#1f2933" stroke-width="1.5"/><text x="550" y="194" font-size="13" fill="#1f2933" text-anchor="middle">30</text>
  <line x1="91" y1="110" x2="142" y2="110" stroke="#1f2933" stroke-width="2"/>
  <line x1="235.5" y1="110" x2="278" y2="110" stroke="#1f2933" stroke-width="2"/>
  <line x1="91" y1="98" x2="91" y2="122" stroke="#1f2933" stroke-width="2"/>
