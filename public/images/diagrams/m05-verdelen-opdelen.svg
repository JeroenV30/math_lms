<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" role="img" aria-label="Twee betekenissen van delen: eerlijk verdelen en opdelen">
<title>Twee betekenissen van delen: eerlijk verdelen en opdelen</title>
<rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
<text x="190" y="34" font-size="20" text-anchor="middle" fill="#1f2933" font-weight="bold">Eerlijk verdelen</text>
<text x="190" y="58" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="normal">12 broden over 3 personen: hoeveel per persoon?</text>
<text x="570" y="34" font-size="20" text-anchor="middle" fill="#1f2933" font-weight="bold">Opdelen</text>
<text x="570" y="58" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="normal">12 broden in manden van 3: hoeveel manden?</text>
<line x1="380" y1="20" x2="380" y2="290" stroke="#1f2933" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="90" width="90" height="130" rx="8" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.5"/>
