<rect x="576" y="90" width="76" height="130" rx="8" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.5"/>
<ellipse cx="614" cy="118" rx="16" ry="11" fill="#9c6b30" stroke="#1f2933" stroke-width="1"/>
