<ellipse cx="702" cy="118" rx="16" ry="11" fill="#9c6b30" stroke="#1f2933" stroke-width="1"/>
<ellipse cx="702" cy="156" rx="16" ry="11" fill="#9c6b30" stroke="#1f2933" stroke-width="1"/>
<ellipse cx="702" cy="194" rx="16" ry="11" fill="#9c6b30" stroke="#1f2933" stroke-width="1"/>
<text x="702" y="245" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="normal">mand 4</text>
<text x="570" y="275" font-size="16" text-anchor="middle" fill="#3b5bdb" font-weight="bold">12 : 3 = 4 manden</text>
