<ellipse cx="170" cy="170" rx="16" ry="11" fill="#9c6b30" stroke="#1f2933" stroke-width="1"/>
<ellipse cx="210" cy="170" rx="16" ry="11" fill="#9c6b30" stroke="#1f2933" stroke-width="1"/>
<text x="190" y="245" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="normal">persoon 2</text>
<rect x="250" y="90" width="90" height="130" rx="8" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.5"/>
<ellipse cx="275" cy="125" rx="16" ry="11" fill="#9c6b30" stroke="#1f2933" stroke-width="1"/>
