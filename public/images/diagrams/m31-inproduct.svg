<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 310" font-family="sans-serif" role="img" aria-label="Hoek tussen twee vectoren en projectie">
<title>Hoek tussen twee vectoren en projectie</title>
<defs>
