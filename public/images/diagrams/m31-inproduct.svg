<text x="150.0" y="306.0" font-size="13" fill="#3b5bdb" text-anchor="middle" font-style="italic">projectie: |b| · cos θ</text>
<text x="340.0" y="70.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">a · b = |a| · |b| · cos θ</text>
