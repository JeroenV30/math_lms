<text x="370.0" y="266.0" font-size="16" fill="#3b5bdb" text-anchor="middle" font-weight="bold" font-style="italic">a</text><line x1="364.0" y1="250.8" x2="373.0" y2="250.8" stroke="#3b5bdb" stroke-width="1.4"/><path d="M371.0,247.8 L376.0,250.8 L371.0,253.8 z" fill="#3b5bdb"/>
<text x="142.0" y="145.0" font-size="16" fill="#9c6b30" text-anchor="end" font-weight="bold" font-style="italic">b</text><line x1="130.0" y1="129.8" x2="139.0" y2="129.8" stroke="#9c6b30" stroke-width="1.4"/><path d="M137.0,126.8 L142.0,129.8 L137.0,132.8 z" fill="#9c6b30"/>
<line x1="50.0" y1="286.0" x2="250.0" y2="286.0" stroke="#3b5bdb" stroke-width="2"/>
<line x1="50.0" y1="280.0" x2="50.0" y2="292.0" stroke="#3b5bdb" stroke-width="2"/>
