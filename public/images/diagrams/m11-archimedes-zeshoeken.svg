<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="sans-serif" role="img" aria-label="Een cirkel met een ingeschreven regelmatige zeshoek en een omgeschreven regelmatige zeshoek; de omtrek van de cirkel ligt tussen die van de twee zeshoeken">
<title>Een cirkel met een ingeschreven regelmatige zeshoek en een omgeschreven regelmatige zeshoek; de omtrek van de cirkel ligt tussen die van de twee zeshoeken</title>
<rect x="0" y="0" width="700" height="340" fill="#ffffff"/>
<polygon points="328.6,180.0 259.3,60.0 120.7,60.0 51.4,180.0 120.7,300.0 259.3,300.0" fill="#f3e6d3" stroke="#9c6b30" stroke-width="2"/>
<circle cx="190" cy="180" r="120" fill="#ffffff" stroke="#1f2933" stroke-width="2.2"/>
<polygon points="190.0,60.0 86.1,120.0 86.1,240.0 190.0,300.0 293.9,240.0 293.9,120.0" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="2"/>
<line x1="190.0" y1="180.0" x2="190.0" y2="60.0" stroke="#1f2933" stroke-width="1.5"/>
<text x="200.0" y="120.0" font-size="16" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="italic">r</text>
<circle cx="190.0" cy="180.0" r="3" fill="#1f2933"/>
<text x="400.0" y="80.0" font-size="15" fill="#3b5bdb" text-anchor="start" font-weight="bold" font-style="normal">ingeschreven zeshoek:</text>
<text x="400.0" y="102.0" font-size="15" fill="#3b5bdb" text-anchor="start" font-weight="normal" font-style="normal">omtrek 6r = 3d</text>
<text x="400.0" y="145.0" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold" font-style="normal">cirkel: omtrek πd</text>
<text x="400.0" y="188.0" font-size="15" fill="#9c6b30" text-anchor="start" font-weight="bold" font-style="normal">omgeschreven zeshoek:</text>
<text x="400.0" y="210.0" font-size="15" fill="#9c6b30" text-anchor="start" font-weight="normal" font-style="normal">omtrek ≈ 6,93r ≈ 3,46d</text>
<text x="400.0" y="260.0" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold" font-style="normal">dus 3 &lt; π &lt; 3,47</text>
<text x="400.0" y="285.0" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">met 96-hoeken: 3 10/71 &lt; π &lt; 3 1/7</text>

</svg>
