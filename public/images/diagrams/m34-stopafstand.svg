<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="230" fill="#ffffff"/>
  <text x="20" y="28" font-size="14" fill="#1f2933" font-weight="bold">Stopafstand bij 72 km/h (20 m/s), reactietijd 1 s, remvertraging 8 m/s²</text>
  <!-- schaal: 1 m = 12 px, start x=40 -->
  <line x1="40" y1="150" x2="600" y2="150" stroke="#1f2933" stroke-width="1.5"/>
  <rect x="40" y="95" width="240" height="40" fill="#f1f3f5" stroke="#1f2933"/>
  <text x="160" y="113" font-size="13" text-anchor="middle" fill="#1f2933">reactieafstand</text>
  <text x="160" y="129" font-size="12" text-anchor="middle" fill="#1f2933">v · t_r = 20 m</text>
  <rect x="280" y="95" width="300" height="40" fill="#dbe4ff" stroke="#3b5bdb"/>
  <text x="430" y="113" font-size="13" text-anchor="middle" fill="#1f2933">remafstand</text>
  <text x="430" y="129" font-size="12" text-anchor="middle" fill="#1f2933">v² / (2a) = 25 m</text>
  <g stroke="#1f2933" stroke-width="1">
    <line x1="40" y1="145" x2="40" y2="160"/>
    <line x1="280" y1="145" x2="280" y2="160"/>
    <line x1="580" y1="145" x2="580" y2="160"/>
  </g>
  <g font-size="12" fill="#1f2933" text-anchor="middle">
    <text x="40" y="176">0 m</text>
    <text x="280" y="176">20 m</text>
    <text x="580" y="176">45 m</text>
  </g>
  <text x="40" y="80" font-size="12" fill="#9c6b30">gevaar gezien</text>
  <text x="280" y="80" font-size="12" fill="#9c6b30" text-anchor="middle">rempedaal in</text>
  <text x="580" y="80" font-size="12" fill="#9c6b30" text-anchor="end">stilstand</text>
  <text x="20" y="210" font-size="12" fill="#616e7c">De reactieafstand groeit lineair met v, de remafstand kwadratisch: bij 2v wordt de remafstand 4 keer zo groot.</text>
</svg>
