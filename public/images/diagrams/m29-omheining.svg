<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-label="Rechthoekige weide langs een muur met 60 meter hek">
<title>Rechthoekige weide langs een muur met 60 meter hek</title>
<rect x="0" y="0" width="520" height="240" fill="#ffffff"/>
<rect x="60" y="30" width="400" height="16" fill="#9c6b30" opacity="0.85"/>
<text x="260.0" y="24.0" font-family="sans-serif" font-size="13" fill="#9c6b30" text-anchor="middle" >muur (geen hek nodig)</text>
<rect x="120" y="46" width="280" height="150" fill="#f1f3f5" stroke="none"/>
<polyline points="120,46 120,196 400,196 400,46" fill="none" stroke="#3b5bdb" stroke-width="3"/>
<text x="108.0" y="125.0" font-family="sans-serif" font-size="16" fill="#3b5bdb" text-anchor="end" font-style="italic">x</text>
<text x="412.0" y="125.0" font-family="sans-serif" font-size="16" fill="#3b5bdb" text-anchor="start" font-style="italic">x</text>
<text x="260.0" y="220.0" font-family="sans-serif" font-size="16" fill="#3b5bdb" text-anchor="middle" font-style="italic">60 − 2x</text>
<text x="260.0" y="128.0" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" >oppervlakte A = x(60 − 2x)</text>
</svg>
