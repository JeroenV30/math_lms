<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" role="img" aria-label="Een open doos vouwen uit een vierkant stuk karton van 30 bij 30 centimeter">
<title>Een open doos vouwen uit een vierkant stuk karton van 30 bij 30 centimeter</title>
<rect x="0" y="0" width="540" height="270" fill="#ffffff"/>
<rect x="30" y="30" width="200" height="200" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.6"/>
<rect x="30" y="30" width="40" height="40" fill="#ffffff" stroke="#9c6b30" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="190" y="30" width="40" height="40" fill="#ffffff" stroke="#9c6b30" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="30" y="190" width="40" height="40" fill="#ffffff" stroke="#9c6b30" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="190" y="190" width="40" height="40" fill="#ffffff" stroke="#9c6b30" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="70" y="70" width="120" height="120" fill="none" stroke="#3b5bdb" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="50.0" y="55.0" font-family="sans-serif" font-size="14" fill="#9c6b30" text-anchor="middle" font-style="italic">x</text>
<text x="130.0" y="252.0" font-family="sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" >30 cm</text>
<text x="130.0" y="135.0" font-family="sans-serif" font-size="14" fill="#3b5bdb" text-anchor="middle" font-style="italic">30 − 2x</text>
<path d="M 255 130 L 300 130" stroke="#1f2933" stroke-width="1.6"/><path d="M 300 130 l -8 -5 m 8 5 l -8 5" stroke="#1f2933" stroke-width="1.6" fill="none"/>
<text x="278.0" y="118.0" font-family="sans-serif" font-size="12" fill="#616e7c" text-anchor="middle" >vouwen</text>
<polygon points="330,120 380,90.0 520,90.0 470,120" fill="#ffffff" stroke="#1f2933" stroke-width="1.2"/>
<polygon points="330,120 470,120 470,175 330,175" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.6"/>
<polygon points="470,120 520,90.0 520,145.0 470,175" fill="#e3e7ec" stroke="#1f2933" stroke-width="1.6"/>
<text x="322.0" y="152.5" font-family="sans-serif" font-size="14" fill="#9c6b30" text-anchor="end" font-style="italic">x</text>
<text x="400.0" y="195.0" font-family="sans-serif" font-size="14" fill="#3b5bdb" text-anchor="middle" font-style="italic">30 − 2x</text>
<text x="440.0" y="228.0" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" >V = x(30 − 2x)²</text>
</svg>
