<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Het getal 1.528 op een rekenbord met lijnen</title>
  <rect x="0" y="0" width="560" height="330" fill="#ffffff"/>
  <rect x="150" y="30" width="250" height="280" rx="6" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.5"/>
  <!-- lijnen -->
  <g stroke="#1f2933" stroke-width="2">
    <line x1="150" y1="70" x2="400" y2="70"/>
    <line x1="150" y1="140" x2="400" y2="140"/>
    <line x1="150" y1="210" x2="400" y2="210"/>
    <line x1="150" y1="280" x2="400" y2="280"/>
  </g>
  <!-- kruis op de duizendlijn -->
  <g stroke="#1f2933" stroke-width="2">
    <line x1="162" y1="62" x2="178" y2="78"/>
    <line x1="178" y1="62" x2="162" y2="78"/>
  </g>
  <!-- labels links -->
  <g font-size="15" fill="#1f2933" text-anchor="end">
    <text x="138" y="75">1000 (M)</text>
    <text x="138" y="145">100 (C)</text>
    <text x="138" y="215">10 (X)</text>
    <text x="138" y="285">1 (I)</text>
  </g>
  <g font-size="13" fill="#9c6b30" text-anchor="end" font-style="italic">
    <text x="138" y="110">500 (D)</text>
    <text x="138" y="180">50 (L)</text>
    <text x="138" y="250">5 (V)</text>
  </g>
  <!-- fiches -->
  <g fill="#9c6b30" stroke="#1f2933" stroke-width="1">
    <circle cx="230" cy="70" r="12"/>
    <circle cx="230" cy="105" r="12"/>
    <circle cx="230" cy="210" r="12"/>
    <circle cx="262" cy="210" r="12"/>
    <circle cx="230" cy="245" r="12"/>
    <circle cx="230" cy="280" r="12"/>
    <circle cx="262" cy="280" r="12"/>
    <circle cx="294" cy="280" r="12"/>
  </g>
  <!-- waarden rechts -->
  <g font-size="15" fill="#3b5bdb">
    <text x="415" y="75">1.000</text>
    <text x="415" y="110">500</text>
    <text x="415" y="145">0</text>
    <text x="415" y="180">0</text>
    <text x="415" y="215">20</text>
    <text x="415" y="250">5</text>
    <text x="415" y="285">3</text>
  </g>
  <line x1="410" y1="296" x2="500" y2="296" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="415" y="320" font-size="16" font-weight="bold" fill="#3b5bdb">= 1.528</text>
</svg>
