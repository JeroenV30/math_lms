  <text x="250" y="316" font-size="11" text-anchor="middle" fill="#1f2933" >4</text>
  <text x="290" y="316" font-size="11" text-anchor="middle" fill="#1f2933" >5</text>
  <text x="330" y="316" font-size="11" text-anchor="middle" fill="#1f2933" >6</text>
  <text x="84" y="334" font-size="11" text-anchor="end" fill="#1f2933" >−1</text>
  <text x="84" y="274" font-size="11" text-anchor="end" fill="#1f2933" >1</text>
