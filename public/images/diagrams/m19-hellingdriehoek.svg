<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="sans-serif">
  <title>Hellingdriehoek bij y = 2x + 1 tussen (1; 3) en (3; 7)</title>
  <rect width="640" height="340" fill="#ffffff"/>
  <defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
  <line x1="10" y1="330" x2="10" y2="30" stroke="#ced4da" stroke-width="1" />
