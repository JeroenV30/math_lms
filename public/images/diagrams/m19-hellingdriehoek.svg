  <line x1="90" y1="338" x2="90" y2="20" stroke="#1f2933" stroke-width="2" marker-end="url(#p)"/>
  <text x="352" y="305" font-size="15" text-anchor="middle" fill="#1f2933" font-style="italic">x</text>
  <text x="102" y="22" font-size="15" text-anchor="middle" fill="#1f2933" font-style="italic">y</text>
  <text x="10" y="316" font-size="11" text-anchor="middle" fill="#1f2933" >−2</text>
  <text x="50" y="316" font-size="11" text-anchor="middle" fill="#1f2933" >−1</text>
  <text x="130" y="316" font-size="11" text-anchor="middle" fill="#1f2933" >1</text>
  <text x="170" y="316" font-size="11" text-anchor="middle" fill="#1f2933" >2</text>
