  <text x="84" y="64" font-size="11" text-anchor="end" fill="#1f2933" >8</text>
  <text x="84" y="34" font-size="11" text-anchor="end" fill="#1f2933" >9</text>
  <line x1="50" y1="330" x2="250" y2="30" stroke="#3b5bdb" stroke-width="3" />
  <line x1="130" y1="210" x2="210" y2="210" stroke="#9c6b30" stroke-width="3" />
  <line x1="210" y1="210" x2="210" y2="90" stroke="#9c6b30" stroke-width="3" />
  <circle cx="130" cy="210" r="5" fill="#3b5bdb"/><circle cx="210" cy="90" r="5" fill="#3b5bdb"/>
  <text x="170.0" y="230" font-size="14" text-anchor="middle" fill="#9c6b30" >Δx = 2</text>
  <text x="220" y="155.0" font-size="14" text-anchor="start" fill="#9c6b30" >Δy = 4</text>
  <text x="122" y="202" font-size="13" text-anchor="end" fill="#1f2933" >(1; 3)</text>
  <text x="218" y="82" font-size="13" text-anchor="start" fill="#1f2933" >(3; 7)</text>
  <text x="430" y="150" font-size="14" text-anchor="start" fill="#3b5bdb" >helling a = Δy/Δx = 4/2 = 2</text>
  <text x="430" y="172" font-size="13" text-anchor="start" fill="#1f2933" >Per stap van 1 naar rechts</text>
  <text x="430" y="190" font-size="13" text-anchor="start" fill="#1f2933" >gaat de lijn 2 omhoog.</text>

</svg>
