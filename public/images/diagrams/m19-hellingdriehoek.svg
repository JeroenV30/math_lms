  <line x1="10" y1="240" x2="330" y2="240" stroke="#ced4da" stroke-width="1" />
  <line x1="10" y1="210" x2="330" y2="210" stroke="#ced4da" stroke-width="1" />
  <line x1="10" y1="180" x2="330" y2="180" stroke="#ced4da" stroke-width="1" />
  <line x1="10" y1="150" x2="330" y2="150" stroke="#ced4da" stroke-width="1" />
  <line x1="10" y1="120" x2="330" y2="120" stroke="#ced4da" stroke-width="1" />
