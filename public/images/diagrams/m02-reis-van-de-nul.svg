<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" role="img" aria-labelledby="t3 d3">
  <title id="t3">De reis van de nul</title>
  <desc id="d3">Tijdlijn (niet op schaal): ca. 1800 v.Chr. Babylonisch plaatswaardesysteem; ca. 300 v.Chr. Babylonisch plaatshouder-teken; 628 Brahmagupta; ca. 825 al-Khwarizmi in Bagdad; 876 inscriptie van Gwalior; 1202 Fibonacci's Liber Abaci. Het Bakhshali-manuscript, met een stip als nul, wordt gedateerd tussen ca. 800 en 1100.</desc>
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1f2933">De reis van de nul (niet op schaal)</text>
  <line x1="40" y1="130" x2="730" y2="130" stroke="#1f2933" stroke-width="2"/>
  <polygon points="730,124 742,130 730,136" fill="#1f2933"/>
  <circle cx="80" cy="130" r="8" fill="#9c6b30"/>
  <text x="80" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#9c6b30">ca. 1800 v.Chr.</text>
  <text x="80" y="76" text-anchor="middle" font-size="12" fill="#1f2933" font-style="italic">Babylonië</text>
  <text x="80" y="94" text-anchor="middle" font-size="12" fill="#1f2933">zestigtallig plaatswaarde-</text>
  <text x="80" y="109" text-anchor="middle" font-size="12" fill="#1f2933">systeem, nog zonder nul</text>
  <circle cx="198" cy="130" r="8" fill="#9c6b30"/>
  <text x="198" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#9c6b30">ca. 300 v.Chr.</text>
  <text x="198" y="178" text-anchor="middle" font-size="12" fill="#1f2933" font-style="italic">Babylonië</text>
  <text x="198" y="196" text-anchor="middle" font-size="12" fill="#1f2933">plaatshouder-teken:</text>
  <text x="198" y="211" text-anchor="middle" font-size="12" fill="#1f2933">twee schuine wiggen</text>
  <circle cx="316" cy="130" r="8" fill="#3b5bdb"/>
  <text x="316" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b5bdb">628</text>
  <text x="316" y="76" text-anchor="middle" font-size="12" fill="#1f2933" font-style="italic">India</text>
  <text x="316" y="94" text-anchor="middle" font-size="12" fill="#1f2933">Brahmagupta: rekenregels</text>
  <text x="316" y="109" text-anchor="middle" font-size="12" fill="#1f2933">voor nul als getal</text>
  <circle cx="434" cy="130" r="8" fill="#3b5bdb"/>
  <text x="434" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b5bdb">ca. 825</text>
  <text x="434" y="178" text-anchor="middle" font-size="12" fill="#1f2933" font-style="italic">Bagdad</text>
  <text x="434" y="196" text-anchor="middle" font-size="12" fill="#1f2933">al-Khwarizmi schrijft over</text>
  <text x="434" y="211" text-anchor="middle" font-size="12" fill="#1f2933">de Indiase cijfers</text>
  <circle cx="552" cy="130" r="8" fill="#3b5bdb"/>
  <text x="552" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b5bdb">876</text>
  <text x="552" y="76" text-anchor="middle" font-size="12" fill="#1f2933" font-style="italic">Gwalior, India</text>
  <text x="552" y="94" text-anchor="middle" font-size="12" fill="#1f2933">in steen gehakte</text>
  <text x="552" y="109" text-anchor="middle" font-size="12" fill="#1f2933">0 in 270 en 50</text>
  <circle cx="670" cy="130" r="8" fill="#3b5bdb"/>
  <text x="670" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b5bdb">1202</text>
  <text x="670" y="178" text-anchor="middle" font-size="12" fill="#1f2933" font-style="italic">Pisa</text>
  <text x="670" y="196" text-anchor="middle" font-size="12" fill="#1f2933">Fibonacci: Liber Abaci</text>
  <text x="670" y="211" text-anchor="middle" font-size="12" fill="#1f2933">brengt de cijfers naar Europa</text>
  <rect x="394" y="236" width="228" height="12" rx="6" fill="#f1f3f5" stroke="#9c6b30"/>
  <text x="508" y="268" text-anchor="middle" font-size="12" fill="#1f2933">Bakhshali-manuscript (stip als nul): waarschijnlijk 799–1102</text>
  <text x="20" y="292" font-size="11" fill="#1f2933">bruin = Mesopotamië · blauw = de Indiase cijfers en hun verspreiding</text>
  </svg>
