<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-label="Een vierkant dat twee keer zo lang en twee keer zo hoog getekend wordt, heeft vier keer zo veel oppervlakte">
<title>Een vierkant dat twee keer zo lang en twee keer zo hoog getekend wordt, heeft vier keer zo veel oppervlakte</title>
<rect x="0" y="0" width="560" height="280" fill="#ffffff"/>
<text x="280.0" y="26" font-family="sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Verdubbeld? Twee keer zo lang én twee keer zo hoog</text>
<rect x="70" y="160" width="70" height="70" fill="#c5cfe8" stroke="#1f2933" stroke-width="1.5"/>
<text x="105" y="252" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">2020: 1 miljoen</text>
<rect x="250" y="90" width="140" height="140" fill="#3b5bdb" stroke="#1f2933" stroke-width="1.5"/>
<line x1="320" y1="90" x2="320" y2="230" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="250" y1="160" x2="390" y2="160" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="320" y="252" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">2025: 2 miljoen</text>
<text x="470" y="140" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">lengte × 2</text>
<text x="470" y="162" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">hoogte × 2</text>
<text x="470" y="192" font-family="sans-serif" font-size="15" fill="#9c6b30" text-anchor="middle" font-weight="bold">oppervlakte × 4</text>
</svg>
