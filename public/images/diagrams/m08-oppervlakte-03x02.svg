<text x="470" y="180" font-size="17" text-anchor="start" fill="#1f2933" font-weight="normal">= 6 hokjes van de 100</text>
<text x="470" y="210" font-size="17" text-anchor="start" fill="#1f2933" font-weight="normal">= 6 honderdsten</text>
<text x="470" y="240" font-size="22" text-anchor="start" fill="#3b5bdb" font-weight="bold">0,3 × 0,2 = 0,06</text>
<text x="470" y="270" font-size="17" text-anchor="start" fill="#9c6b30" font-weight="normal">niet 0,6: dat zouden</text>
<text x="470" y="300" font-size="17" text-anchor="start" fill="#9c6b30" font-weight="normal">60 hokjes zijn.</text>
