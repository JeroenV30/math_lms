<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-labelledby="title desc">
  <title id="title">Een rechte hoek met 3-4-5</title>
  <desc id="desc">Een koord met knopen op gelijke afstand is gespannen tot een driehoek met zijden van 3, 4 en 5 stukken. De hoek tussen de zijden 3 en 4 is recht.</desc>
  <rect width="660" height="340" fill="#fff"/>
  <g font-family="sans-serif" fill="#1f2933" font-size="16">
    <polygon points="80.0,300.0 280.0,300.0 80.0,150.0" fill="#f1f3f5" stroke="#9c6b30" stroke-width="3" stroke-linejoin="round"/>
    <path d="M96.0,300.0 L96.0,284.0 L80.0,284.0" fill="none" stroke="#1f2933" stroke-width="1.5"/>
    <circle cx="80.0" cy="300.0" r="6" fill="#9c6b30"/>
    <circle cx="130.0" cy="300.0" r="6" fill="#9c6b30"/>
    <circle cx="180.0" cy="300.0" r="6" fill="#9c6b30"/>
    <circle cx="230.0" cy="300.0" r="6" fill="#9c6b30"/>
    <circle cx="280.0" cy="300.0" r="6" fill="#9c6b30"/>
    <circle cx="240.0" cy="270.0" r="6" fill="#9c6b30"/>
    <circle cx="200.0" cy="240.0" r="6" fill="#9c6b30"/>
    <circle cx="160.0" cy="210.0" r="6" fill="#9c6b30"/>
    <circle cx="120.0" cy="180.0" r="6" fill="#9c6b30"/>
    <circle cx="80.0" cy="150.0" r="6" fill="#9c6b30"/>
    <circle cx="80.0" cy="200.0" r="6" fill="#9c6b30"/>
    <circle cx="80.0" cy="250.0" r="6" fill="#9c6b30"/>
    <text x="180.0" y="326.0" text-anchor="middle" font-size="15">4 stukken</text>
    <text x="66.0" y="230.0" text-anchor="end" font-size="15">3</text>
    <text x="195.0" y="205.0" text-anchor="start" font-size="15">5 stukken</text>
    <text x="380.0" y="70.0" text-anchor="start" font-size="17" font-weight="bold">Een rechte hoek uitzetten</text>
    <text x="380.0" y="102.0" text-anchor="start" font-size="14">Een gesloten koord met 12 knopen op</text>
    <text x="380.0" y="122.0" text-anchor="start" font-size="14">gelijke afstand: 12 gelijke stukken.</text>
    <text x="380.0" y="154.0" text-anchor="start" font-size="14">Span het als 3 + 4 + 5:</text>
    <text x="380.0" y="176.0" text-anchor="start" font-size="14">3² + 4² = 5², dus de hoek tussen</text>
    <text x="380.0" y="196.0" text-anchor="start" font-size="14">de stukken 3 en 4 is recht.</text>
    <text x="380.0" y="236.0" text-anchor="start" font-size="14">Bouwpraktijk: 0,6 m, 0,8 m en 1,0 m</text>
    <text x="380.0" y="256.0" text-anchor="start" font-size="14">of 3 m, 4 m en 5 m met een meetlint.</text>
  </g>
</svg>
