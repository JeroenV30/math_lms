<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="De mediaan van 5 gesorteerde getallen is het middelste; bij 6 getallen het gemiddelde van de twee middelste">
<title>De mediaan van 5 gesorteerde getallen is het middelste; bij 6 getallen het gemiddelde van de twee middelste</title>
<rect x="0" y="0" width="600" height="250" fill="#ffffff"/>
<text x="20" y="28" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Oneven aantal: sorteer en neem het middelste getal</text>
<rect x="40" y="44" width="48" height="40" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.2" rx="6"/>
<text x="64" y="70" font-family="sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">5</text>
<rect x="100" y="44" width="48" height="40" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.2" rx="6"/>
<text x="124" y="70" font-family="sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">7</text>
<rect x="160" y="44" width="48" height="40" fill="#3b5bdb" stroke="#1f2933" stroke-width="1.2" rx="6"/>
<text x="184" y="70" font-family="sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">9</text>
<rect x="220" y="44" width="48" height="40" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.2" rx="6"/>
<text x="244" y="70" font-family="sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">12</text>
<rect x="280" y="44" width="48" height="40" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.2" rx="6"/>
<text x="304" y="70" font-family="sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">15</text>
<text x="370" y="70" font-family="sans-serif" font-size="16" fill="#3b5bdb" text-anchor="start" font-weight="bold">mediaan = 9</text>
<text x="20" y="138" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Even aantal: neem het gemiddelde van de twee middelste</text>
<rect x="40" y="154" width="48" height="40" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.2" rx="6"/>
<text x="64" y="180" font-family="sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">3</text>
<rect x="100" y="154" width="48" height="40" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.2" rx="6"/>
<text x="124" y="180" font-family="sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">6</text>
<rect x="160" y="154" width="48" height="40" fill="#3b5bdb" stroke="#1f2933" stroke-width="1.2" rx="6"/>
<text x="184" y="180" font-family="sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text>
<rect x="220" y="154" width="48" height="40" fill="#3b5bdb" stroke="#1f2933" stroke-width="1.2" rx="6"/>
<text x="244" y="180" font-family="sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">9</text>
<rect x="280" y="154" width="48" height="40" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.2" rx="6"/>
<text x="304" y="180" font-family="sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">12</text>
<rect x="340" y="154" width="48" height="40" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.2" rx="6"/>
<text x="364" y="180" font-family="sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">14</text>
<text x="430" y="180" font-family="sans-serif" font-size="15" fill="#3b5bdb" text-anchor="start" font-weight="bold">mediaan = (8 + 9) : 2 = 8,5</text>
<line x1="40" y1="206" x2="148" y2="206" stroke="#1f2933" stroke-width="1"/>
<line x1="282" y1="206" x2="390" y2="206" stroke="#1f2933" stroke-width="1"/>
<text x="94" y="224" font-family="sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">2 kleiner</text>
<text x="336" y="224" font-family="sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">2 groter</text>
</svg>
