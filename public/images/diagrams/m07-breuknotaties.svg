<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" role="img" aria-label="Vier manieren om een breuk te schrijven: Egyptisch mondteken, Indiase notatie zonder streep, de breukstreep en de schuine streep">
<title>Vier manieren om een breuk te schrijven: Egyptisch mondteken, Indiase notatie zonder streep, de breukstreep en de schuine streep</title>
<rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
<text x="380.0" y="30.0" font-size="18" text-anchor="middle" fill="#1f2933" font-weight="bold">Hoe schreef men een breuk?</text>
<rect x="10" y="50" width="170" height="150" rx="8" fill="#f1f3f5" stroke="#cbd2d9" stroke-width="1"/>
<rect x="200" y="50" width="170" height="150" rx="8" fill="#f1f3f5" stroke="#cbd2d9" stroke-width="1"/>
<rect x="390" y="50" width="170" height="150" rx="8" fill="#f1f3f5" stroke="#cbd2d9" stroke-width="1"/>
<rect x="580" y="50" width="170" height="150" rx="8" fill="#f1f3f5" stroke="#cbd2d9" stroke-width="1"/>
<ellipse cx="95" cy="95" rx="34" ry="11" fill="#9c6b30"/>
<ellipse cx="95" cy="95" rx="22" ry="4" fill="#f1f3f5"/>
<line x1="77" y1="122" x2="77" y2="170" stroke="#9c6b30" stroke-width="6" stroke-linecap="round"/>
<line x1="95" y1="122" x2="95" y2="170" stroke="#9c6b30" stroke-width="6" stroke-linecap="round"/>
<line x1="113" y1="122" x2="113" y2="170" stroke="#9c6b30" stroke-width="6" stroke-linecap="round"/>
<text x="285.0" y="118.0" font-size="40" text-anchor="middle" fill="#9c6b30" font-weight="normal">3</text>
<text x="285.0" y="172.0" font-size="40" text-anchor="middle" fill="#9c6b30" font-weight="normal">4</text>
<text x="475.0" y="115.0" font-size="40" text-anchor="middle" fill="#9c6b30" font-weight="normal">3</text>
<line x1="449" y1="130" x2="501" y2="130" stroke="#9c6b30" stroke-width="3"/>
<text x="475.0" y="175.0" font-size="40" text-anchor="middle" fill="#9c6b30" font-weight="normal">4</text>
<text x="665.0" y="145.0" font-size="44" text-anchor="middle" fill="#1f2933" font-weight="normal">3/4</text>
<text x="95.0" y="226.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">Egypte</text>
<text x="95.0" y="248.0" font-size="13" text-anchor="middle" fill="#52606d" font-weight="normal">1/3: mondteken</text>
<text x="95.0" y="266.0" font-size="13" text-anchor="middle" fill="#52606d" font-weight="normal">boven drie strepen</text>
<text x="285.0" y="226.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">India</text>
<text x="285.0" y="248.0" font-size="13" text-anchor="middle" fill="#52606d" font-weight="normal">3 boven 4,</text>
<text x="285.0" y="266.0" font-size="13" text-anchor="middle" fill="#52606d" font-weight="normal">zonder streep (Brahmagupta)</text>
<text x="475.0" y="226.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">Maghreb, Fibonacci</text>
<text x="475.0" y="248.0" font-size="13" text-anchor="middle" fill="#52606d" font-weight="normal">breukstreep</text>
<text x="475.0" y="266.0" font-size="13" text-anchor="middle" fill="#52606d" font-weight="normal">(12e–13e eeuw)</text>
<text x="665.0" y="226.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">Later</text>
<text x="665.0" y="248.0" font-size="13" text-anchor="middle" fill="#52606d" font-weight="normal">schuine streep</text>
<text x="665.0" y="266.0" font-size="13" text-anchor="middle" fill="#52606d" font-weight="normal">(vanaf 18e eeuw)</text>
<text x="380.0" y="292.0" font-size="12" text-anchor="middle" fill="#52606d" font-weight="normal">Schematische weergave, geen kopie van een bron.</text>
</svg>
