<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="sans-serif" role="img" aria-label="Stevins notatie met omcirkelde rangtekens voor 27,847, met de betekenis van elk teken">
<title>Stevins notatie met omcirkelde rangtekens voor 27,847, met de betekenis van elk teken</title>
<rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
<text x="116.0" y="109" font-size="40" text-anchor="middle" fill="#1f2933" font-weight="normal">27</text>
<circle cx="164" cy="77" r="15" fill="#ffffff" stroke="#9c6b30" stroke-width="2"/>
<text x="164" y="83" font-size="17" text-anchor="middle" fill="#9c6b30" font-weight="bold">0</text>
<text x="207.0" y="109" font-size="40" text-anchor="middle" fill="#1f2933" font-weight="normal">8</text>
<circle cx="242" cy="77" r="15" fill="#ffffff" stroke="#9c6b30" stroke-width="2"/>
<text x="242" y="83" font-size="17" text-anchor="middle" fill="#9c6b30" font-weight="bold">1</text>
<text x="285.0" y="109" font-size="40" text-anchor="middle" fill="#1f2933" font-weight="normal">4</text>
<circle cx="320" cy="77" r="15" fill="#ffffff" stroke="#9c6b30" stroke-width="2"/>
<text x="320" y="83" font-size="17" text-anchor="middle" fill="#9c6b30" font-weight="bold">2</text>
<text x="363.0" y="109" font-size="40" text-anchor="middle" fill="#1f2933" font-weight="normal">7</text>
<circle cx="398" cy="77" r="15" fill="#ffffff" stroke="#9c6b30" stroke-width="2"/>
<text x="398" y="83" font-size="17" text-anchor="middle" fill="#9c6b30" font-weight="bold">3</text>
<text x="60" y="40" font-size="16" text-anchor="start" fill="#9c6b30" font-weight="bold">Stevin (1585):</text>
<text x="560" y="40" font-size="16" text-anchor="start" fill="#3b5bdb" font-weight="bold">Wij nu:</text>
<text x="640" y="109" font-size="40" text-anchor="middle" fill="#3b5bdb" font-weight="normal">27,847</text>
<text x="90" y="170" font-size="15" text-anchor="start" fill="#9c6b30" font-weight="normal">⓪ = gehelen (begin)</text>
<text x="440" y="170" font-size="17" text-anchor="start" fill="#1f2933" font-weight="normal">27</text>
<text x="90" y="204" font-size="15" text-anchor="start" fill="#9c6b30" font-weight="normal">① = tienden (eerste)</text>
<text x="440" y="204" font-size="17" text-anchor="start" fill="#1f2933" font-weight="normal">8/10</text>
<text x="90" y="238" font-size="15" text-anchor="start" fill="#9c6b30" font-weight="normal">② = honderdsten (tweede)</text>
<text x="440" y="238" font-size="17" text-anchor="start" fill="#1f2933" font-weight="normal">4/100</text>
<text x="90" y="272" font-size="15" text-anchor="start" fill="#9c6b30" font-weight="normal">③ = duizendsten (derde)</text>
<text x="440" y="272" font-size="17" text-anchor="start" fill="#1f2933" font-weight="normal">7/1000</text>
<text x="380" y="330" font-size="17" text-anchor="middle" fill="#1f2933" font-weight="normal">27⓪ 8① 4② 7③  =  27 + 8/10 + 4/100 + 7/1000  =  27,847</text>
</svg>
