<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" role="img" aria-label="Stroken voor 3/4, 2/3 en 5/7: de foute som 5/7 is kleiner dan 3/4">
<title>Stroken voor 3/4, 2/3 en 5/7: de foute som 5/7 is kleiner dan 3/4</title>
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<text x="380.0" y="30.0" font-size="18" text-anchor="middle" fill="#1f2933" font-weight="bold">Is 3/4 + 2/3 gelijk aan 5/7?</text>
<rect x="150.0" y="60" width="140.0" height="40" fill="#dbe4ff" stroke="#1f2933" stroke-width="1.5"/>
<rect x="290.0" y="60" width="140.0" height="40" fill="#dbe4ff" stroke="#1f2933" stroke-width="1.5"/>
<rect x="430.0" y="60" width="140.0" height="40" fill="#dbe4ff" stroke="#1f2933" stroke-width="1.5"/>
<rect x="570.0" y="60" width="140.0" height="40" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.5"/>
<text x="115.0" y="75.0" font-size="17" text-anchor="middle" fill="#1f2933" font-weight="normal">3</text>
<line x1="105.7" y1="80.1" x2="124.3" y2="80.1" stroke="#1f2933" stroke-width="1.4"/>
<text x="115.0" y="93.7" font-size="17" text-anchor="middle" fill="#1f2933" font-weight="normal">4</text>
<rect x="150.0" y="130" width="186.7" height="40" fill="#dbe4ff" stroke="#1f2933" stroke-width="1.5"/>
<rect x="336.7" y="130" width="186.7" height="40" fill="#dbe4ff" stroke="#1f2933" stroke-width="1.5"/>
<rect x="523.3" y="130" width="186.7" height="40" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.5"/>
<text x="115.0" y="145.0" font-size="17" text-anchor="middle" fill="#1f2933" font-weight="normal">2</text>
<line x1="105.7" y1="150.1" x2="124.3" y2="150.1" stroke="#1f2933" stroke-width="1.4"/>
<text x="115.0" y="163.7" font-size="17" text-anchor="middle" fill="#1f2933" font-weight="normal">3</text>
<rect x="150.0" y="200" width="80.0" height="40" fill="#ead9c3" stroke="#1f2933" stroke-width="1.5"/>
<rect x="230.0" y="200" width="80.0" height="40" fill="#ead9c3" stroke="#1f2933" stroke-width="1.5"/>
<rect x="310.0" y="200" width="80.0" height="40" fill="#ead9c3" stroke="#1f2933" stroke-width="1.5"/>
<rect x="390.0" y="200" width="80.0" height="40" fill="#ead9c3" stroke="#1f2933" stroke-width="1.5"/>
<rect x="470.0" y="200" width="80.0" height="40" fill="#ead9c3" stroke="#1f2933" stroke-width="1.5"/>
<rect x="550.0" y="200" width="80.0" height="40" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.5"/>
<rect x="630.0" y="200" width="80.0" height="40" fill="#f1f3f5" stroke="#1f2933" stroke-width="1.5"/>
<text x="115.0" y="215.0" font-size="17" text-anchor="middle" fill="#1f2933" font-weight="normal">5</text>
<line x1="105.7" y1="220.1" x2="124.3" y2="220.1" stroke="#1f2933" stroke-width="1.4"/>
<text x="115.0" y="233.7" font-size="17" text-anchor="middle" fill="#1f2933" font-weight="normal">7</text>
<text x="100.0" y="87.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="normal"></text>
<line x1="570.0" y1="50" x2="570.0" y2="252" stroke="#3b5bdb" stroke-width="2" stroke-dasharray="6 5"/>
<text x="570.0" y="262.0" font-size="14" text-anchor="middle" fill="#3b5bdb" font-weight="bold">3/4</text>
<line x1="550.0" y1="240" x2="550.0" y2="252" stroke="#9c6b30" stroke-width="2"/>
<text x="520.0" y="262.0" font-size="14" text-anchor="middle" fill="#9c6b30" font-weight="bold">5/7</text>
<text x="380.0" y="292.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="normal">5/7 is kleiner dan 3/4, terwijl je iets positiefs bij 3/4 hebt opgeteld.</text>
<text x="380.0" y="316.0" font-size="15" text-anchor="middle" fill="#3b5bdb" font-weight="bold">De echte som is 9/12 + 8/12 = 17/12: meer dan één geheel.</text>
</svg>
