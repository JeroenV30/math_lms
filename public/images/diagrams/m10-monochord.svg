<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif" font-size="13">
  <rect width="640" height="250" fill="#ffffff"/>
  <!-- snaar 60 cm = 480 px (8 px per cm), van x=80 tot x=560 -->
  <rect x="60" y="70" width="520" height="40" rx="6" fill="#e9d8c3" stroke="#9c6b30" stroke-width="2"/>
  <line x1="80" y1="70" x2="560" y2="70" stroke="#1f2933" stroke-width="2"/>
  <polygon points="74,70 86,70 80,58" fill="#1f2933"/>
  <polygon points="554,70 566,70 560,58" fill="#1f2933"/>
  <text x="320" y="96" text-anchor="middle" fill="#9c6b30">klankkast</text>
  <text x="320" y="30" text-anchor="middle" fill="#1f2933" font-size="14">Monochord: hele snaar 60 cm</text>
  <!-- trillende delen vanaf rechts gemeten: octaaf 30 cm (x=320), kwint 40 cm (x=240), kwart 45 cm (x=200) -->
  <g stroke-width="5">
    <line x1="320" y1="140" x2="560" y2="140" stroke="#3b5bdb"/>
    <line x1="240" y1="175" x2="560" y2="175" stroke="#3b5bdb" stroke-opacity="0.7"/>
    <line x1="200" y1="210" x2="560" y2="210" stroke="#3b5bdb" stroke-opacity="0.45"/>
  </g>
  <g stroke="#1f2933" stroke-dasharray="3 3"><line x1="320" y1="70" x2="320" y2="140"/><line x1="240" y1="70" x2="240" y2="175"/><line x1="200" y1="70" x2="200" y2="210"/></g>
  <g fill="#1f2933">
    <text x="70" y="145">octaaf 2 : 1</text><text x="330" y="134">30 cm</text>
    <text x="70" y="180">kwint 3 : 2</text><text x="250" y="169">40 cm</text>
    <text x="70" y="215">kwart 4 : 3</text><text x="210" y="204">45 cm</text>
  </g>
  <text x="320" y="242" text-anchor="middle" fill="#1f2933">Verhouding hele snaar : trillend deel. Hoe korter het trillende deel, hoe hoger de toon.</text>
</svg>
