<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 316" role="img" aria-label="Egyptische vermenigvuldiging van 13 maal 12 door verdubbelen">
<title>Egyptische vermenigvuldiging van 13 maal 12 door verdubbelen</title>
<rect x="0" y="0" width="380" height="316" fill="#ffffff"/>
<text x="120" y="40" font-family="sans-serif" font-size="16" fill="#9c6b30" text-anchor="middle" font-weight="bold">verdubbel 1</text>
<text x="260" y="40" font-family="sans-serif" font-size="16" fill="#9c6b30" text-anchor="middle" font-weight="bold">verdubbel 12</text>
<line x1="60" y1="52" x2="320" y2="52" stroke="#1f2933" stroke-width="1.5"/>
<rect x="60" y="60" width="260" height="36" rx="6" fill="#f1f3f5" stroke="#3b5bdb" stroke-width="1.5"/>
<path d="M 30 76 l 8 9 l 14 -18" fill="none" stroke="#3b5bdb" stroke-width="3"/>
<text x="120" y="86" font-family="sans-serif" font-size="22" fill="#3b5bdb" text-anchor="middle" font-weight="normal">1</text>
<text x="260" y="86" font-family="sans-serif" font-size="22" fill="#3b5bdb" text-anchor="middle" font-weight="normal">12</text>
<text x="120" y="126" font-family="sans-serif" font-size="22" fill="#1f2933" text-anchor="middle" font-weight="normal">2</text>
<text x="260" y="126" font-family="sans-serif" font-size="22" fill="#1f2933" text-anchor="middle" font-weight="normal">24</text>
<rect x="60" y="140" width="260" height="36" rx="6" fill="#f1f3f5" stroke="#3b5bdb" stroke-width="1.5"/>
<path d="M 30 156 l 8 9 l 14 -18" fill="none" stroke="#3b5bdb" stroke-width="3"/>
<text x="120" y="166" font-family="sans-serif" font-size="22" fill="#3b5bdb" text-anchor="middle" font-weight="normal">4</text>
<text x="260" y="166" font-family="sans-serif" font-size="22" fill="#3b5bdb" text-anchor="middle" font-weight="normal">48</text>
<rect x="60" y="180" width="260" height="36" rx="6" fill="#f1f3f5" stroke="#3b5bdb" stroke-width="1.5"/>
<path d="M 30 196 l 8 9 l 14 -18" fill="none" stroke="#3b5bdb" stroke-width="3"/>
<text x="120" y="206" font-family="sans-serif" font-size="22" fill="#3b5bdb" text-anchor="middle" font-weight="normal">8</text>
<text x="260" y="206" font-family="sans-serif" font-size="22" fill="#3b5bdb" text-anchor="middle" font-weight="normal">96</text>
<line x1="60" y1="228" x2="320" y2="228" stroke="#1f2933" stroke-width="1.5"/>
<text x="120" y="260" font-family="sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1 + 4 + 8 = 13</text>
<text x="260" y="260" font-family="sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">12 + 48 + 96 = 156</text>
<text x="190" y="296" font-family="sans-serif" font-size="20" fill="#3b5bdb" text-anchor="middle" font-weight="bold">13 × 12 = 156</text>
</svg>
