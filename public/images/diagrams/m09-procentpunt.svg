<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 245" role="img" aria-label="Van 20% naar 25%: er komen 5 procentpunten bij, en dat is een kwart van de oude 20%, dus een relatieve stijging van 25%">
<title>Van 20% naar 25%: er komen 5 procentpunten bij, en dat is een kwart van de oude 20%, dus een relatieve stijging van 25%</title>
<rect x="0" y="0" width="500" height="245" fill="#ffffff"/>
<text x="40" y="40" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold" font-style="normal">Oud aandeel: 20%</text>
<rect x="40" y="52" width="80" height="34" fill="#3b5bdb" stroke="#ffffff" stroke-width="2"/>
<text x="80" y="74" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal">5%</text>
<rect x="120" y="52" width="80" height="34" fill="#3b5bdb" stroke="#ffffff" stroke-width="2"/>
<text x="160" y="74" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal">5%</text>
<rect x="200" y="52" width="80" height="34" fill="#3b5bdb" stroke="#ffffff" stroke-width="2"/>
<text x="240" y="74" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal">5%</text>
<rect x="280" y="52" width="80" height="34" fill="#3b5bdb" stroke="#ffffff" stroke-width="2"/>
<text x="320" y="74" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal">5%</text>
<text x="40" y="128" font-family="sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold" font-style="normal">Nieuw aandeel: 25%</text>
<rect x="40" y="140" width="80" height="34" fill="#3b5bdb" stroke="#ffffff" stroke-width="2"/>
<text x="80" y="162" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal">5%</text>
<rect x="120" y="140" width="80" height="34" fill="#3b5bdb" stroke="#ffffff" stroke-width="2"/>
<text x="160" y="162" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal">5%</text>
<rect x="200" y="140" width="80" height="34" fill="#3b5bdb" stroke="#ffffff" stroke-width="2"/>
<text x="240" y="162" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal">5%</text>
<rect x="280" y="140" width="80" height="34" fill="#3b5bdb" stroke="#ffffff" stroke-width="2"/>
<text x="320" y="162" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal">5%</text>
<rect x="360" y="140" width="80" height="34" fill="#9c6b30" stroke="#ffffff" stroke-width="2"/>
<text x="400" y="162" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal">5%</text>
<path d="M 362 108 L 362 102 L 438 102 L 438 108" fill="none" stroke="#9c6b30" stroke-width="2"/>
<text x="400" y="96" font-family="sans-serif" font-size="14" fill="#9c6b30" text-anchor="middle" font-weight="bold" font-style="normal">+5 procentpunten</text>
<text x="40" y="208" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">Het nieuwe stuk (5) is een kwart van het oude aandeel (20):</text>
<text x="40" y="228" font-family="sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold" font-style="normal">relatief is het aandeel met 5/20 = 25% gestegen.</text>
</svg>
