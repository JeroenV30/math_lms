<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Rijgen op de lege getallenlijn: 83 − 47 = 36</title>
  <defs>
    <marker id="pijl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="210" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" fill="#1f2933">83 − 47: eerst 40 terug, dan 7 terug</text>
  <line x1="40" y1="150" x2="640" y2="150" stroke="#1f2933" stroke-width="2"/>
  <!-- ticks -->
  <g stroke="#1f2933" stroke-width="2">
    <line x1="100" y1="142" x2="100" y2="158"/>
    <line x1="170" y1="142" x2="170" y2="158"/>
    <line x1="570" y1="142" x2="570" y2="158"/>
  </g>
  <g font-size="16" fill="#1f2933" text-anchor="middle">
    <text x="100" y="180" font-weight="bold" fill="#3b5bdb">36</text>
    <text x="170" y="180">43</text>
    <text x="570" y="180">83</text>
  </g>
  <circle cx="570" cy="150" r="6" fill="#1f2933"/>
  <circle cx="100" cy="150" r="6" fill="#3b5bdb"/>
  <path d="M570,146 Q370,30 176,144" fill="none" stroke="#3b5bdb" stroke-width="2.5" marker-end="url(#pijl)"/>
  <text x="370" y="80" text-anchor="middle" font-size="17" fill="#3b5bdb">− 40</text>
  <path d="M170,146 Q135,100 106,144" fill="none" stroke="#3b5bdb" stroke-width="2.5" marker-end="url(#pijl)"/>
  <text x="135" y="108" text-anchor="middle" font-size="17" fill="#3b5bdb">− 7</text>
</svg>
