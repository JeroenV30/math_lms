<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="sans-serif" role="img" aria-label="Wisselgeld berekenen door aan te vullen van 13,65 tot 20 euro">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/></marker></defs>
<rect x="0" y="0" width="760" height="260" fill="#ffffff"/>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2933">Wisselgeld door aan te vullen</text>
<line x1="40" y1="170" x2="730" y2="170" stroke="#1f2933" stroke-width="2"/>
<line x1="70" y1="160" x2="70" y2="180" stroke="#1f2933" stroke-width="2"/><text x="70" y="205" text-anchor="middle" font-size="16" fill="#1f2933">€ 13,65</text>
<line x1="170" y1="160" x2="170" y2="180" stroke="#1f2933" stroke-width="2"/><text x="170" y="205" text-anchor="middle" font-size="16" fill="#1f2933">€ 14,00</text>
<line x1="290" y1="160" x2="290" y2="180" stroke="#1f2933" stroke-width="2"/><text x="290" y="205" text-anchor="middle" font-size="16" fill="#1f2933">€ 15,00</text>
<line x1="690" y1="160" x2="690" y2="180" stroke="#1f2933" stroke-width="2"/><text x="690" y="205" text-anchor="middle" font-size="16" fill="#1f2933">€ 20,00</text>
<path d="M70,165 Q120.0,65.0 170,165" fill="none" stroke="#3b5bdb" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="120.0" y="105.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#3b5bdb">+ € 0,35</text>
<path d="M170,165 Q230.0,61.0 290,165" fill="none" stroke="#3b5bdb" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="230.0" y="103.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#3b5bdb">+ € 1,00</text>
<path d="M290,165 Q490.0,5.0 690,165" fill="none" stroke="#3b5bdb" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="490.0" y="75.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#3b5bdb">+ € 5,00</text>
<rect x="200" y="220" width="360" height="30" rx="6" fill="#f1f3f5" stroke="#1f2933"/>
<text x="380" y="241" text-anchor="middle" font-size="15" fill="#1f2933">0,35 + 1,00 + 5,00 = € 6,35 terug</text>
</svg>