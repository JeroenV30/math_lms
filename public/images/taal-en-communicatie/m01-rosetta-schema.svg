<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 384" font-family="Georgia, serif" font-size="13">
<rect width="600" height="384" fill="#ffffff"/>
<text x="300" y="28" text-anchor="middle" font-size="16" fill="#1f2933" font-weight="bold">De Steen van Rosetta: één besluit, drie schriften</text>
<rect x="20" y="46" width="240" height="90" fill="#f8f5ef" stroke="#1f2933" stroke-width="2"/>
<line x1="36" y1="66" x2="244" y2="66" stroke="#9c6b30" stroke-width="3" stroke-dasharray="10 4"/>
<line x1="36" y1="83" x2="244" y2="83" stroke="#9c6b30" stroke-width="3" stroke-dasharray="4 4"/>
<line x1="36" y1="100" x2="244" y2="100" stroke="#9c6b30" stroke-width="3" stroke-dasharray="6 4"/>
<line x1="36" y1="117" x2="244" y2="117" stroke="#9c6b30" stroke-width="3" stroke-dasharray="3 4"/>
<text x="284" y="68" text-anchor="start" font-size="12" fill="#52606d">Bovenste strook</text>
<text x="284" y="89" text-anchor="start" font-size="15" fill="#9c6b30" font-weight="bold">Hiërogliefen</text>
<text x="284" y="108" text-anchor="start" font-size="13" fill="#1f2933">Taal: Egyptisch</text>
<text x="284" y="126" text-anchor="start" font-size="12" fill="#1f2933">Voor tempels en monumenten</text>
<rect x="20" y="150" width="240" height="90" fill="#f8f5ef" stroke="#1f2933" stroke-width="2"/>
<line x1="36" y1="170" x2="244" y2="170" stroke="#9c6b30" stroke-width="3" stroke-dasharray="4 4"/>
<line x1="36" y1="187" x2="244" y2="187" stroke="#9c6b30" stroke-width="3" stroke-dasharray="6 4"/>
<line x1="36" y1="204" x2="244" y2="204" stroke="#9c6b30" stroke-width="3" stroke-dasharray="3 4"/>
<line x1="36" y1="221" x2="244" y2="221" stroke="#9c6b30" stroke-width="3" stroke-dasharray="10 4"/>
<text x="284" y="172" text-anchor="start" font-size="12" fill="#52606d">Middelste strook</text>
<text x="284" y="193" text-anchor="start" font-size="15" fill="#9c6b30" font-weight="bold">Demotisch</text>
<text x="284" y="212" text-anchor="start" font-size="13" fill="#1f2933">Taal: Egyptisch</text>
<text x="284" y="230" text-anchor="start" font-size="12" fill="#1f2933">Snel handschrift voor de administratie</text>
<rect x="20" y="254" width="240" height="90" fill="#f8f5ef" stroke="#1f2933" stroke-width="2"/>
<line x1="36" y1="274" x2="244" y2="274" stroke="#3b5bdb" stroke-width="3" stroke-dasharray="6 4"/>
<line x1="36" y1="291" x2="244" y2="291" stroke="#3b5bdb" stroke-width="3" stroke-dasharray="3 4"/>
<line x1="36" y1="308" x2="244" y2="308" stroke="#3b5bdb" stroke-width="3" stroke-dasharray="10 4"/>
<line x1="36" y1="325" x2="244" y2="325" stroke="#3b5bdb" stroke-width="3" stroke-dasharray="4 4"/>
<text x="284" y="276" text-anchor="start" font-size="12" fill="#52606d">Onderste strook</text>
<text x="284" y="297" text-anchor="start" font-size="15" fill="#3b5bdb" font-weight="bold">Griekse letters</text>
<text x="284" y="316" text-anchor="start" font-size="13" fill="#1f2933">Taal: Oudgrieks</text>
<text x="284" y="334" text-anchor="start" font-size="12" fill="#1f2933">Schrift en taal van het bestuur</text>
<text x="300" y="366" text-anchor="middle" font-size="12" fill="#52606d">Drie schriften, twee talen: het Grieks was te lezen en opende de andere twee.</text>
</svg>
