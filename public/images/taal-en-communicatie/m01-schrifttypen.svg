<text x="570" y="255" text-anchor="end" font-size="12" fill="#52606d">Hebreeuws; Arabisch; Fenicisch</text>
<rect x="20" y="280" width="560" height="46" fill="#f8f5ef" stroke="#1f2933" stroke-width="1.5"/>
