<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="20" y="20" width="260" height="70" rx="8" fill="#edf2ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="150" y="50" text-anchor="middle" fill="#3b5bdb" font-weight="bold">1 Technisch knelpunt?</text>
  <text x="150" y="72" text-anchor="middle" fill="#1f2933" font-size="12">Probleem dat je met bekende kennis niet oplost</text>
  <rect x="20" y="170" width="260" height="70" rx="8" fill="#edf2ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="150" y="200" text-anchor="middle" fill="#3b5bdb" font-weight="bold">2 Technisch nieuw voor jou?</text>
  <text x="150" y="222" text-anchor="middle" fill="#1f2933" font-size="12">Niet algemeen bekend of beschikbaar</text>
  <rect x="20" y="320" width="260" height="70" rx="8" fill="#edf2ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="150" y="350" text-anchor="middle" fill="#3b5bdb" font-weight="bold">3 Zelf aantonen?</text>
  <text x="150" y="372" text-anchor="middle" fill="#1f2933" font-size="12">Prototype, model of applicatie, met technisch risico</text>
  <line x1="150" y1="92" x2="150" y2="168" stroke="#1f2933" stroke-width="2" marker-end="url(#a)"/>
  <text x="160" y="135" fill="#1f2933" font-size="12">ja</text>
  <line x1="150" y1="242" x2="150" y2="318" stroke="#1f2933" stroke-width="2" marker-end="url(#a)"/>
  <text x="160" y="285" fill="#1f2933" font-size="12">ja</text>
  <rect x="380" y="320" width="360" height="70" rx="8" fill="#f8fafc" stroke="#3b5bdb" stroke-width="3"/>
  <text x="560" y="350" text-anchor="middle" fill="#3b5bdb" font-weight="bold">Ontwikkelingsproject (S&amp;O)</text>
  <text x="560" y="372" text-anchor="middle" fill="#1f2933" font-size="12">het S&amp;O eindigt zodra het werkingsprincipe is aangetoond</text>
  <line x1="282" y1="355" x2="378" y2="355" stroke="#3b5bdb" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="345" text-anchor="middle" fill="#3b5bdb" font-size="12">ja</text>
  <rect x="380" y="95" width="360" height="190" rx="8" fill="#f8fafc" stroke="#1f2933" stroke-width="2"/>
  <text x="560" y="122" text-anchor="middle" fill="#1f2933" font-weight="bold">Bij een nee: geen S&amp;O</text>
  <text x="400" y="152" fill="#1f2933" font-size="13">Geen knelpunt: standaardwerk, onderhoud.</text>
  <text x="400" y="178" fill="#1f2933" font-size="13">Alleen nieuw, niet technisch nieuw:</text>
  <text x="400" y="196" fill="#1f2933" font-size="13">engineering met bestaande technieken,</text>
  <text x="400" y="214" fill="#1f2933" font-size="13">configureren, implementeren, eerste gebruik.</text>
  <text x="400" y="240" fill="#1f2933" font-size="13">Niet zelf aangetoond: werk dat een</text>
  <text x="400" y="258" fill="#1f2933" font-size="13">ander voor je oplost, of prototype</text>
  <text x="400" y="276" fill="#1f2933" font-size="13">met gebruikerswaarde.</text>
  <line x1="282" y1="55" x2="378" y2="130" stroke="#1f2933" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="340" y="85" fill="#1f2933" font-size="12">nee</text>
  <line x1="282" y1="205" x2="378" y2="205" stroke="#1f2933" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="330" y="196" text-anchor="middle" fill="#1f2933" font-size="12">nee</text>
</svg>
