<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Stroomschema van wetenschappelijk onderzoek via de Gezondheidsraad en het Voedingscentrum naar het eetpatroon">
<rect width="640" height="260" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b5bdb"/></marker></defs>
<g font-family="sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">
<rect x="10" y="80" width="106" height="90" fill="#edf2ff" stroke="#1f2933" stroke-width="1.5"/>
<text x="63" y="108" font-weight="bold">Onderzoek</text><text x="63" y="128">cohort- en</text><text x="63" y="145">gerandomiseerd</text><text x="63" y="162">onderzoek</text>
<rect x="136" y="80" width="106" height="90" fill="#edf2ff" stroke="#1f2933" stroke-width="1.5"/>
<text x="189" y="108" font-weight="bold">Beoordeling</text><text x="189" y="128">systematisch,</text><text x="189" y="145">bewijsgraad</text><text x="189" y="162">Gezondheidsraad</text>
<rect x="262" y="80" width="106" height="90" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="2"/>
<text x="315" y="108" font-weight="bold">Richtlijnen</text><text x="315" y="128">goede voeding</text><text x="315" y="145">2015, herzien</text><text x="315" y="162">vanaf 2025</text>
<rect x="388" y="80" width="106" height="90" fill="#edf2ff" stroke="#1f2933" stroke-width="1.5"/>
<text x="441" y="108" font-weight="bold">Schijf van Vijf</text><text x="441" y="128">Voedingscentrum</text><text x="441" y="145">vernieuwd</text><text x="441" y="162">april 2026</text>
<rect x="514" y="80" width="116" height="90" fill="#edf2ff" stroke="#1f2933" stroke-width="1.5"/>
<text x="572" y="108" font-weight="bold">Jouw bord</text><text x="572" y="128">boodschappen,</text><text x="572" y="145">recepten,</text><text x="572" y="162">eetpatroon</text>
<text x="320" y="40" font-weight="bold" font-size="15">Van bewijs naar bord</text>
<text x="320" y="220" fill="#3b5bdb">Elke stap is een afweging; nieuw onderzoek kan de richting verschuiven.</text>
</g>
<g stroke="#3b5bdb" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M117 125 L134 125"/><path d="M243 125 L260 125"/><path d="M369 125 L386 125"/><path d="M495 125 L512 125"/></g>
</svg>
