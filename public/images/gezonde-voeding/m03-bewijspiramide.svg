<text x="320" y="255" stroke="none">Dierproeven, mechanismen</text>
<text x="320" y="305" stroke="none" fill="#3b5bdb">Hoe hoger, hoe sterker het bewijs voor oorzaak en gevolg, mits goed uitgevoerd.</text>
<text x="320" y="324" stroke="none">Een meta-analyse is zo goed als de studies waaruit ze bestaat.</text>
