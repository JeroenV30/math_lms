<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Voedingswaardetabel van een fictief product per 100 gram, met pijlen die tonen hoe de energie uit eiwit, koolhydraten en vet volgt">
<rect width="640" height="330" fill="#ffffff"/>
<g font-family="sans-serif" font-size="14" fill="#1f2933">
<rect x="20" y="20" width="300" height="290" fill="none" stroke="#1f2933" stroke-width="2"/>
<text x="32" y="46" font-weight="bold" font-size="16">Voedingswaarde per 100 g</text>
<line x1="20" y1="56" x2="320" y2="56" stroke="#1f2933" stroke-width="2"/>
<text x="32" y="82">Energie</text><text x="308" y="82" text-anchor="end" font-weight="bold">1423 kJ / 340 kcal</text>
<line x1="20" y1="94" x2="320" y2="94" stroke="#1f2933"/>
<text x="32" y="118">Vet</text><text x="308" y="118" text-anchor="end">8 g</text>
<line x1="20" y1="130" x2="320" y2="130" stroke="#1f2933"/>
<text x="46" y="154">waarvan verzadigd</text><text x="308" y="154" text-anchor="end">2 g</text>
<line x1="20" y1="166" x2="320" y2="166" stroke="#1f2933"/>
<text x="32" y="190">Koolhydraten</text><text x="308" y="190" text-anchor="end">55 g</text>
<line x1="20" y1="202" x2="320" y2="202" stroke="#1f2933"/>
<text x="46" y="226">waarvan suikers</text><text x="308" y="226" text-anchor="end">6 g</text>
<line x1="20" y1="238" x2="320" y2="238" stroke="#1f2933"/>
<text x="32" y="262">Eiwit</text><text x="308" y="262" text-anchor="end">12 g</text>
<line x1="20" y1="274" x2="320" y2="274" stroke="#1f2933"/>
<text x="32" y="298">Zout</text><text x="308" y="298" text-anchor="end">0,5 g</text>
</g>
<g font-family="sans-serif" font-size="14" fill="#1f2933" stroke="none">
<text x="360" y="82" font-weight="bold" fill="#3b5bdb">Zo volgt de energie</text>
<text x="360" y="130">Vet: 8 g × 9 = 72 kcal</text>
<text x="360" y="190">Koolhydraten: 55 g × 4 = 220 kcal</text>
<text x="360" y="262">Eiwit: 12 g × 4 = 48 kcal</text>
<text x="360" y="298" font-weight="bold" fill="#3b5bdb">Totaal: 340 kcal ≈ 1423 kJ</text>
</g>
<g stroke="#3b5bdb" stroke-width="1.5" fill="none"><path d="M326 118 L352 126"/><path d="M326 190 L352 186"/><path d="M326 262 L352 258"/></g>
</svg>
