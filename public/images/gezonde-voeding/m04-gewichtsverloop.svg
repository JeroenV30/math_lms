<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Schematische grafiek van gewichtsverlies bij een vast energietekort: de rekenkundige lijn daalt rechtlijnig, de werkelijke lijn vlakt af door aanpassing van verbruik en eetlust">
<rect width="640" height="340" fill="#ffffff"/>
<g font-family="sans-serif" font-size="13" fill="#1f2933">
<line x1="70" y1="40" x2="70" y2="270" stroke="#1f2933" stroke-width="2"/>
<line x1="70" y1="270" x2="600" y2="270" stroke="#1f2933" stroke-width="2"/>
<g stroke="#d5dae0"><line x1="70" y1="86" x2="600" y2="86"/><line x1="70" y1="132" x2="600" y2="132"/><line x1="70" y1="178" x2="600" y2="178"/><line x1="70" y1="224" x2="600" y2="224"/></g>
<text x="62" y="90" text-anchor="end">0 kg</text><text x="62" y="136" text-anchor="end">-5 kg</text><text x="62" y="182" text-anchor="end">-10 kg</text><text x="62" y="228" text-anchor="end">-15 kg</text>
<text x="70" y="290" text-anchor="middle">0</text><text x="203" y="290" text-anchor="middle">3 mnd</text><text x="335" y="290" text-anchor="middle">6 mnd</text><text x="468" y="290" text-anchor="middle">9 mnd</text><text x="600" y="290" text-anchor="middle">12 mnd</text>
<text x="335" y="318" text-anchor="middle">Tijd bij een gelijk dagelijks energietekort (schematisch voorbeeld)</text>
<path d="M70 86 L600 200" stroke="#9c6b30" stroke-width="3" stroke-dasharray="7 5" fill="none"/>
<path d="M70 86 C150 120 230 150 330 165 C430 177 520 180 600 181" stroke="#3b5bdb" stroke-width="3" fill="none"/>
<text x="430" y="110" fill="#9c6b30" font-weight="bold">Rekenregel</text>
<text x="430" y="126" fill="#9c6b30" font-weight="bold">(7.700 kcal per kg)</text>
<text x="470" y="215" fill="#3b5bdb" font-weight="bold">Werkelijk verloop</text>
<text x="470" y="233" fill="#1f2933">verbruik daalt, eetlust stijgt</text>
</g>
</svg>
