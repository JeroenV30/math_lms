<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="sans-serif" font-size="13">
  <rect width="700" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1f2933"/>
    </marker>
  </defs>
  <g stroke="#1f2933" stroke-width="1.5" fill="#ffffff">
    <rect x="20" y="20" width="660" height="50" rx="6"/>
    <rect x="20" y="110" width="660" height="50" rx="6"/>
    <rect x="20" y="320" width="200" height="90" rx="6"/>
    <rect x="250" y="320" width="200" height="90" rx="6"/>
    <rect x="480" y="320" width="200" height="90" rx="6"/>
  </g>
  <g fill="#1f2933" text-anchor="middle">
    <text x="350" y="42">Staatsmiddelen, voordeel, selectief,</text>
    <text x="350" y="60">mededinging en handel: alle vier ja?</text>
    <text x="350" y="132">Dan is het staatssteun (art. 107, lid 1 VWEU)</text>
    <text x="350" y="150">en in beginsel verboden, tenzij een route openstaat.</text>
  </g>
  <g stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="350" y1="70" x2="350" y2="108"/>
    <line x1="350" y1="160" x2="120" y2="318"/>
    <line x1="350" y1="160" x2="350" y2="318"/>
    <line x1="350" y1="160" x2="580" y2="318"/>
  </g>
  <g stroke="#3b5bdb" stroke-width="2" fill="none">
    <rect x="20" y="320" width="200" height="90" rx="6"/>
    <rect x="250" y="320" width="200" height="90" rx="6"/>
    <rect x="480" y="320" width="200" height="90" rx="6"/>
  </g>
  <g fill="#1f2933" text-anchor="middle">
    <text x="120" y="345" font-weight="bold">De-minimis</text>
    <text x="120" y="365">Binnen € 300.000 per</text>
    <text x="120" y="383">drie jaar: geen steun</text>
    <text x="350" y="345" font-weight="bold">AGVV</text>
    <text x="350" y="365">Voldoet aan categorie en</text>
    <text x="350" y="383">steunintensiteit: vrijgesteld</text>
    <text x="580" y="345" font-weight="bold">Aanmelding</text>
    <text x="580" y="365">Commissie toetst per geval,</text>
    <text x="580" y="383">standstill tot het besluit</text>
  </g>
  <text x="350" y="260" text-anchor="middle" fill="#3b5bdb">Drie routes</text>
</svg>
